    <style id="kv-splash-css">
      html, body { background: #fff; margin: 0; }
      html.dark, html.dark body { background: #171717; }
      html.dark .kv-splash { background: #171717; }
      html.dark .kv-word { color: #f1f5f9; }
      html.dark .kv-bar { background: #2e2e2e; }
      .kv-splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #fff; font-family: 'Poppins', system-ui, sans-serif; }
      .kv-logo { width: 132px; height: auto; overflow: visible; }
      .kv-b { transform-box: fill-box; transform-origin: center; opacity: 0; animation: kv-in .6s cubic-bezier(.16,1,.3,1) forwards, kv-wave 1.8s ease-in-out infinite; }
      .kv-b1 { animation-delay: 0s, 1s; }
      .kv-b2 { animation-delay: .18s, 1.18s; }
      .kv-b3 { animation-delay: .36s, 1.36s; }
      .kv-word { color: #0A1628; font-weight: 700; font-size: 18px; letter-spacing: .32em; padding-left: .32em; opacity: 0; animation: kv-fade .6s ease .7s forwards; }
      .kv-bar { position: relative; width: 88px; height: 3px; border-radius: 3px; background: #f1ece9; overflow: hidden; opacity: 0; animation: kv-fade .4s ease 1s forwards; }
      .kv-bar::after { content: ''; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 3px; background: linear-gradient(90deg, #F05A28, #FF7252); animation: kv-slide 1.2s ease-in-out infinite; }
      .kv-resume .kv-b { opacity: 1; animation: kv-wave 1.8s ease-in-out infinite; }
      .kv-resume .kv-b1 { animation-delay: 0s; }
      .kv-resume .kv-b2 { animation-delay: .18s; }
      .kv-resume .kv-b3 { animation-delay: .36s; }
      .kv-resume .kv-word, .kv-resume .kv-bar { opacity: 1; animation: none; }
      .kv-resume .kv-bar::after { animation: kv-slide 1.2s ease-in-out infinite; }
      @keyframes kv-in { from { opacity: 0; transform: translateY(16px) scale(.8); } to { opacity: 1; transform: none; } }
      @keyframes kv-wave { 0%, 100% { transform: translateY(0); } 35% { transform: translateY(-5px); } 70% { transform: translateY(0); } }
      @keyframes kv-fade { to { opacity: 1; } }
      @keyframes kv-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        .kv-b, .kv-resume .kv-b { animation: none; opacity: 1; }
        .kv-word, .kv-bar { animation: none; opacity: 1; }
        .kv-bar::after { animation: none; width: 100%; }
      }
    </style>
  </head>
