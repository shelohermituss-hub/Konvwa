<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="kp-cta-template">
      <style>
        #kd-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: radial-gradient(ellipse 70% 45% at 50% 42%, #ffffff 0%, #f7f1eb 74%);
          color: #0a1628;
          font-family: "Poppins", sans-serif;
        }
        #kd-glow {
          position: absolute;
          left: 140px;
          top: 360px;
          width: 800px;
          height: 800px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(240, 90, 40, 0.2) 0%, rgba(240, 90, 40, 0) 65%);
        }
        #kd-world {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
        }
        #kd-lock {
          position: absolute;
          left: 0;
          right: 0;
          top: 960px;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
        }
        #kd-word {
          display: flex;
          font-size: 176px;
          font-weight: 900;
          line-height: 1;
          letter-spacing: 0.01em;
          white-space: nowrap;
        }
        .kd-ch {
          display: inline-block;
        }
        #kd-tag {
          display: flex;
          gap: 20px;
          margin-top: 26px;
          font-size: 68px;
          font-weight: 700;
          color: #f05a28;
          white-space: nowrap;
        }
        .kd-tw {
          display: inline-block;
        }
        #kd-url {
          margin-top: 46px;
          padding: 14px 40px;
          border-radius: 999px;
          background: #f05a28;
          font-size: 40px;
          font-weight: 700;
          letter-spacing: 0.02em;
          white-space: nowrap;
        }
        #kd-sub {
          margin-top: 30px;
          font-size: 30px;
          font-weight: 400;
          letter-spacing: 0.06em;
          color: #5b6474;
          white-space: nowrap;
        }
        .kd-tile {
          position: absolute;
          width: 170px;
          height: 170px;
          border-radius: 30px;
          background: #ffffff;
          border: 2px solid #efe7e0;
          box-shadow: 0 20px 44px rgba(10, 22, 40, 0.13);
        }
        .kd-tile img {
          position: absolute;
          inset: 14px;
          width: 138px;
          height: 138px;
          object-fit: contain;
          display: block;
        }
      </style>

      <div id="kd-root" data-composition-id="kp-cta" data-width="1080" data-height="1920">
        <div id="kd-glow"></div>
        <div class="kd-tile" id="kd-i0" style="left: 70px; top: 330px"><img src="assets/products/cerave.jpg" alt="" /></div>
        <div class="kd-tile" id="kd-i1" style="left: 846px; top: 250px"><img src="assets/products/r36s.jpg" alt="" /></div>
        <div class="kd-tile" id="kd-i2" style="left: 120px; top: 1540px"><img src="assets/products/ja3-lny.jpg" alt="" /></div>
        <div class="kd-tile" id="kd-i3" style="left: 455px; top: 1590px"><img src="assets/products/powerbeats.jpg" alt="" /></div>
        <div class="kd-tile" id="kd-i4" style="left: 790px; top: 1540px"><img src="assets/products/anua.jpg" alt="" /></div>
        <svg id="kd-world" data-layout-allow-overlap data-layout-allow-occlusion data-layout-allow-overflow viewBox="-540 -960 1080 1920"></svg>
        <div id="kd-lock">
          <div id="kd-word"><span class="kd-ch">K</span><span class="kd-ch">O</span><span class="kd-ch">N</span><span class="kd-ch">V</span><span class="kd-ch">W</span><span class="kd-ch">A</span></div>
          <div id="kd-tag"><span class="kd-tw">Achetez,</span><span class="kd-tw">nous</span><span class="kd-tw">livrons.</span></div>
          <div id="kd-url">Téléchargez l'app · konvwa.shop</div>
          <div id="kd-sub">Particuliers · Revendeurs · Entreprises</div>
        </div>
      </div>

      <script>
        (function () {
          const I = window.ISO;
          const r1 = I.r1;
          const tl = gsap.timeline({ paused: true });
          const R = I.rng(7);

          // trois colis du logo, en escalier (bas-gauche → haut-droite)
          const cols = [
            { c: "#8B2200", tape: "#6B1800" },
            { c: "#E53D15", tape: "#C23010" },
            { c: "#FF7252", tape: "#E05A3A" },
          ];
          function parcel(k) {
            const s = 150;
            const h = 104;
            const sh = I.shade(cols[k].c);
            let g = "";
            if (k === 0) g += `<ellipse cx="-30" cy="${r1(s * 0.5 + 26)}" rx="150" ry="40" fill="rgba(10,22,40,0.12)" id="kd-sh${k}"/>`;
            g += I.box(-s / 2, -s / 2, 0, s, s, h, sh, { shadow: false, edgeW: 2 });
            // bandes du logo sur la face avant
            for (let j = 0; j < 3; j++) g += I.quad("L", s / 2, -s / 2 + 28, s / 2 - 28, 26 + j * 20, 36 + j * 20, I.mix(cols[k].c, "#0A1628", 0.22));
            g += I.quad("R", s / 2, -s / 2, -s / 2 + 22, 0, h, I.mix(cols[k].c, "#0A1628", 0.18));
            g += I.quad("R", s / 2, s / 2 - 22, s / 2, 0, h, I.mix(cols[k].c, "#0A1628", 0.18));
            g += I.quad("T", h, -s / 2, s / 2, -10, 10, I.mix(cols[k].c, "#FFFFFF", 0.32));
            return g;
          }
          const pos = [
            [-210, -210],
            [0, -330],
            [210, -450],
          ];
          let w = "";
          let dots = "";
          for (let k = 0; k < 30; k++) dots += `<circle id="kd-pt${k}" r="${r1(2 + R() * 3)}" fill="${k % 3 ? "#F05A28" : "#0A1628"}" opacity="${(0.15 + R() * 0.3).toFixed(2)}"/>`;
          w += `<g>${dots}</g>`;
          pos.forEach(([x, y], k) => {
            w += `<g transform="translate(${x},${y})"><g id="kd-p${k}">${parcel(k)}</g></g>`;
          });
          const svg = document.getElementById("kd-world");
          svg.innerHTML = w;

          const pts = [];
          for (let k = 0; k < 30; k++) pts.push({ el: document.getElementById("kd-pt" + k), x: -540 + R() * 1080, y: -900 + R() * 1400, v: 18 + R() * 30, ph: R() * 6 });
          const clk = { t: 0 };
          tl.fromTo(
            clk,
            { t: 0 },
            {
              t: 4.4,
              duration: 4.4,
              ease: "none",
              onUpdate: () => {
                pts.forEach((p) => {
                  p.el.setAttribute("cx", r1(p.x + Math.sin(clk.t + p.ph) * 12));
                  p.el.setAttribute("cy", r1(p.y - p.v * clk.t));
                });
              },
            },
            0,
          );

          // chute + rebond des colis, l'un après l'autre
          [0, 1, 2].forEach((k) => {
            const t0 = 0.05 + k * 0.13;
            tl.fromTo("#kd-p" + k, { y: -700, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "bounce.out" }, t0);
            if (k === 0) tl.fromTo("#kd-sh0", { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, t0);
          });
          tl.fromTo("#kd-world", { y: 0 }, { y: -10, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.9);
          // vignettes produits du catalogue
          [[0, -1, 0.5, -7], [1, 1, 0.62, 6], [2, -1, 0.85, -5], [3, 0, 0.95, 3], [4, 1, 1.05, 6]].forEach(([k, side, t0, rot]) => {
            tl.fromTo("#kd-i" + k, { opacity: 0, x: side * 140, y: side ? 0 : 120, scale: 0.5, rotation: rot * 3 }, { opacity: 1, x: 0, y: 0, scale: 1, rotation: rot, duration: 0.5, ease: "back.out(1.7)" }, t0);
          });
          tl.fromTo(["#kd-i0", "#kd-i1"], { y: 0 }, { y: -16, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 1.0);
          tl.fromTo("#kd-glow", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 1.0, ease: "power2.out" }, 0.3);
          tl.fromTo(".kd-ch", { opacity: 0, y: 80, rotationX: -70, transformPerspective: 700 }, { opacity: 1, y: 0, rotationX: 0, duration: 0.5, ease: "power4.out", stagger: 0.05 }, 0.32);
          tl.fromTo(".kd-tw", { opacity: 0, y: 30, scale: 1.3 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "expo.out", stagger: { each: 0.45 } }, 1.42);
          tl.fromTo("#kd-url", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, 2.95);
          tl.fromTo("#kd-sub", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 3.25);

          window.__timelines["kp-cta"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
