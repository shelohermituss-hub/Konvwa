          tl.to("#ka-fly", { opacity: 0, duration: 0.06 }, 1.7);
          tl.fromTo("#ka-toast1", { y: -140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 1.45);
          tl.to("#ka-toast1", { y: -140, opacity: 0, duration: 0.25, ease: "power2.in" }, 2.3);
          tl.to("#ka-c1", { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, 2.35);
          tl.to("#ka-fcart", { scale: 0, opacity: 0, duration: 0.25, ease: "power2.in" }, 2.4);
          // cartn : 1 → 2
          const cartn = document.getElementById("ka-cartn");
          const cn = { v: 1 };
          tl.fromTo(cn, { v: 1 }, { v: 2, duration: 0.01, onUpdate: () => (cartn.textContent = cn.v >= 2 ? "2" : "1") }, 1.45);

          // ---------- 2. En gros ----------
          tl.fromTo("#ka-c2 .ka-cap-t", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.5);
          tl.fromTo("#ka-c2 .ka-cap-s", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 2.85);
          tl.to("#ka-rig", { x: 120, rotationY: -8, transformPerspective: 2200, duration: 0.5, ease: "power3.inOut" }, 2.5);
          tap(395, 303, 2.6);
          tl.to("#ka-seg1", { opacity: 0, duration: 0.15 }, 2.62);
          tl.fromTo("#ka-seg2", { opacity: 0 }, { opacity: 1, duration: 0.15, immediateRender: false }, 2.62);
          tl.to("#ka-retail", { opacity: 0, y: 30, duration: 0.2 }, 2.65);
          tl.fromTo("#ka-whole", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, 2.75);
          const qty = document.getElementById("ka-qty");
          const q = { v: 10 };
          tl.fromTo(q, { v: 10 }, { v: 50, duration: 0.9, ease: "power2.out", onUpdate: () => (qty.textContent = String(Math.round(q.v))) }, 2.95);
          for (let k = 0; k < 6; k++) tl.fromTo("#ka-ct" + k, { y: -500, opacity: 0 }, { y: 0, opacity: 1, duration: 0.32, ease: "bounce.out" }, 3.0 + k * 0.13);
          tl.fromTo("#ka-stsh", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3.0);
          tl.fromTo("#ka-x50", { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 3.85);
          tl.to("#ka-c2", { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, 4.2);
          tl.to(["#ka-ct0", "#ka-ct1", "#ka-ct2", "#ka-ct3", "#ka-ct4", "#ka-ct5", "#ka-x50", "#ka-stsh"], { opacity: 0, duration: 0.25 }, 4.25);

          // ---------- 3. Expédition ----------
          tap(264, 1040, 4.35);
          tl.set("#ka-n4", { attr: { class: "ka-ni" } }, 4.4);
          tl.set("#ka-n3", { attr: { class: "ka-ni on" } }, 4.4);
          go("#ka-prods", "#ka-ships", 4.42);
          tl.set("#ka-new", { opacity: 0, y: 40 }, 0);
          tl.set("#ka-sheet", { y: 640 }, 0);
          tl.set("#ka-copy-b", { opacity: 0 }, 0);
          tl.to("#ka-rig", { x: 150, rotationY: -10, transformPerspective: 2200, duration: 0.5, ease: "power3.inOut" }, 4.45);
          tl.fromTo("#ka-c3 .ka-cap-t", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 4.5);
          tl.fromTo("#ka-wh", { boxShadow: "0 0 0 0 rgba(232,80,31,0)" }, { boxShadow: "0 0 0 6px rgba(232,80,31,0.8)", duration: 0.3, yoyo: true, repeat: 3 }, 4.75);
          tl.fromTo("#ka-fac", { scale: 0, opacity: 0, transformOrigin: "50% 80%" }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.8)" }, 4.9);
          tap(264, 325, 5.35);
          tl.to("#ka-sheet", { y: 0, duration: 0.42, ease: "power3.out" }, 5.5);
          tl.to("#ka-c3", { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, 6.0);
          tl.fromTo("#ka-c4 .ka-cap-t", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.12 }, 6.15);
          tap(264, 711, 6.55);
          tl.to("#ka-copy-a", { opacity: 0, duration: 0.1 }, 6.62);
          tl.to("#ka-copy-b", { opacity: 1, duration: 0.1 }, 6.62);
          tl.to("#ka-copy", { backgroundColor: "#22C55E", duration: 0.15 }, 6.62);
          // l'adresse part chez le fournisseur, le camion livre l'entrepôt
          tl.fromTo("#ka-label", { x: 560, y: 1500, scale: 0.4, opacity: 0 }, { x: 560, y: 1500, scale: 0.4, opacity: 1, duration: 0.02 }, 6.65);
          tl.to("#ka-label", { x: 260, y: 700, scale: 1, duration: 0.5, ease: "power3.inOut" }, 6.68);
          tl.to("#ka-label", { opacity: 0, scale: 0.6, duration: 0.2 }, 7.2);
          tl.fromTo("#ka-route", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 6.9);
          tl.fromTo("#ka-whs", { scale: 0, opacity: 0, transformOrigin: "50% 80%" }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.8)" }, 6.95);
          tl.to("#ka-sheet", { y: 640, duration: 0.35, ease: "power2.in" }, 7.4);
          const route = { u: 0 };
          const rEl = document.getElementById("ka-route");
          const RL = rEl.getTotalLength();
          const RP = [];
          for (let k = 0; k <= 100; k++) {
            const p = rEl.getPointAtLength((k / 100) * RL);
            RP.push([p.x, p.y]);
          }
          const truck = document.getElementById("ka-truck");
          tl.fromTo(
            route,
            { u: 0 },
            {
              u: 1,
              duration: 1.1,
              ease: "power1.inOut",
              onUpdate: () => {
                const p = RP[Math.round(route.u * 100)];
                truck.setAttribute("transform", `translate(${r1(p[0])},${r1(p[1])})`);
                truck.setAttribute("opacity", route.u > 0 && route.u < 1 ? "1" : "0");
              },
            },
            7.0,
          );
          tl.to("#ka-c4", { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, 8.2);
          tl.fromTo("#ka-c5 .ka-cap-t", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.12 }, 8.35);
          tl.to("#ka-new", { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, 8.4);
          tl.fromTo("#ka-toast2", { y: 140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 8.6);
          tl.to("#ka-whs", { scale: 1.12, duration: 0.15, yoyo: true, repeat: 1 }, 8.1);
          tl.to(["#ka-flow"], { opacity: 0, duration: 0.3 }, 9.3);
          tl.to("#ka-c5", { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, 9.35);

          // ---------- 4. Paiement ----------
          tl.to("#ka-rig", { x: 0, rotationY: 0, transformPerspective: 2200, duration: 0.5, ease: "power3.inOut" }, 9.35);
          go("#ka-ships", "#ka-pay", 9.42);
          tl.set("#ka-ok", { opacity: 0 }, 0);
          tl.set("#ka-ring", { opacity: 0 }, 0);
          tl.fromTo("#ka-c6 .ka-cap-t", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 9.5);
          tl.set(".ka-pay", { opacity: 0.35 }, 0);
          tl.fromTo("#ka-pays", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35 }, 9.6);
          const PMX = [0, 163, 326];
          [["#ka-p1", 9.8, 0], ["#ka-p2", 11.2, 1], ["#ka-p3", 12.05, 2]].forEach(([chip, t0, k]) => {
            tl.to(chip, { opacity: 1, backgroundColor: "#F05A28", borderColor: "#F05A28", scale: 1.08, duration: 0.2, ease: "power2.out" }, t0);
            tl.to(chip, { scale: 1, duration: 0.2 }, t0 + 0.2);
            tl.to("#ka-ring", { opacity: 1, x: PMX[k], duration: k === 0 ? 0.01 : 0.25, ease: "power3.inOut" }, t0);
            tap(101 + PMX[k], 498, t0);
          });
          tap(264, 626, 12.6);
          tl.fromTo("#ka-paybtn", { scale: 1 }, { scale: 0.95, duration: 0.08, yoyo: true, repeat: 1 }, 12.6);
          tl.to("#ka-ok", { opacity: 1, duration: 0.25 }, 12.75);
          tl.fromTo("#ka-ok i", { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(2.2)" }, 12.78);
          tl.to("#ka-c6", { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, 13.1);

          // ---------- 5. Suivi ----------
          go("#ka-pay", "#ka-trk", 13.15);
          tl.fromTo("#ka-c7 .ka-cap-t", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 13.3);
          for (let k = 0; k < STEPS.length; k++) {
            tl.fromTo("#ka-so" + k, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "back.out(2)" }, 13.42 + k * 0.2);
            if (k < STEPS.length - 1) tl.fromTo("#ka-sl" + k, { scaleY: 0 }, { scaleY: 1, duration: 0.18, ease: "none" }, 13.5 + k * 0.2);
          }
          tl.fromTo("#ka-rig", { scale: 1 }, { scale: 1.03, duration: 1.2, ease: "sine.inOut", immediateRender: false }, 13.4);

          window.__timelines["kp-app"] = tl;
        })();
      </script>
    </template>
