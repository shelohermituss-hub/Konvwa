        const RAW = [0.0, 0.284, 0.397, 0.511, 1.248, 1.645, 2.213, 2.325, 2.553, 2.95, 3.234, 3.347, 3.571, 3.915, 4.027, 4.135, 4.375, 4.675, 4.915, 5.035, 5.335, 5.935, 6.355, 6.475, 6.775, 6.895, 7.315, 7.743, 7.965, 8.187, 8.575, 8.741, 9.185, 9.295, 9.406, 9.738, 10.293, 10.957, 11.068, 11.219, 11.606, 11.867, 12.064, 12.325, 12.781, 12.977, 13.173, 13.434, 13.629, 13.955, 14.347, 14.608, 14.739, 15.065, 15.326, 15.522, 15.967, 16.333, 16.513, 16.897, 17.367, 17.487, 17.967, 18.139, 18.93, 19.224, 19.961, 20.109, 20.624, 20.771, 21.549, 21.646, 22.279, 22.669, 22.814, 22.961, 23.301, 23.447, 23.885, 23.934, 24.178, 24.38, 24.43, 24.858, 25.162, 25.283, 25.648, 25.83, 26.316, 26.681, 27.106, 27.227, 27.652, 27.956, 28.078, 28.442, 28.564, 28.746, 29.054, 29.162, 29.544, 29.7, 29.934, 30.247, 30.698, 31.084, 31.55, 31.724, 31.783, 31.899, 32.275, 32.569, 33.486, 33.793, 33.906, 34.133, 34.388]
        const T = RAW.map((t) => Math.round((0.2 + t) * 100) / 100)
        const WORDS = ["Haïti", "et", "le", "Liechtenstein", "avaient", "exactement", "le", "même", "drapeau.", "Bleu", "en", "haut,", "rouge", "en", "bas.", "Le", "nôtre", "naît", "en", "1803 :", "Dessalines", "arrache", "le", "blanc", "du", "drapeau", "français.", "Le", "leur", "reprend", "les", "couleurs", "de", "la", "maison", "princière,", "officialisées", "en", "1921.", "Deux", "pays", "que", "tout", "oppose :", "160", "km²", "dans", "les", "Alpes,", "contre", "près", "de", "28 000", "dans", "les", "Caraïbes.", "Pendant", "des", "années,", "personne", "ne", "remarque", "rien…", "Jusqu'aux", "Jeux", "olympiques", "de", "Berlin,", "en", "1936.", "Le", "Liechtenstein", "découvre", "que", "son", "drapeau", "est", "identique", "à", "celui", "d'Haïti.", "Alors,", "en", "1937,", "il", "ajoute", "une", "couronne", "dorée,", "symbole", "de", "l'union", "entre", "le", "prince", "et", "son", "peuple.", "Et", "Haïti ?", "Haïti", "n'a", "rien", "changé.", "C'est", "l'Europe", "qui", "a", "dû", "changer.", "Pas", "nous.", "Abonnez-vous", "pour", "d'autres", "histoires", "d'Haïti."]

        // ---------- blocks of stacked lines: [first word, last word, style, colour?]; y = top of the block ----------
        const BLOCKS = [
          { y: 220, lines: [[0, 2, 's'], [3, 3, 'b', BLUE], [4, 7, 's'], [8, 8, 'bi', RED]] },
          { y: 300, lines: [[9, 11, 'mi', BLUE], [12, 14, 'mi', RED]] },
          { y: 200, lines: [[15, 18, 's'], [19, 19, 'b', BLUE], [20, 20, 'mi', RED], [21, 23, 's'], [24, 26, 's']] },
          { y: 220, lines: [[27, 31, 's'], [32, 35, 's'], [36, 37, 's'], [38, 38, 'b', RED]] },
          { y: 240, lines: [[39, 40, 'm'], [41, 43, 'm']], until: 56 },
          { y: 1340, lines: [[44, 48, 's'], [49, 52, 's'], [53, 55, 's']] },
          { y: 240, lines: [[56, 58, 's'], [59, 61, 'm'], [62, 62, 'mi', BLUE]] },
          { y: 220, lines: [[63, 65, 's'], [66, 68, 's'], [69, 69, 'x', BLUE]] },
          { y: 220, lines: [[70, 72, 's'], [73, 76, 's'], [77, 77, 'b', RED], [78, 80, 's']] },
          { y: 200, lines: [[81, 83, 'm'], [84, 86, 's'], [87, 88, 'mi', BLUE], [89, 92, 's'], [93, 97, 's']] },
          { y: 300, lines: [[98, 99, 'm']] },
          { y: 300, lines: [[100, 103, 'm']] },
          { y: 260, lines: [[104, 105, 'm'], [106, 109, 's']], until: 112 },
          { y: 1330, lines: [[110, 111, 'h', RED]] },
          { y: 600, lines: [[112, 112, 'm'], [113, 116, 's']] },
        ]
        const blocksBox = $('blocks')
        BLOCKS.forEach((B, bi) => {
          const first = B.lines[0][0]
          const start = Math.max(0, T[first] - 0.06)
          const next = BLOCKS[bi + 1]
          const end = B.until != null ? T[B.until] - 0.08 : next ? T[next.lines[0][0]] - 0.08 : END
          const box = el('div', 'block', null, blocksBox)
          box.style.top = B.y + 'px'
          gsap.set(box, { autoAlpha: 0 })
          tl.set(box, { autoAlpha: 1 }, start)
          B.lines.forEach(([a, b, st, col]) => {
            const line = el('div', 'line ' + st, null, box)
            for (let k = a; k <= b; k++) {
              const w = el('span', 'w', WORDS[k], line)
              // each word lands blurred and pale, then settles (reference K, faster)
              tl.fromTo(w, { opacity: 0, color: '#B9B9B9', y: 12, filter: blur(8) }, { opacity: 1, y: 0, filter: blur(0), duration: 0.16, ease: 'power2.out' }, T[k])
              tl.to(w, { color: col || '#141414', duration: 0.25, ease: 'power1.out' }, T[k] + 0.08)
            }
          })
          if (end < END) tl.to(box, { autoAlpha: 0, filter: blur(10), y: -16, duration: 0.14, ease: 'power2.in' }, end - 0.14)
        })

        // ---------- short full-frame blur between parts (the reference never cuts) ----------
        const morph = (at) => {
          tl.to('#world', { filter: blur(26), duration: 0.16, ease: 'power2.in' }, at - 0.16)
          tl.to('#veil', { opacity: 0.5, duration: 0.16, ease: 'power2.in' }, at - 0.16)
          tl.to('#world', { filter: blur(0), duration: 0.24, ease: 'power2.out' }, at + 0.02)
          tl.to('#veil', { opacity: 0, duration: 0.24, ease: 'power2.out' }, at + 0.02)
        }
        const MORPHS = [9, 15, 27, 39, 56, 63, 70, 81, 98, 112].map((k) => Math.round((T[k] - 0.1) * 100) / 100)
        MORPHS.forEach(morph)

        const pop = (sel, at, o) => tl.fromTo(sel, Object.assign({ autoAlpha: 0, scale: 0.84, y: 70, filter: blur(14) }, o), { autoAlpha: 1, scale: 1, y: 0, x: 0, rotation: 0, filter: blur(0), duration: 0.38, ease: 'expo.out' }, at)
        const hide = (sel, at) => tl.set(sel, { autoAlpha: 0 }, at)
        // a drawn flag (blue over red), or an image flag, with a soft moving fold
        const flag = (parent, x, y, w, h, img) => {
          const f = el('div', 'flag', null, parent)
          Object.assign(f.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' })
          if (img) { const i = el('img', '', null, f); i.src = img; i.alt = '' } else { el('div', 'band top', null, f); el('div', 'band bot', null, f) }
          el('div', 'wave', null, f)
          return f
        }
        const wave = (f, from, to) => tl.fromTo(f.querySelector('.wave'), { backgroundPosition: '0px 0px' }, { backgroundPosition: -Math.round((to - from) * 320) + 'px 0px', duration: to - from, ease: 'none', immediateRender: false }, from)
        const cap = (parent, txt, x, y, w) => { const c = el('div', 'cap', txt, parent); Object.assign(c.style, { left: x + 'px', top: y + 'px', width: w + 'px' }); return c }
        gsap.set(['#o-pair', '#o-build', '#o-tri', '#o-1803', '#c-li', '#o-1921', '#sq-ht', '#sq-li', '#ch-li', '#ch-ht', '#o-count', '#o-torch', '#o-poles', '#o-eq', '#o-stamp', '#o-li', '#o-1937', '#o-crown', '#ch-union', '#o-ht', '#o-q', '#o-ok', '#o-sub', '#o-hand'], { autoAlpha: 0 })
        tl.to('#grid', { opacity: 1, duration: 0.4 }, 0.05)

        // ---------- 1. hook: two flags from the sides lie on top of each other on "même drapeau" ----------
        const pair = $('o-pair')
        tl.set(pair, { autoAlpha: 1 }, 0)
        const fA = flag(pair, 110, 900, 400, 250)
        const fB = flag(pair, 570, 900, 400, 250)
        const cA = cap(pair, 'Haïti', 110, 1180, 400)
        const cB = cap(pair, 'Liechtenstein', 570, 1180, 400)
        tl.fromTo(fA, { x: -640, rotation: -14 }, { x: 0, rotation: -3, duration: 0.5, ease: 'expo.out' }, 0)
        tl.fromTo(fB, { x: 640, rotation: 14 }, { x: 0, rotation: 3, duration: 0.5, ease: 'expo.out' }, 0.06)
        tl.fromTo([cA, cB], { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.3, stagger: 0.08 }, 0.35)
        tl.to(fA, { x: 230, rotation: 0, duration: 0.28, ease: 'power3.in' }, T[7] - 0.28)
        tl.to(fB, { x: -230, rotation: 0, duration: 0.28, ease: 'power3.in' }, T[7] - 0.28)
        tl.to([cA, cB], { autoAlpha: 0, duration: 0.15 }, T[7] - 0.25)
        tl.fromTo([fA, fB], { scale: 1 }, { scale: 1.12, duration: 0.1, yoyo: true, repeat: 1, ease: 'power2.out', immediateRender: false }, T[7])
        wave(fA, 0, MORPHS[0])
        wave(fB, 0, MORPHS[0])
        hide(pair, MORPHS[0])

        // ---------- 2. "blue on top, red below" ----------
        const build = $('o-build')
        const fC = flag(build, 130, 820, 820, 512)
        fC.style.background = '#d4d4d4'
        const topBand = fC.querySelector('.top')
        const botBand = fC.querySelector('.bot')
        topBand.textContent = 'BLEU'
        botBand.textContent = 'ROUGE'
        topBand.style.fontSize = botBand.style.fontSize = '64px'
        tl.set(build, { autoAlpha: 1 }, MORPHS[0])
        pop(fC, MORPHS[0] + 0.02, { scale: 0.9 })
        tl.fromTo(topBand, { yPercent: -100 }, { yPercent: 0, duration: 0.32, ease: 'back.out(2)' }, T[9])
        tl.fromTo(botBand, { yPercent: 100 }, { yPercent: 0, duration: 0.32, ease: 'back.out(2)' }, T[12])
        wave(fC, MORPHS[0], MORPHS[1])
        hide(build, MORPHS[1])

        // ---------- 3. 1803: Dessalines tears the white out of the French flag ----------
        pop('#o-tri', MORPHS[1] + 0.02, { scale: 0.9 })
        pop('#o-1803', T[19] - 0.05, { scale: 0.3, rotation: 14 })
        tl.to('#t-white', { y: -760, x: 120, rotation: 28, duration: 0.45, ease: 'power3.in' }, T[21] + 0.05)
        tl.to('#t-blue', { x: 137, duration: 0.3, ease: 'back.out(1.6)' }, T[21] + 0.35)
        tl.to('#t-red', { x: -137, duration: 0.3, ease: 'back.out(1.6)' }, T[21] + 0.35)
        tl.to('#t-blue', { backgroundColor: BLUE, duration: 0.3 }, T[21] + 0.6)
        tl.to('#t-red', { backgroundColor: RED, duration: 0.3 }, T[21] + 0.6)
        hide(['#o-tri', '#o-1803'], MORPHS[2])

        // ---------- 4. 1921: Liechtenstein's princely colours ----------
        pop('#c-li', MORPHS[2] + 0.02, { x: 160, rotation: 8 })
        tl.fromTo('#li-img', { scale: 1.18 }, { scale: 1, duration: MORPHS[3] - MORPHS[2], ease: 'none' }, MORPHS[2])
        pop('#o-1921', T[36], { scale: 0.3, rotation: -14 })
        hide(['#c-li', '#o-1921'], MORPHS[3])

        // ---------- 5. size to scale: a dot of 160 km², then Haïti grows from it ----------
        pop('#sq-li', T[44] - 0.05, { scale: 0.2 })
        pop('#ch-li', T[44] + 0.05, { scale: 0.5 })
        tl.fromTo('#sq-ht', { autoAlpha: 0, scale: 0.075, transformOrigin: '50% 50%' }, { autoAlpha: 1, scale: 1, duration: 0.55, ease: 'expo.out' }, T[52] - 0.05)
        tl.to('#sq-li', { x: 349, y: -317, duration: 0.45, ease: 'expo.out' }, T[52] - 0.05)
        tl.to('#ch-li', { x: 160, y: -260, scale: 0.8, duration: 0.45, ease: 'expo.out' }, T[52] - 0.05)
        pop('#ch-ht', T[52] + 0.3, { scale: 0.5 })
        hide(['#sq-ht', '#sq-li', '#ch-li', '#ch-ht'], MORPHS[4])

        // ---------- 6. years go by: 1921 → 1935 ----------
        pop('#o-count', MORPHS[4] + 0.02, { scale: 0.85 })
        const yr = { v: 1921 }
        tl.fromTo(yr, { v: 1921 }, { v: 1935, duration: MORPHS[5] - MORPHS[4] - 0.4, ease: 'power1.in', immediateRender: false, onUpdate: () => { $('year').textContent = String(Math.round(yr.v)) } }, MORPHS[4] + 0.2)
        tl.set('#year', { textContent: '1921' }, MORPHS[4])
        hide('#o-count', MORPHS[5])

        // ---------- 7. Berlin 1936 (drum roll into "1936") ----------
        pop('#o-torch', MORPHS[5] + 0.02)
        tl.fromTo('#torch-img', { scale: 1.25, x: -30 }, { scale: 1.02, x: 20, duration: MORPHS[6] - MORPHS[5], ease: 'none' }, MORPHS[5])
        tl.fromTo('#o-torch', { x: 0 }, { x: 8, duration: 0.05, yoyo: true, repeat: 7, ease: 'none', immediateRender: false }, T[69] - 0.03)
        hide('#o-torch', MORPHS[6])

        // ---------- 8. both flags up their poles, "=", then the stamp on "identique" ----------
        const poles = $('o-poles')
        tl.set(poles, { autoAlpha: 1 }, MORPHS[6])
        const p1 = el('div', 'pole', null, poles)
        Object.assign(p1.style, { left: '110px', top: '640px', height: '760px' })
        const p2 = el('div', 'pole', null, poles)
        Object.assign(p2.style, { left: '590px', top: '640px', height: '760px' })
        const f1 = flag(poles, 124, 660, 380, 238)
        const f2 = flag(poles, 604, 660, 380, 238)
        f1.style.borderRadius = f2.style.borderRadius = '0 10px 10px 0'
        const c1 = cap(poles, 'Haïti', 30, 1420, 380)
        const c2 = cap(poles, 'Liechtenstein', 480, 1420, 520)
        tl.fromTo([p1, p2], { scaleY: 0, transformOrigin: '50% 100%' }, { scaleY: 1, duration: 0.3, ease: 'expo.out', stagger: 0.06 }, MORPHS[6] + 0.02)
        tl.fromTo(f1, { y: 560 }, { y: 0, duration: 0.6, ease: 'power3.out' }, MORPHS[6] + 0.15)
        tl.fromTo(f2, { y: 560 }, { y: 0, duration: 0.6, ease: 'power3.out' }, MORPHS[6] + 0.3)
        tl.fromTo([c1, c2], { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.25 }, MORPHS[6] + 0.3)
        tl.fromTo('#o-eq', { autoAlpha: 0, scale: 0.2 }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: 'back.out(3)' }, T[75])
        tl.fromTo('#o-stamp', { autoAlpha: 0, scale: 2.6, rotation: -2 }, { autoAlpha: 1, scale: 1, rotation: -8, duration: 0.18, ease: 'power4.in' }, T[77] - 0.05)
        tl.fromTo('#world', { x: 0 }, { x: 10, duration: 0.04, yoyo: true, repeat: 5, ease: 'none', immediateRender: false }, T[77] + 0.13)
        wave(f1, MORPHS[6], MORPHS[7])
        wave(f2, MORPHS[6], MORPHS[7])
        hide(['#o-poles', '#o-eq', '#o-stamp'], MORPHS[7])

        // ---------- 9. 1937: the crown, symbol of the prince and his people ----------
        const liBox = $('o-li')
        const fL = flag(liBox, 130, 760, 820, 512)
        const cL = cap(liBox, 'Liechtenstein', 130, 1290, 820)
        tl.set(liBox, { autoAlpha: 1 }, MORPHS[7])
        pop(fL, MORPHS[7] + 0.02, { scale: 0.9 })
        tl.fromTo(cL, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.25 }, MORPHS[7] + 0.2)
        pop('#o-1937', T[83] - 0.05, { scale: 0.3, rotation: 12 })
        tl.fromTo('#o-crown', { autoAlpha: 0, y: -620, rotation: -25, scale: 1.3 }, { autoAlpha: 1, y: 0, rotation: 0, scale: 1, duration: 0.55, ease: 'bounce.out' }, T[87] - 0.1)
        pop('#ch-union', T[91] - 0.05, { scale: 0.4 })
        tl.to(cL, { autoAlpha: 0, duration: 0.15 }, T[91] - 0.1)
        wave(fL, MORPHS[7], MORPHS[8])
        hide(['#o-li', '#o-1937', '#o-crown', '#ch-union'], MORPHS[8])

        // ---------- 10–11. Haïti changed nothing; the punchline ----------
        const htBox = $('o-ht')
        const fH = flag(htBox, 130, 760, 820, 492, 'assets/img/drapeau-haiti.png')
        const cH = cap(htBox, 'Haïti', 130, 1270, 820)
        tl.set(htBox, { autoAlpha: 1 }, MORPHS[8])
        pop(fH, MORPHS[8] + 0.02, { scale: 0.9 })
        tl.fromTo(cH, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.25 }, MORPHS[8] + 0.2)
        pop('#o-q', T[99] + 0.05, { scale: 0.2, rotation: -20 })
        tl.to('#o-q', { rotation: 10, duration: 0.2, yoyo: true, repeat: 1, ease: 'sine.inOut' }, T[99] + 0.45)
        hide('#o-q', T[103])
        pop('#o-ok', T[103], { scale: 0.2, rotation: -30 })
        tl.to([cH, '#o-ok'], { autoAlpha: 0, duration: 0.15 }, T[110] - 0.15)
        tl.to(fH, { scale: 1.1, rotation: -2, duration: 0.22, ease: 'back.out(3)' }, T[110])
        tl.fromTo('#world', { y: 0 }, { y: 12, duration: 0.04, yoyo: true, repeat: 5, ease: 'none', immediateRender: false }, T[110] + 0.05)
        wave(fH, MORPHS[8], MORPHS[9])
        hide(['#o-ht', '#o-q', '#o-ok'], MORPHS[9])

        // ---------- 12. subscribe: the button, a tap, "Abonné ✓" ----------
        pop('#o-sub', MORPHS[9] + 0.02, { scale: 0.5 })
        tl.fromTo('#o-hand', { autoAlpha: 0, x: 260, y: 300 }, { autoAlpha: 1, x: 0, y: 0, duration: 0.35, ease: 'power3.out' }, T[113])
        tl.to('#o-hand', { scale: 0.85, duration: 0.07, yoyo: true, repeat: 1 }, T[115])
        tl.to('#o-sub', { scale: 0.94, duration: 0.07, yoyo: true, repeat: 1 }, T[115])
        tl.to('#o-sub', { backgroundColor: '#2b2b2b', boxShadow: '0 26px 50px rgba(0, 0, 0, 0.25)', duration: 0.18 }, T[115] + 0.1)
        tl.set('#sub-txt', { textContent: 'Abonné ✓' }, T[115] + 0.1)

        // slow camera push over the whole film
        tl.fromTo('#world', { scale: 1 }, { scale: 1.04, duration: END, ease: 'none', immediateRender: false }, 0)

        window.__timelines = window.__timelines || {}
        window.__timelines['main'] = tl
      })()
    </script>
  </body>
