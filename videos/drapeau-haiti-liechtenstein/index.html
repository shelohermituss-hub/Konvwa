    <script>
      ;(function () {
        const tl = gsap.timeline({ paused: true })

        const blur = (n) => 'blur(' + n + 'px)'
        const END = 30
        const BLUE = '#00209F'
        const RED = '#D21034'

        // ---------- the voice: start of each spoken word in assets/vo/vo.wav (starts at 0.2 s) ----------
        const RAW = [0, 0.72, 0.77, 0.82, 2.01, 2.513, 2.656, 2.944, 3.76, 3.833, 3.911, 4.69, 4.855, 4.921, 5.53, 5.58, 5.661, 5.783, 6.85, 7.302, 7.433, 7.691, 7.885, 8.55, 8.861, 9.004, 9.146, 10.03, 10.912, 11.303, 12.284, 12.48, 13.63, 14.49, 14.663, 14.831, 15.292, 15.522, 16.67, 17.43, 17.48, 18.75, 18.874, 19.676, 20.047, 20.233, 20.727, 20.912, 21.035, 21.48, 21.526, 21.827, 22.59, 22.92, 23.08, 23.3, 24.04, 24.3, 24.72, 24.85, 25.15, 25.33, 26.37, 26.5, 27.22, 27.6, 27.7, 27.8]
        const T = RAW.map((t) => Math.round((0.2 + t) * 100) / 100)
        const WORDS = ['Haïti', 'et', 'le', 'Liechtenstein', 'avaient', 'le', 'même', 'drapeau.', 'Bleu', 'en', 'haut,', 'rouge', 'en', 'bas.', "L'un", 'dans', 'les', 'Caraïbes,', "l'autre", 'au', 'cœur', 'des', 'Alpes.', 'Personne', 'ne', 'le', 'remarque…', "jusqu'aux", 'Jeux', 'olympiques', 'de', '1936.', 'Surprise :', 'les', 'deux', 'drapeaux', 'sont', 'identiques !', 'Alors,', 'en', '1937,', 'le', 'Liechtenstein', 'ajoute', 'une', 'couronne', 'sur', 'le', 'sien.', 'Et', 'Haïti ?', '', 'Haïti', "n'a", 'rien', 'changé.', "C'est", "l'Europe", 'qui', 'a', 'dû', 'changer.', 'Pas', 'nous.', 'Abonnez-vous', 'pour', 'la', 'suite.']

        // ---------- blocks of stacked lines: [first word, last word, style, colour?]; y = top of the block ----------
        const BLOCKS = [
          { y: 220, lines: [[0, 2, 's'], [3, 3, 'b', BLUE], [4, 6, 's'], [7, 7, 'bi', RED]] },
          { y: 300, lines: [[8, 10, 'mi', BLUE], [11, 13, 'mi', RED]] },
          { y: 220, lines: [[14, 16, 's'], [17, 17, 'mi', BLUE], [18, 21, 's'], [22, 22, 'mi', RED]] },
          { y: 240, lines: [[23, 26, 'm']] },
          { y: 220, lines: [[27, 30, 's'], [31, 31, 'x', BLUE]] },
          { y: 220, lines: [[32, 32, 'b', RED], [33, 35, 's'], [36, 37, 'm']] },
          { y: 220, lines: [[38, 40, 'm'], [41, 43, 's'], [44, 45, 'bi', BLUE], [46, 48, 's']] },
          { y: 300, lines: [[49, 50, 'm']] },
          { y: 300, lines: [[52, 55, 'm']] },
          { y: 260, lines: [[56, 57, 'm'], [58, 61, 's']], until: 64 },
          { y: 1330, lines: [[62, 63, 'h', RED]] },
          { y: 600, lines: [[64, 64, 'm'], [65, 67, 's']] },
        ]
        const blocksBox = $('blocks')
        BLOCKS.forEach((B, bi) => {
          const first = B.lines[0][0]
          const start = Math.max(0, T[first] - 0.06)
          const next = BLOCKS[bi + 1]
          const end = B.until != null ? T[B.until] - 0.08 : next ? T[next.lines[0][0]] - 0.08 : END
          const box = el('div', 'block', null, blocksBox)
          box.style.top = B.y + 'px'
          gsap.set(box, { autoAlpha: 0 })
          tl.set(box, { autoAlpha: 1 }, start)
          B.lines.forEach(([a, b, st, col]) => {
            const line = el('div', 'line ' + st, null, box)
            for (let k = a; k <= b; k++) {
              if (!WORDS[k]) continue
              const w = el('span', 'w', WORDS[k], line)
              // each word lands blurred and pale, then settles (reference K)
              tl.fromTo(w, { opacity: 0, color: '#B9B9B9', y: 10, filter: blur(8) }, { opacity: 1, y: 0, filter: blur(0), duration: 0.22, ease: 'power2.out' }, T[k])
              tl.to(w, { color: col || '#141414', duration: 0.35, ease: 'power1.out' }, T[k] + 0.12)
            }
          })
          if (end < END) tl.to(box, { autoAlpha: 0, filter: blur(10), y: -16, duration: 0.18, ease: 'power2.in' }, end - 0.18)
        })

        // ---------- full-frame blur between parts (the reference never cuts) ----------
        const morph = (at) => {
          tl.to('#world', { filter: blur(28), duration: 0.22, ease: 'power2.in' }, at - 0.22)
          tl.to('#veil', { opacity: 0.55, duration: 0.22, ease: 'power2.in' }, at - 0.22)
          tl.to('#world', { filter: blur(0), duration: 0.32, ease: 'power2.out' }, at + 0.02)
          tl.to('#veil', { opacity: 0, duration: 0.32, ease: 'power2.out' }, at + 0.02)
        }
        const MORPHS = [8, 14, 27, 32, 38, 49, 64].map((k) => Math.round((T[k] - 0.12) * 100) / 100)
        MORPHS.forEach(morph)

        const pop = (sel, at, o) => tl.fromTo(sel, Object.assign({ autoAlpha: 0, scale: 0.86, y: 60, filter: blur(14) }, o), { autoAlpha: 1, scale: 1, y: 0, x: 0, rotation: 0, filter: blur(0), duration: 0.55, ease: 'expo.out' }, at)
        const hide = (sel, at) => tl.set(sel, { autoAlpha: 0 }, at)
        // a drawn flag (blue over red) with a soft moving fold
        const flag = (parent, x, y, w, h) => {
          const f = el('div', 'flag', null, parent)
          Object.assign(f.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' })
          el('div', 'band top', null, f)
          el('div', 'band bot', null, f)
          el('div', 'wave', null, f)
          return f
        }
        const wave = (f, from, to) => tl.fromTo(f.querySelector('.wave'), { backgroundPosition: '0px 0px' }, { backgroundPosition: -Math.round((to - from) * 260) + 'px 0px', duration: to - from, ease: 'none', immediateRender: false }, from)
        const cap = (parent, txt, x, y, w) => { const c = el('div', 'cap', txt, parent); Object.assign(c.style, { left: x + 'px', top: y + 'px', width: w + 'px' }); return c }
        gsap.set(['#o-pair', '#o-build', '#c-ht', '#c-li', '#o-torch', '#o-poles', '#o-eq', '#o-stamp', '#o-li', '#o-1937', '#o-crown', '#o-ht', '#o-q', '#o-ok', '#o-sub', '#o-hand'], { autoAlpha: 0 })
        tl.to('#grid', { opacity: 1, duration: 0.6 }, 0.1)

        // ---------- 1. hook: Haïti's flag from the left, Liechtenstein's from the right; on "drapeau" they lie on top of each other ----------
        const pair = $('o-pair')
        tl.set(pair, { autoAlpha: 1 }, 0)
        const fA = flag(pair, 110, 900, 400, 250)
        const fB = flag(pair, 570, 900, 400, 250)
        const cA = cap(pair, 'Haïti', 110, 1180, 400)
        const cB = cap(pair, 'Liechtenstein', 570, 1180, 400)
        tl.fromTo(fA, { x: -640, rotation: -14 }, { x: 0, rotation: -3, duration: 0.7, ease: 'expo.out' }, 0)
        tl.fromTo(fB, { x: 640, rotation: 14 }, { x: 0, rotation: 3, duration: 0.7, ease: 'expo.out' }, 0.08)
        tl.fromTo([cA, cB], { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.4, stagger: 0.1 }, 0.5)
        tl.to(fA, { x: 230, rotation: 0, duration: 0.35, ease: 'power3.in' }, T[7] - 0.35)
        tl.to(fB, { x: -230, rotation: 0, duration: 0.35, ease: 'power3.in' }, T[7] - 0.35)
        tl.to([cA, cB], { autoAlpha: 0, duration: 0.2 }, T[7] - 0.3)
        tl.fromTo([fA, fB], { scale: 1 }, { scale: 1.12, duration: 0.12, yoyo: true, repeat: 1, ease: 'power2.out', immediateRender: false }, T[7])
        wave(fA, 0, MORPHS[0])
        wave(fB, 0, MORPHS[0])
        hide(pair, MORPHS[0])

        // ---------- 2. "blue on top, red below": the bands arrive one at a time ----------
        const build = $('o-build')
        const fC = flag(build, 130, 820, 820, 512)
        fC.style.background = '#d4d4d4'
        const topBand = fC.querySelector('.top')
        const botBand = fC.querySelector('.bot')
        topBand.textContent = 'BLEU'
        botBand.textContent = 'ROUGE'
        topBand.style.fontSize = botBand.style.fontSize = '64px'
        tl.set(build, { autoAlpha: 1 }, MORPHS[0])
        pop(fC, MORPHS[0] + 0.02, { scale: 0.9 })
        tl.fromTo(topBand, { yPercent: -100 }, { yPercent: 0, duration: 0.45, ease: 'bounce.out' }, T[8])
        tl.fromTo(botBand, { yPercent: 100 }, { yPercent: 0, duration: 0.45, ease: 'bounce.out' }, T[11])
        wave(fC, MORPHS[0], MORPHS[1])
        hide(build, MORPHS[1])

        // ---------- 3. the Caribbean and the Alps; on "Personne ne le remarque…" the photos fade back ----------
        pop('#c-ht', T[14] - 0.1, { x: -200, rotation: -12 })
        tl.to('#c-ht', { rotation: -4, duration: 0.4, ease: 'power2.out' }, T[14] + 0.45)
        pop('#c-li', T[18] - 0.1, { x: 200, rotation: 12 })
        tl.to('#c-li', { rotation: 4, duration: 0.4, ease: 'power2.out' }, T[18] + 0.45)
        tl.fromTo(['#ht-img', '#li-img'], { scale: 1.15 }, { scale: 1, duration: MORPHS[2] - MORPHS[1], ease: 'none' }, MORPHS[1])
        tl.to(['#c-ht', '#c-li'], { filter: 'grayscale(1) blur(3px)', opacity: 0.5, scale: 0.94, duration: 0.6 }, T[23])
        hide(['#c-ht', '#c-li'], MORPHS[2])

        // ---------- 4. the 1936 Olympics (drum roll into "1936") ----------
        pop('#o-torch', MORPHS[2] + 0.04)
        tl.fromTo('#torch-img', { scale: 1.2, x: -30 }, { scale: 1.02, x: 20, duration: MORPHS[3] - MORPHS[2], ease: 'none' }, MORPHS[2])
        tl.fromTo('#o-torch', { x: 0 }, { x: 8, duration: 0.05, yoyo: true, repeat: 9, ease: 'none', immediateRender: false }, T[31] - 0.05)
        hide('#o-torch', MORPHS[3])

        // ---------- 5. "Surprise": both flags go up their poles, "=", then the stamp ----------
        const poles = $('o-poles')
        tl.set(poles, { autoAlpha: 1 }, MORPHS[3])
        const p1 = el('div', 'pole', null, poles)
        Object.assign(p1.style, { left: '110px', top: '640px', height: '760px' })
        const p2 = el('div', 'pole', null, poles)
        Object.assign(p2.style, { left: '590px', top: '640px', height: '760px' })
        const f1 = flag(poles, 124, 660, 380, 238)
        const f2 = flag(poles, 604, 660, 380, 238)
        f1.style.borderRadius = f2.style.borderRadius = '0 10px 10px 0'
        const c1 = cap(poles, 'Haïti', 30, 1420, 380)
        const c2 = cap(poles, 'Liechtenstein', 480, 1420, 520)
        tl.fromTo([p1, p2], { scaleY: 0, transformOrigin: '50% 100%' }, { scaleY: 1, duration: 0.4, ease: 'expo.out', stagger: 0.08 }, MORPHS[3] + 0.02)
        tl.fromTo(f1, { y: 560, autoAlpha: 1 }, { y: 0, autoAlpha: 1, duration: 0.9, ease: 'power3.out' }, T[33] - 0.1)
        tl.fromTo(f2, { y: 560, autoAlpha: 1 }, { y: 0, autoAlpha: 1, duration: 0.9, ease: 'power3.out' }, T[33] + 0.05)
        tl.fromTo([c1, c2], { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, T[33])
        tl.fromTo('#o-eq', { autoAlpha: 0, scale: 0.2 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: 'back.out(3)' }, T[35])
        tl.fromTo('#o-stamp', { autoAlpha: 0, scale: 2.6, rotation: -2 }, { autoAlpha: 1, scale: 1, rotation: -8, duration: 0.22, ease: 'power4.in' }, T[37] - 0.05)
        tl.fromTo('#world', { x: 0 }, { x: 10, duration: 0.04, yoyo: true, repeat: 5, ease: 'none', immediateRender: false }, T[37] + 0.17)
        wave(f1, MORPHS[3], MORPHS[4])
        wave(f2, MORPHS[3], MORPHS[4])
        hide(['#o-poles', '#o-eq', '#o-stamp'], MORPHS[4])

        // ---------- 6. 1937: Liechtenstein adds a crown ----------
        const liBox = $('o-li')
        const fL = flag(liBox, 130, 760, 820, 512)
        const cL = cap(liBox, 'Liechtenstein', 130, 1300, 820)
        tl.set(liBox, { autoAlpha: 1 }, MORPHS[4])
        pop(fL, MORPHS[4] + 0.02, { scale: 0.9 })
        tl.fromTo(cL, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, MORPHS[4] + 0.3)
        pop('#o-1937', T[40] - 0.05, { scale: 0.3, rotation: 12 })
        tl.fromTo('#o-crown', { autoAlpha: 0, y: -620, rotation: -25, scale: 1.3 }, { autoAlpha: 1, y: 0, rotation: 0, scale: 1, duration: 0.7, ease: 'bounce.out' }, T[45] - 0.1)
        wave(fL, MORPHS[4], MORPHS[5])
        hide(['#o-li', '#o-1937', '#o-crown'], MORPHS[5])

        // ---------- 7. Haïti changed nothing; the punchline ----------
        const htBox = $('o-ht')
        const fH = flag(htBox, 130, 760, 820, 512)
        const cH = cap(htBox, 'Haïti', 130, 1300, 820)
        tl.set(htBox, { autoAlpha: 1 }, MORPHS[5])
        pop(fH, MORPHS[5] + 0.02, { scale: 0.9 })
        tl.fromTo(cH, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, MORPHS[5] + 0.3)
        pop('#o-q', T[50] + 0.05, { scale: 0.2, rotation: -20 })
        tl.to('#o-q', { rotation: 10, duration: 0.3, yoyo: true, repeat: 3, ease: 'sine.inOut' }, T[50] + 0.6)
        hide('#o-q', T[55])
        pop('#o-ok', T[55], { scale: 0.2, rotation: -30 })
        tl.to(cH, { autoAlpha: 0, duration: 0.2 }, T[62] - 0.2)
        tl.to(fH, { scale: 1.08, rotation: -2, duration: 0.25, ease: 'back.out(3)' }, T[62])
        tl.to('#o-ok', { autoAlpha: 0, duration: 0.2 }, T[62] - 0.2)
        tl.fromTo('#world', { y: 0 }, { y: 12, duration: 0.04, yoyo: true, repeat: 5, ease: 'none', immediateRender: false }, T[62] + 0.05)
        wave(fH, MORPHS[5], MORPHS[6])
        hide(['#o-ht', '#o-q', '#o-ok'], MORPHS[6])

        // ---------- 8. subscribe: the button, a tap, "Abonné ✓" ----------
        pop('#o-sub', MORPHS[6] + 0.04, { scale: 0.5 })
        tl.fromTo('#o-hand', { autoAlpha: 0, x: 260, y: 300 }, { autoAlpha: 1, x: 0, y: 0, duration: 0.45, ease: 'power3.out' }, T[65] - 0.2)
        tl.to('#o-hand', { scale: 0.85, duration: 0.08, yoyo: true, repeat: 1 }, T[66] + 0.15)
        tl.to('#o-sub', { scale: 0.94, duration: 0.08, yoyo: true, repeat: 1 }, T[66] + 0.15)
        tl.to('#o-sub', { backgroundColor: '#2b2b2b', boxShadow: '0 26px 50px rgba(0, 0, 0, 0.25)', duration: 0.2 }, T[66] + 0.25)
        tl.set('#sub-txt', { textContent: 'Abonné ✓' }, T[66] + 0.25)

        // slow camera push over the whole film
        tl.fromTo('#world', { scale: 1 }, { scale: 1.035, duration: END, ease: 'none', immediateRender: false }, 0)

        window.__timelines = window.__timelines || {}
        window.__timelines['main'] = tl
      })()
    </script>
  </body>
</html>
