        const WORDS = ["Le", "Tchad", "et", "la", "Roumanie", "ont", "presque", "le", "même", "drapeau.", "Bleu,", "jaune,", "rouge,", "à", "la", "verticale.", "La", "seule", "différence :", "une", "nuance", "de", "bleu,", "un", "peu", "plus", "foncée", "au", "Tchad.", "Les", "couleurs", "roumaines", "datent", "de", "1848.", "En", "1989,", "les", "manifestants", "découpent", "l'emblème", "communiste", "au", "centre :", "le", "drapeau", "troué", "devient", "le", "symbole", "de", "la", "révolution.", "Le", "Tchad", "adopte", "le", "sien", "en", "1959,", "juste", "avant", "son", "indépendance.", "En", "2004,", "le", "Tchad", "demande", "à", "l'ONU", "d'examiner", "l'affaire.", "Réponse", "de", "la", "Roumanie :", "hors", "de", "question", "de", "changer.", "Résultat :", "aujourd'hui", "encore,", "les", "deux", "pays", "gardent", "le", "même", "drapeau.", "Et", "l'Andorre", "et", "la", "Moldavie ?", "Les", "mêmes", "couleurs,", "mais", "avec", "un", "blason.", "Prochain", "épisode :", "l'Indonésie", "et", "Monaco.", "Et", "vous,", "quels", "drapeaux", "jumeaux", "connaissez-vous ?", "Dites-le", "en", "commentaire."]

        // ---------- blocks of stacked lines: [first word, last word, style, colour?]; y = top of the block ----------
        const BLOCKS = [
          { y: 220, lines: [[0, 4, 'm'], [5, 8, 's'], [9, 9, 'bi', RED]] },
          { y: 220, lines: [[10, 10, 'b', BLUE], [11, 11, 'b', GOLD], [12, 12, 'b', RED], [13, 15, 's']] },
          { y: 220, lines: [[16, 18, 'm'], [19, 22, 's'], [23, 28, 's']] },
          { y: 220, lines: [[29, 31, 's'], [32, 33, 's'], [34, 34, 'x', BLUE]] },
          { y: 200, lines: [[35, 36, 'm'], [37, 39, 's'], [40, 43, 's']] },
          { y: 200, lines: [[44, 46, 'mi', RED], [47, 49, 's'], [50, 52, 'm']] },
          { y: 220, lines: [[53, 57, 's'], [58, 59, 'b', BLUE], [60, 63, 's']] },
          { y: 220, lines: [[64, 65, 'b', BLUE], [66, 68, 's'], [69, 72, 's']] },
          { y: 220, lines: [[73, 76, 'm'], [77, 79, 'mi', RED], [80, 81, 'm']] },
          { y: 220, lines: [[82, 82, 'm'], [83, 84, 's'], [85, 88, 's'], [89, 91, 'mi', RED]] },
          { y: 220, lines: [[92, 93, 'm'], [94, 96, 'm'], [97, 99, 's'], [100, 103, 's']] },
          { y: 260, lines: [[104, 105, 's'], [106, 108, 'm']] },
          { y: 300, lines: [[109, 110, 's'], [111, 113, 'm'], [114, 114, 'm'], [115, 117, 's']] },
        ]
        const blocksBox = $('blocks')
        BLOCKS.forEach((B, bi) => {
          const first = B.lines[0][0]
          const start = Math.max(0, T[first] - 0.06)
          const next = BLOCKS[bi + 1]
          const end = B.until != null ? T[B.until] - 0.08 : next ? T[next.lines[0][0]] - 0.08 : END
          const box = el('div', 'block', null, blocksBox)
          box.style.top = B.y + 'px'
          gsap.set(box, { autoAlpha: 0 })
          tl.set(box, { autoAlpha: 1 }, start)
          B.lines.forEach(([a, b, st, col]) => {
            const line = el('div', 'line ' + st, null, box)
            for (let k = a; k <= b; k++) {
              const w = el('span', 'w', WORDS[k], line)
              tl.fromTo(w, { opacity: 0, color: '#B9B9B9', y: 12, filter: blur(8) }, { opacity: 1, y: 0, filter: blur(0), duration: 0.16, ease: 'power2.out' }, T[k])
              tl.to(w, { color: col || '#141414', duration: 0.25, ease: 'power1.out' }, T[k] + 0.08)
            }
          })
          if (end < END) tl.to(box, { autoAlpha: 0, filter: blur(10), y: -16, duration: 0.14, ease: 'power2.in' }, end - 0.14)
        })

        // ---------- short full-frame blur between parts ----------
        const morph = (at) => {
          tl.to('#world', { filter: blur(26), duration: 0.16, ease: 'power2.in' }, at - 0.16)
          tl.to('#veil', { opacity: 0.5, duration: 0.16, ease: 'power2.in' }, at - 0.16)
          tl.to('#world', { filter: blur(0), duration: 0.24, ease: 'power2.out' }, at + 0.02)
          tl.to('#veil', { opacity: 0, duration: 0.24, ease: 'power2.out' }, at + 0.02)
        }
        const MORPHS = [10, 16, 29, 35, 53, 64, 73, 82, 92, 104, 109].map((k) => Math.round((T[k] - 0.1) * 100) / 100)
        MORPHS.forEach(morph)

        const pop = (sel, at, o) => tl.fromTo(sel, Object.assign({ autoAlpha: 0, scale: 0.84, y: 70, filter: blur(14) }, o), { autoAlpha: 1, scale: 1, y: 0, x: 0, rotation: 0, filter: blur(0), duration: 0.38, ease: 'expo.out' }, at)
        const stamp = (sel, at, rot) => tl.fromTo(sel, { autoAlpha: 0, scale: 2.4, rotation: 2 }, { autoAlpha: 1, scale: 1, rotation: rot, duration: 0.18, ease: 'power4.in' }, at)
        const hide = (sel, at) => tl.set(sel, { autoAlpha: 0 }, at)
        // a drawn vertical tricolour with a soft moving fold
        const tri = (parent, x, y, w, h, cols, labels) => {
          const f = el('div', 'tri', null, parent)
          Object.assign(f.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' })
          cols.forEach((c, i) => { const b = el('i', '', labels ? labels[i] : null, f); b.style.left = (i * 33.3) + '%'; b.style.background = c; if (labels) b.style.fontSize = '56px'; if (i === 1 && labels) b.style.color = '#5a4300' })
          el('div', 'wave', null, f)
          return f
        }
        const wave = (f, from, to) => tl.fromTo(f.querySelector('.wave'), { backgroundPosition: '0px 0px' }, { backgroundPosition: -Math.round((to - from) * 320) + 'px 0px', duration: to - from, ease: 'none', immediateRender: false }, from)
        const cap = (parent, txt, x, y, w) => { const c = el('div', 'cap', txt, parent); Object.assign(c.style, { left: x + 'px', top: y + 'px', width: w + 'px' }); return c }
        gsap.set(['#o-pair', '#o-build', '#sw-td', '#sw-ro', '#o-lens', '#o-buc', '#ch-buc', '#o-1989', '#o-89', '#o-td', '#ch-indep', '#o-letter', '#o-04', '#o-roans', '#o-non', '#o-poles', '#o-eq', '#o-four', '#o-next', '#o-ep3', '#o-q', '#o-parade', '#o-bub', '#o-arrow'], { autoAlpha: 0 })
        tl.to('#grid', { opacity: 1, duration: 0.4 }, 0.05)
        tl.fromTo('.series', { autoAlpha: 0, y: -30 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'back.out(2)' }, 0.1)

        // ---------- 1. hook: Chad from the left, Romania from the right; on « drapeau » they lie on top of each other ----------
        const pair = $('o-pair')
        tl.set(pair, { autoAlpha: 1 }, 0)
        const fA = tri(pair, 110, 900, 400, 270, TD)
        const fB = tri(pair, 570, 900, 400, 270, RO)
        const cA = cap(pair, 'Tchad', 110, 1200, 400)
        const cB = cap(pair, 'Roumanie', 570, 1200, 400)
        tl.fromTo(fA, { x: -640, rotation: -14 }, { x: 0, rotation: -3, duration: 0.5, ease: 'expo.out' }, 0)
        tl.fromTo(fB, { x: 640, rotation: 14 }, { x: 0, rotation: 3, duration: 0.5, ease: 'expo.out' }, 0.06)
        tl.fromTo([cA, cB], { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.3, stagger: 0.08 }, 0.35)
        tl.to(fA, { x: 230, rotation: 0, duration: 0.28, ease: 'power3.in' }, T[9] - 0.28)
        tl.to(fB, { x: -230, rotation: 0, duration: 0.28, ease: 'power3.in' }, T[9] - 0.28)
        tl.to([cA, cB], { autoAlpha: 0, duration: 0.15 }, T[9] - 0.25)
        tl.fromTo([fA, fB], { scale: 1 }, { scale: 1.12, duration: 0.1, yoyo: true, repeat: 1, ease: 'power2.out', immediateRender: false }, T[9])
        wave(fA, 0, MORPHS[0])
        wave(fB, 0, MORPHS[0])
        hide(pair, MORPHS[0])

        // ---------- 2. blue, yellow, red: the bands drop in one by one ----------
        const build = $('o-build')
        const fC = tri(build, 130, 760, 820, 560, RO, ['BLEU', 'JAUNE', 'ROUGE'])
        tl.set(build, { autoAlpha: 1 }, MORPHS[0])
        pop(fC, MORPHS[0] + 0.02, { scale: 0.9 })
        const bands = fC.querySelectorAll('i')
        ;[10, 11, 12].forEach((k, i) => tl.fromTo(bands[i], { yPercent: i === 1 ? 100 : -100 }, { yPercent: 0, duration: 0.3, ease: 'back.out(2)' }, T[k] - 0.05))
        wave(fC, MORPHS[0], MORPHS[1])
        hide(build, MORPHS[1])

        // ---------- 3. the shade of blue: two swatches, the lens lands on Chad's ----------
        pop('#sw-td', MORPHS[1] + 0.02, { x: -120 })
        pop('#sw-ro', MORPHS[1] + 0.1, { x: 120 })
        tl.fromTo('#o-lens', { autoAlpha: 0, scale: 0.4, x: 300, y: 300 }, { autoAlpha: 1, scale: 1, x: 0, y: 0, duration: 0.45, ease: 'back.out(1.8)' }, T[26] - 0.1)
        tl.to('#sw-td .dot', { scale: 1.08, duration: 0.3, yoyo: true, repeat: 1, ease: 'sine.inOut' }, T[26] + 0.3)
        hide(['#sw-td', '#sw-ro', '#o-lens'], MORPHS[2])

        // ---------- 4. 1848: Bucharest ----------
        pop('#o-buc', MORPHS[2] + 0.02)
        tl.fromTo('#buc-img', { scale: 1.18 }, { scale: 1.02, duration: MORPHS[3] - MORPHS[2], ease: 'none', immediateRender: false }, MORPHS[2])
        pop('#ch-buc', MORPHS[2] + 0.4, { scale: 0.5 })
        hide(['#o-buc', '#ch-buc'], MORPHS[3])

        // ---------- 5. 1989: the communist emblem is cut out of the flag ----------
        pop('#o-1989', MORPHS[3] + 0.02, { scale: 0.9 })
        pop('#o-89', MORPHS[3] + 0.2, { scale: 0.3, rotation: 12 })
        tl.fromTo('#hole', { scale: 0 }, { scale: 1, duration: 0.35, ease: 'power3.out', immediateRender: false }, T[39] + 0.05)
        gsap.set('#hole', { scale: 0 })
        tl.fromTo('#o-1989', { rotation: 0 }, { rotation: -3, duration: 0.25, yoyo: true, repeat: 1, ease: 'sine.inOut', immediateRender: false }, T[46])

        // ---------- 8. Romania's answer: « hors de question » ----------

        tl.fromTo(['#r3', '#r4'], { autoAlpha: 0, scale: 2 }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: 'back.out(2)', stagger: 0.12 }, T[103] - 0.1)

        // ---------- 11. next episode: Indonesia and Monaco (red over white) ----------
        const nx = $('o-next')

          el('div', 'wave', null, f)
          cap(parent, name, x, y + h + 26, w)
          return f
        }
        const iA = rw(nx, 110, 900, 400, 270, 'Indonésie')
        const iB = rw(nx, 570, 900, 400, 270, 'Monaco')
        tl.fromTo(iA, { x: -640, rotation: -14 }, { x: 0, rotation: -3, duration: 0.45, ease: 'expo.out' }, T[106] - 0.1)
        tl.fromTo(iB, { x: 640, rotation: 14 }, { x: 0, rotation: 3, duration: 0.45, ease: 'expo.out' }, T[108] - 0.1)
        const nc = nx.querySelectorAll('.cap')
        gsap.set(nc, { autoAlpha: 0 })
        tl.to(nc[0], { autoAlpha: 1, duration: 0.25 }, T[106] + 0.15)
        tl.to(nc[1], { autoAlpha: 1, duration: 0.25 }, T[108] + 0.15)
        pop('#o-ep3', MORPHS[9] + 0.05, { scale: 0.3 })
        pop('#o-q', T[108] + 0.2, { scale: 0.2, rotation: -20 })
        hide(['#o-next', '#o-ep3', '#o-q'], MORPHS[10])

        // ---------- 12. the question: a parade of twin flags, and where to comment ----------
        const par = $('o-parade')
        tl.set(par, { autoAlpha: 1 }, MORPHS[10])
        const ft = tri(par, 150, 860, 240, 160, TD)
        const fr = tri(par, 420, 860, 240, 160, RO)
        const fi = rw(par, 690, 860, 240, 160, '')
        ;[ft, fr, fi].forEach((f, i) => tl.fromTo(f, { autoAlpha: 0, y: 80, rotation: -10 }, { autoAlpha: 1, y: 0, rotation: i % 2 ? 4 : -4, duration: 0.4, ease: 'back.out(2)' }, MORPHS[10] + 0.1 + i * 0.12))
        pop('#o-bub', T[116] - 0.1, { scale: 0.4 })
        pop('#o-arrow', T[117], { scale: 0.3, x: -40 })
        const left = END - T[117] - 0.6
        const n = Math.max(1, Math.floor(left / 0.5))
        tl.to('#o-arrow', { x: 18, y: 14, duration: 0.3, yoyo: true, repeat: n, ease: 'sine.inOut' }, T[117] + 0.4)

        // slow camera push over the whole film
        tl.fromTo('#world', { scale: 1 }, { scale: 1.04, duration: END, ease: 'none', immediateRender: false }, 0)

        window.__timelines = window.__timelines || {}
        window.__timelines['main'] = tl
      })()
    </script>
