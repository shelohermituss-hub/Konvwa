<!doctype html>
<!-- Couverture TikTok créée à part (1080×1920) : rendu 3D studio (Magnific) + titre-choc. -->
<html lang="fr">
<meta charset="utf-8" />
<style>
  @font-face { font-family: Anton; src: url(anton.woff2); }
  @font-face { font-family: Mono; font-weight: 700; src: url(jetbrains-mono-700.woff2); }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #000 url(fond.jpg) center / cover; position: relative; font-family: Anton, sans-serif; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 80%, rgba(0,0,0,.4) 100%); }
  .kick { position: absolute; left: 0; right: 0; top: 250px; text-align: center; }
  .kick span { display: inline-block; font: 700 38px/1 Mono, monospace; letter-spacing: .14em; color: #0f1011; background: #ffd23f; padding: 14px 26px; border-radius: 999px; transform: rotate(-2deg); box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  h1 { position: absolute; left: 0; right: 0; top: 330px; text-align: center; color: #fff; text-transform: uppercase; line-height: .95; text-shadow: 0 8px 0 rgba(0,0,0,.45), 0 0 40px rgba(0,0,0,.5); }
  h1 .a { display: block; font-size: 150px; letter-spacing: .01em; }
  h1 .a em { font-style: normal; color: #ffd23f; }
  h1 .b { display: block; font-size: 92px; letter-spacing: .01em; }
  .tag { position: absolute; font: 700 34px/1 Mono, monospace; letter-spacing: .1em; color: #fff; background: #e5483a; padding: 12px 18px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.4); white-space: nowrap; }
</style>
<div class="shade"></div>
<div class="tag" style="left: 640px; top: 1080px; background:#ffd23f; color:#0f1011">DÉCRET N°1</div>
<div class="tag" style="left: 120px; top: 1500px">0 ARMÉE</div>
<div class="kick"><span>SAN FRANCISCO · 1859</span></div>
<h1><span class="a">IL SE <em>PROCLAME</em></span><span class="a">EMPEREUR</span><span class="b">ET LA VILLE JOUE LE JEU</span></h1>
</html>
