<!doctype html>

  <body>
    <template id="s5-cheminee-template">
      <style>
        #s5-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: radial-gradient(ellipse 80% 80% at 55% 45%, #1e3567 0%, #0b1630 76%);
          color: #fff6ec;
        }
        #s5-sky,
        #s5-world,
        #s5-snow {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
        }
        .s5-blk {
          position: absolute;
          left: 110px;

          width: 680px;
        }
        .s5-k {

        }

          font-family: "IBM Plex Mono", monospace;

          line-height: 1;

        }
        .s5-line {
          display: block;
        }
        #s5-stamp {
          position: absolute;
          left: 520px;
          top: -84px;
          width: 168px;
          height: 168px;
          border-radius: 50%;
          border: 6px solid #e23d3d;
          color: #ff5a4e;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;

        .s5-ck {

          width: 30px;

        .s5-row-t {
          font-family: "Archivo Black", sans-serif;

        .s5-row-s {

        #s5-notif {
          position: absolute;
          right: 110px;

          background: rgba(250, 246, 238, 0.97);

        }
        #s5-notif-ic {
          width: 84px;
          height: 84px;
          border-radius: 22px;
          background: #e23d3d;
          flex: none;
          display: block;
        }
        #s5-notif-k {
          font-family: "IBM Plex Mono", monospace;
          font-weight: 700;
          font-size: 20px;
          letter-spacing: 0.1em;
          color: #8a3b2e;
        }
        #s5-notif-t {
          font-family: "Archivo Black", sans-serif;
          font-size: 34px;

          margin-top: 4px;
        }
        #s5-notif-s {

        }
      </style>

      <div id="s5-root" data-composition-id="s5-cheminee" data-width="1920" data-height="1080">
        <svg id="s5-sky" data-layout-allow-overlap data-layout-allow-occlusion data-layout-allow-overflow viewBox="0 0 1920 1080"></svg>
        <svg id="s5-world" data-layout-allow-overlap data-layout-allow-occlusion data-layout-allow-overflow viewBox="-960 -540 1920 1080"></svg>
        <svg id="s5-snow" viewBox="0 0 1920 1080"></svg>

        <div class="s5-blk" id="s5-h1">
          <div class="s5-k">DERNIER KILOMÈTRE</div>
          <div id="s5-km">1 000 m</div>
        </div>
        <div class="s5-blk" id="s5-h2">
          <div class="s5-k" id="s5-h2-k">NOTRE EXCLUSIVITÉ</div>
          <div id="s5-h2-big"><span class="s5-line">Livraison</span><span class="s5-line">par cheminée</span></div>
          <div id="s5-stamp"><span>BREVETÉ</span><b>1823</b><span>PÈRE NOËL SA</span></div>
        </div>
        <div id="s5-list">
          <div class="s5-row" id="s5-row1">
            <i class="s5-ck"><svg viewBox="0 0 30 30"><path d="M6,15 l6,6 l12,-13" fill="none" stroke="#0B1630" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" /></svg></i>
            <div><div class="s5-row-t">Discrète</div><div class="s5-row-s">0 CHAT RÉVEILLÉ</div></div>
          </div>
          <div class="s5-row" id="s5-row2">
            <i class="s5-ck"><svg viewBox="0 0 30 30"><path d="M6,15 l6,6 l12,-13" fill="none" stroke="#0B1630" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" /></svg></i>
            <div><div class="s5-row-t">Rapide</div><div class="s5-row-s">0,8 s DU TOIT AU SALON</div></div>
          </div>
          <div class="s5-row" id="s5-row3">
            <i class="s5-ck"><svg viewBox="0 0 30 30"><path d="M6,15 l6,6 l12,-13" fill="none" stroke="#0B1630" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" /></svg></i>
            <div><div class="s5-row-t">Sous le sapin</div><div class="s5-row-s">LIVRAISON GARANTIE</div></div>
          </div>
        </div>
        <div id="s5-notif">
          <svg id="s5-notif-ic" viewBox="-42 -46 84 84"></svg>
          <div>
            <div id="s5-notif-k">PÈRE NOËL SA · 02:14</div>
            <div id="s5-notif-t">Votre colis est livré</div>
            <div id="s5-notif-s">Salon · sous le sapin ✓</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const I = window.ISO;
          const P = I.P;
          const r1 = I.r1;
          const tl = gsap.timeline({ paused: true });
          const R = I.rng(523);
          const D = 10;

          // ---------- ciel : lune + traîneau en ombre chinoise ----------
          let sky = "";
          for (let i = 0; i < 70; i++) sky += `<circle cx="${r1(R() * 1920)}" cy="${r1(R() * 700)}" r="${r1(0.8 + R() * 1.6)}" fill="#FFF6EC" opacity="${(0.25 + R() * 0.5).toFixed(2)}"/>`;
          sky += `<circle cx="1460" cy="300" r="230" fill="url(#s5-moonglow)"/><circle cx="1460" cy="300" r="150" fill="#F6EBD0"/><circle cx="1410" cy="260" r="26" fill="#E6D7B4" opacity="0.7"/><circle cx="1510" cy="350" r="18" fill="#E6D7B4" opacity="0.6"/>`;
          sky = `<defs><radialGradient id="s5-moonglow"><stop offset="0.55" stop-color="#FFF1CC" stop-opacity="0.35"/><stop offset="1" stop-color="#FFF1CC" stop-opacity="0"/></radialGradient></defs>` + sky;
          let sil = `<g fill="#0B1630">`;
          sil += `<path d="M-90,0 L80,0 Q100,0 102,-16 M-86,-14 L70,-14 Q86,-16 88,-34 L90,-58 Q70,-52 64,-40 L-50,-40 Q-66,-70 -92,-66 Q-90,-34 -86,-14 Z" stroke="#0B1630" stroke-width="5"/>`;
          sil += `<path d="M-46,-40 Q-50,-96 -8,-94 Q20,-94 18,-40 Z"/><circle cx="44" cy="-92" r="12"/><path d="M22,-40 Q20,-82 44,-84 Q66,-82 62,-40 Z"/>`;
          for (let k = 0; k < 4; k++) sil += `<g transform="translate(${170 + k * 105},${-10 - k * 4})"><path d="M-26,-26 Q-28,-46 0,-46 L22,-46 Q34,-46 34,-32 Q32,-22 18,-22 L-14,-22 Z"/><path d="M24,-44 L34,-64 L46,-68 L52,-60 L40,-56 L32,-38 Z"/><path d="M36,-66 L30,-84 M38,-70 L46,-86" stroke="#0B1630" stroke-width="4"/><path d="M-10,-24 L-18,0 M18,-24 L26,0" stroke="#0B1630" stroke-width="5"/></g>`;
          sil += `<path d="M90,-34 L520,-50" stroke="#0B1630" stroke-width="3"/></g>`;
          sky += `<g id="s5-sil" transform="translate(-400,0)"><g transform="rotate(-12) scale(0.72)">${sil}</g></g>`;
          document.getElementById("s5-sky").innerHTML = sky;

          // ---------- maison en coupe ----------
          const HW = 360,
            HD = 300,
            HH = 200,
            RH = 110;
          let w = I.defs("s5");
          w += I.island(-240, -200, 860, 760, 40, { depth: 300 });
          w += I.tree(-150, -120, 0, 170, 46);
          w += I.tree(520, -120, 0, 150, 40);
          w += I.tree(-190, 60, 0, 130, 36);

          // murs du fond (faces intérieures)
          const wallIn = { top: "#F3E6CF", left: "#E7CFA6", right: "#D3B58A" };
          w += I.box(0, 0, 0, HW, 12, HH, wallIn, { shadow: false });
          w += I.box(0, 0, 0, 12, HD, HH, wallIn, { shadow: false });
          for (let k = 0; k < 12; k++) w += I.quad("L", 12, 20 + k * 28, 30 + k * 28, 0, HH, "#DDBF92", 'opacity="0.55"');
          w += I.quad("L", 12, 0, HW, 0, 22, "#B8875A");
          w += I.quad("R", 12, 12, HD, 0, 22, "#A87A4F");
          // fenêtre intérieure
          w += I.quad("L", 12, 150, 250, 88, 176, "#6E4E34");
          w += I.quad("L", 12, 158, 242, 96, 168, "#16294F");
          {
            const m = P(222, 12, 150);
            w += `<circle cx="${r1(m[0])}" cy="${r1(m[1])}" r="9" fill="#F6EBD0"/>`;
          }
          w += I.quad("L", 12, 198, 202, 96, 168, "#6E4E34");
          w += I.quad("L", 12, 158, 242, 130, 134, "#6E4E34");
          // tableau
          w += I.quad("R", 12, 210, 280, 104, 156, "#C99A2E");
          w += I.quad("R", 12, 216, 274, 110, 150, "#2F4C7E");
          w += `<g transform="${I.planeRight(12, 274, 150)}"><path d="M8,30 L20,14 L30,24 L40,10 L54,30 Z" fill="#E6EDF7"/></g>`;
          // plancher
          w += I.quad("T", 0, 12, HW, 12, HD, "#9C6A44");
          for (let k = 1; k < 10; k++) w += I.line([P(12, 12 + k * 30, 0), P(HW, 12 + k * 30, 0)], "#7E5233", 1.5, 'opacity="0.7"');
          // tapis
          w += I.quad("T", 0.6, 130, 300, 150, 280, "#B83A5E");
          w += I.quad("T", 0.8, 142, 288, 162, 268, "#9A2F4E");
          w += I.line([P(142, 162, 0.9), P(288, 162, 0.9), P(288, 268, 0.9), P(142, 268, 0.9), P(142, 162, 0.9)], "#FFC857", 2.5);

          // conduit de cheminée : intérieur (fond) — tronçon découpé z 128..300
          const brick = { top: "#B5604B", left: "#7A382C", right: "#9A4A3A" };
          w += I.quad("R", 8, 133, 177, 128, 300, "#4E241D");
          w += I.quad("L", 133, 8, 48, 128, 300, "#3E1C17");
          for (let z = 140; z < 300; z += 16) w += I.line([P(8, 133, z), P(8, 177, z)], "#3A1A15", 1.5);
          {
            const g = P(28, 155, 150);
            w += `<ellipse cx="${r1(g[0])}" cy="${r1(g[1])}" rx="30" ry="80" fill="url(#s5-glow)" opacity="0.35"/>`;
          }

          // cadeau (3 calques : conduit / sol / ciel)
          const GS = 56,
            GH = 50;
          const giftSvg = I.gift(-GS / 2, -GS / 2, 0, GS, "#E23D3D", "#FFC857", { h: GH, shadow: false });
          w += `<g id="s5-gin" opacity="0">${giftSvg}</g>`;

          // cheminée : faces avant (foyer plein z 0..120, montants découpés, sommet extérieur)
          w += I.quad("L", 185, 0, 56, 0, 128, brick.left);
          w += I.quad("R", 56, 125, 185, 0, 128, brick.right);
          for (let z = 14; z < 128; z += 14) {
            w += I.line([P(0, 185, z), P(56, 185, z), P(56, 125, z)], "#5E2B22", 1.3, 'opacity="0.6"');
          }
          w += I.quad("R", 56, 135, 175, 4, 74, "#1B0F0A");
          w += I.quad("R", 56, 131, 179, 74, 84, "#C7B79A");
          w += `<g id="s5-embers">${I.quad("R", 56.5, 140, 170, 4, 12, "#FF7A2E")}${I.quad("R", 56.5, 146, 164, 10, 18, "#FFC857", 'opacity="0.8"')}</g>`;
          w += I.box(-2, 116, 120, 72, 78, 10, "#8A5A3C", { shadow: false });
          w += `<g transform="${I.planeRight(70, 194, 120)}">
            <path d="M12,2 L24,2 L24,30 Q24,40 14,40 L6,40 Q2,34 10,30 Z" fill="#E23D3D"/><rect x="11" y="2" width="14" height="7" fill="#F4F7FB"/>
            <path d="M34,2 L46,2 L46,30 Q46,40 36,40 L28,40 Q24,34 32,30 Z" fill="#2F8F6B"/><rect x="33" y="2" width="14" height="7" fill="#F4F7FB"/>
            <path d="M56,2 L68,2 L68,30 Q68,40 58,40 L50,40 Q46,34 54,30 Z" fill="#E8A93A"/><rect x="55" y="2" width="14" height="7" fill="#F4F7FB"/>
          </g>`;
          // montants découpés
          w += I.quad("R", 56, 125, 133, 128, 300, brick.right);
          w += I.quad("R", 56, 177, 185, 128, 300, brick.right);
          w += I.quad("L", 185, 0, 8, 128, 300, brick.left);
          w += I.quad("L", 185, 48, 56, 128, 300, brick.left);
          w += I.quad("T", 300, 48, 56, 125, 185, brick.top);
          w += I.quad("T", 300, 0, 56, 177, 185, brick.top);

          // mobilier
          const props = [];
          props.push({ k: 80, s: I.box(100, 14, 0, 130, 46, 34, "#3D6FB6", { shadowLen: 20 }) + I.box(100, 14, 34, 130, 14, 40, "#3D6FB6", { shadow: false }) + I.box(100, 14, 34, 14, 46, 18, "#3D6FB6", { shadow: false }) + I.box(216, 14, 34, 14, 46, 18, "#3D6FB6", { shadow: false }) + I.box(120, 30, 34, 36, 12, 26, "#E8A93A", { shadow: false }) });
          // sapin + guirlandes
          const TX = 296,
            TY = 70;
          let tree = I.tree(TX, TY, 0, 210, 72, { tiers: 4, snow: false, star: true, color: "#2F8F6B" });
          const lights = [];
          const RL = I.rng(31);
          for (let k = 0; k < 26; k++) {
            const zz = 40 + RL() * 150;
            const rad = 66 * (1 - (zz - 30) / 200) * (0.5 + RL() * 0.45);
            const a = -0.6 + RL() * 2.4;
            const p = P(TX + Math.cos(a) * rad, TY + Math.sin(a) * rad, zz);
            const col = ["#FFC857", "#FF5A4E", "#7FD4FF", "#FFF6EC"][k % 4];
            tree += `<circle id="s5-l${k}" cx="${r1(p[0])}" cy="${r1(p[1])}" r="${k % 3 ? 4 : 6}" fill="${col}"/>`;
            lights.push(k);
          }
          tree += `<circle cx="${r1(P(TX, TY, 100)[0])}" cy="${r1(P(TX, TY, 100)[1])}" r="160" fill="url(#s5-glow)" opacity="0.35" id="s5-treeglow"/>`;
          props.push({ k: 366, s: tree });
          props.push({ k: 380, s: I.gift(316, 120, 0, 40, "#2F8F6B", "#E23D3D", { h: 30 }) + I.gift(250, 40, 0, 36, "#3D6FB6", "#FFC857", { h: 40 }) });
          props.sort((a, b) => a.k - b.k).forEach((p) => (w += p.s));

          w += `<g id="s5-gfloor" opacity="0">${giftSvg}</g>`;
          // nuage de suie
          let puff = "";
          for (let k = 0; k < 16; k++) puff += `<circle id="s5-p${k}" r="6" fill="${k % 4 ? "#7D8496" : "#FFC857"}" opacity="0"/>`;
          w += `<g>${puff}</g>`;
          // traits de vitesse
          let streak = "";
          for (let k = 0; k < 4; k++) streak += `<line id="s5-sk${k}" stroke="#FFF6EC" stroke-width="4" stroke-linecap="round" opacity="0"/>`;
          w += `<g>${streak}</g>`;

          // table lait + biscuits, chat
          w += I.box(70, 222, 0, 52, 52, 48, "#8A5A3C", { shadowLen: 24 });
          {
            const t = P(96, 248, 48);
            w += `<ellipse cx="${r1(t[0] + 8)}" cy="${r1(t[1] + 2)}" rx="20" ry="10" fill="#F4F7FB"/><circle cx="${r1(t[0] + 2)}" cy="${r1(t[1])}" r="6" fill="#B07A45"/><circle cx="${r1(t[0] + 13)}" cy="${r1(t[1] + 2)}" r="6" fill="#B07A45"/><rect x="${r1(t[0] - 20)}" y="${r1(t[1] - 26)}" width="12" height="24" rx="2" fill="#F4F7FB"/><rect x="${r1(t[0] - 20)}" y="${r1(t[1] - 26)}" width="12" height="7" fill="#DCE6F2"/>`;
          }
          {
            const c = P(205, 220, 0);
            w += `<g transform="translate(${r1(c[0])},${r1(c[1])})"><ellipse cx="0" cy="-10" rx="34" ry="18" fill="#E8A93A"/><path d="M-30,-6 Q-44,6 -20,8 Q0,10 22,2" fill="none" stroke="#D18E2C" stroke-width="7" stroke-linecap="round"/><circle cx="24" cy="-16" r="14" fill="#E8A93A"/><path d="M14,-26 L16,-38 L24,-28 Z M26,-28 L34,-38 L34,-24 Z" fill="#D18E2C"/><path d="M18,-15 q4,3 8,0" stroke="#3B2A2A" stroke-width="2" fill="none"/><path d="M-10,-20 q10,-6 20,0" stroke="#D18E2C" stroke-width="3" fill="none"/>
              <text id="s5-z1" x="40" y="-40" font-family="IBM Plex Mono" font-weight="700" font-size="20" fill="#FFF6EC">z</text><text id="s5-z2" x="40" y="-40" font-family="IBM Plex Mono" font-weight="700" font-size="26" fill="#FFF6EC">z</text><text id="s5-z3" x="40" y="-40" font-family="IBM Plex Mono" font-weight="700" font-size="32" fill="#FFF6EC">Z</text></g>`;
          }

          // façade : murs avant + toit (s'effacent pour la vue en coupe)
          const wall = I.shade("#C9533F");
          let wl = I.box(0, HD - 12, 0, HW, 12, HH, "#C9533F", { shadow: false });
          [[50, 110], [250, 310]].forEach(([a, b]) => {
            wl += I.quad("L", HD, a, b, 70, 150, "#7A2F28");
            wl += I.quad("L", HD, a + 5, b - 5, 75, 145, "#FFC857");
            wl += I.quad("L", HD, (a + b) / 2 - 2, (a + b) / 2 + 2, 75, 145, "#7A2F28");
          });
          wl += I.quad("L", HD, 155, 205, 0, 130, "#5A2A24");
          wl += I.quad("L", HD, 160, 200, 0, 124, "#2F8F6B");
          {
            const p = P(180, HD, 98);
            wl += `<circle cx="${r1(p[0])}" cy="${r1(p[1])}" r="12" fill="none" stroke="#2F8F6B" stroke-width="6"/><circle cx="${r1(p[0])}" cy="${r1(p[1] + 10)}" r="4" fill="#E23D3D"/>`;
          }
          let wr = I.box(HW - 12, 0, 0, 12, HD - 12, HH, "#C9533F", { shadow: false });
          [[50, 110], [170, 230]].forEach(([a, b]) => {
            wr += I.quad("R", HW, a, b, 70, 150, "#7A2F28");
            wr += I.quad("R", HW, a + 5, b - 5, 75, 145, "#FFC857");
          });
          wr += poly2([P(HW, 0, HH), P(HW, HD, HH), P(HW, HD / 2, HH + RH)], wall.right);
          function poly2(list, fill) {
            return I.poly(list, fill);
          }
          // toit
          const ov = 10,
            yc = HD / 2,
            slope = RH / (HD / 2),
            eaveZ = HH - ov * slope;
          let roof = "";
          roof += I.poly([P(-ov, -ov, eaveZ), P(HW + ov, -ov, eaveZ), P(HW + ov, yc, HH + RH), P(-ov, yc, HH + RH)], "#C7D5EA");
          roof += I.poly([P(-ov, HD + ov, eaveZ), P(HW + ov, HD + ov, eaveZ), P(HW + ov, yc, HH + RH), P(-ov, yc, HH + RH)], "#E6EDF7");
          roof += I.poly([P(HW + ov, HD + ov, eaveZ), P(HW + ov, yc, HH + RH), P(HW + ov, -ov, eaveZ), P(HW + ov, -ov, eaveZ - 9), P(HW + ov, yc, HH + RH - 9), P(HW + ov, HD + ov, eaveZ - 9)], "#7A382C");
          roof += I.poly([P(-ov, HD + ov, eaveZ), P(HW + ov, HD + ov, eaveZ), P(HW + ov, HD + ov, eaveZ - 9), P(-ov, HD + ov, eaveZ - 9)], "#5E2B22");
          roof += I.line([P(-ov, yc, HH + RH), P(HW + ov, yc, HH + RH)], "#FFFFFF", 2, 'opacity="0.8"');
          w += `<g id="s5-wr">${wr}</g><g id="s5-wl">${wl}</g><g id="s5-roof">${roof}</g>`;

          // sommet extérieur de la cheminée (au-dessus du toit)
          w += I.quad("L", 185, 0, 56, 296, 345, brick.left);
          w += I.quad("R", 56, 125, 185, 296, 345, brick.right);
          for (let z = 308; z < 345; z += 12) w += I.line([P(0, 185, z), P(56, 185, z), P(56, 125, z)], "#5E2B22", 1.3, 'opacity="0.6"');
          w += I.box(-4, 121, 345, 64, 68, 7, "#E9EFF8", { shadow: false, edgeW: 1 });
          w += I.poly([P(4, 131, 352), P(52, 131, 352), P(52, 177, 352), P(4, 177, 352)], "#1A1A24");

          // bonhomme de neige
          {
            const b = P(470, 420, 0);
            w += `<g transform="translate(${r1(b[0])},${r1(b[1])})"><ellipse cx="-14" cy="4" rx="40" ry="12" fill="rgba(11,22,48,0.18)"/><circle cx="0" cy="-30" r="32" fill="#EEF3FA"/><circle cx="0" cy="-82" r="23" fill="#F6F9FD"/><circle cx="0" cy="-122" r="17" fill="#FFFFFF"/><path d="M3,-122 l16,4 l-16,3 Z" fill="#E8A93A"/><circle cx="-5" cy="-127" r="2.4" fill="#0B1630"/><circle cx="5" cy="-127" r="2.4" fill="#0B1630"/><path d="M-20,-100 Q0,-92 20,-100 L22,-92 Q0,-84 -22,-92 Z" fill="#E23D3D"/><rect x="-14" y="-152" width="28" height="18" fill="#0B1630"/><rect x="-20" y="-136" width="40" height="5" fill="#0B1630"/></g>`;
          }

          w += `<g id="s5-gsky" opacity="0">${giftSvg}</g>`;

          const svg = document.getElementById("s5-world");
          svg.innerHTML = w;
          const sn = I.snowfall("s5s", 90, 9, 0, -20, 1920, 1100);
          document.getElementById("s5-snow").innerHTML = sn.svg;
          document.getElementById("s5-notif-ic").innerHTML = I.gift(-18, -18, 0, 36, "#FFF6EC", "#FFC857", { shadow: false, h: 30 });

          // ---------- trajectoire du cadeau (fonction pure du temps) ----------
          const gin = document.getElementById("s5-gin");
          const gfl = document.getElementById("s5-gfloor");
          const gsk = document.getElementById("s5-gsky");
          const pEls = [],
            sEls = [];
          for (let k = 0; k < 16; k++) pEls.push(document.getElementById("s5-p" + k));
          for (let k = 0; k < 4; k++) sEls.push(document.getElementById("s5-sk" + k));
          const lEls = lights.map((k) => document.getElementById("s5-l" + k));
          const zEls = [1, 2, 3].map((k) => document.getElementById("s5-z" + k));
          const treeGlow = document.getElementById("s5-treeglow");
          const embers = document.getElementById("s5-embers");
          const clamp = (v) => Math.max(0, Math.min(1, v));
          const eIn = (x) => x * x;
          const eOut = (x) => 1 - (1 - x) * (1 - x);
          const eIO = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
          const CX = 28,
            CY = 155;
          const RIM = 352;
          const OUT = [112, 158];
          const TREE = [258, 118];
          function giftState(t) {
            // retourne {x,y,z,sx,sy,rot,layer}
            if (t < 0.9) return null;
            if (t < 2.1) {
              const u = (t - 0.9) / 1.2;
              return { x: CX, y: CY, z: 1100 - (1100 - RIM) * eIn(u), sx: 1, sy: 1, rot: (1 - u) * 24, layer: "sky" };
            }
            if (t < 2.45) {
              const u = (t - 2.1) / 0.35;
              const q = Math.sin(u * Math.PI) * (1 - u);
              return { x: CX, y: CY, z: RIM, sx: 1 + 0.35 * q, sy: 1 - 0.35 * q, rot: 0, layer: "sky" };
            }
            if (t < 3.9) return { x: CX, y: CY, z: RIM, sx: 1, sy: 1 + Math.sin(t * 9) * 0.02, rot: 0, layer: "sky" };
            if (t < 4.08) {
              const u = (t - 3.9) / 0.18;
              return { x: CX, y: CY, z: RIM, sx: 1 + 0.25 * eOut(u), sy: 1 - 0.3 * eOut(u), rot: 0, layer: "sky" };
            }
            if (t < 5.35) {
              const u = (t - 4.08) / 1.27;
              const st = Math.min(1, u * 5);
              return { x: CX, y: CY, z: RIM - (RIM - 6) * (0.35 * eIn(u) + 0.65 * u), sx: 1.25 - 0.47 * st, sy: 0.7 + 0.55 * st, rot: 0, layer: "in" };
            }
            if (t < 5.55) return { x: CX, y: CY, z: 4, sx: 1, sy: 1, rot: 0, layer: "none" };
            if (t < 5.95) {
              const u = (t - 5.55) / 0.4;
              const e = eOut(u);
              return { x: 50 + (OUT[0] - 50) * e, y: CY + (OUT[1] - CY) * e, z: Math.sin(u * Math.PI) * 36, sx: 1, sy: 1, rot: 0, layer: "floor" };
            }
            if (t < 6.8) return { x: OUT[0], y: OUT[1], z: 0, sx: 1, sy: 1 + Math.sin((t - 5.95) * 8) * 0.03, rot: 0, layer: "floor" };
            if (t < 7.45) {
              const u = (t - 6.8) / 0.65;
              const e = eIO(u);
              const lean = Math.sin(u * Math.PI);
              return { x: OUT[0] + (TREE[0] - OUT[0]) * e, y: OUT[1] + (TREE[1] - OUT[1]) * e, z: 0, sx: 1 + 0.15 * lean, sy: 1 - 0.1 * lean, rot: 0, layer: "floor", speed: lean };
            }
            const u = clamp((t - 7.45) / 0.45);
            const q = Math.sin(u * Math.PI) * (1 - u);
            return { x: TREE[0], y: TREE[1], z: 0, sx: 1 + 0.25 * q, sy: 1 - 0.25 * q, rot: 0, layer: "floor" };
          }
          function sim(t) {
            const g = giftState(t);
            [gin, gfl, gsk].forEach((el) => el.setAttribute("opacity", "0"));
            sEls.forEach((el) => el.setAttribute("opacity", "0"));
            if (g && g.layer !== "none") {
              const p = P(g.x, g.y, g.z);
              const el = g.layer === "in" ? gin : g.layer === "floor" ? gfl : gsk;
              el.setAttribute("opacity", "1");
              el.setAttribute("transform", `translate(${r1(p[0])},${r1(p[1] + GS * 0.5)}) rotate(${r1(g.rot)}) scale(${g.sx.toFixed(3)},${g.sy.toFixed(3)}) translate(0,${r1(-GS * 0.5)})`);
              if (g.speed) {
                for (let k = 0; k < 4; k++) {
                  const back = P(-70 - k * 10, 25 - k * 3, 0);
                  const a = P(g.x - 40, g.y + 12 + (k - 1.5) * 10, 12 + k * 9);
                  const b = P(g.x - 40 - (90 + k * 20) * g.speed, g.y + 12 + (k - 1.5) * 10 + (40 + k * 6) * g.speed, 12 + k * 9);
                  sEls[k].setAttribute("x1", r1(a[0]));
                  sEls[k].setAttribute("y1", r1(a[1]));
                  sEls[k].setAttribute("x2", r1(b[0]));
                  sEls[k].setAttribute("y2", r1(b[1]));
                  sEls[k].setAttribute("opacity", (0.75 * g.speed).toFixed(2));
                }
              }
            }
            // suie à la sortie du foyer
            const pu = (t - 5.5) / 0.9;
            for (let k = 0; k < 16; k++) {
              if (pu <= 0 || pu >= 1) {
                pEls[k].setAttribute("opacity", "0");
                continue;
              }
              const a = (k / 16) * Math.PI * 2;
              const rr = 20 + 70 * eOut(pu) * (0.6 + (k % 3) * 0.2);
              const base = P(70, CY, 30);
              pEls[k].setAttribute("cx", r1(base[0] + Math.cos(a) * rr));
              pEls[k].setAttribute("cy", r1(base[1] + Math.sin(a) * rr * 0.6 - pu * 30));
              pEls[k].setAttribute("r", r1(5 + 9 * pu));
              pEls[k].setAttribute("opacity", ((1 - pu) * 0.85).toFixed(2));
            }
            // guirlandes
            const boost = clamp(1 - Math.abs(t - 7.9) / 0.7);
            lEls.forEach((el, k) => el.setAttribute("opacity", Math.min(1, 0.45 + 0.4 * (0.5 + 0.5 * Math.sin(t * 5 + k * 1.7)) + boost * 0.6).toFixed(2)));
            treeGlow.setAttribute("opacity", (0.3 + boost * 0.5).toFixed(2));
            embers.setAttribute("opacity", (0.65 + 0.35 * Math.sin(t * 11)).toFixed(2));
            // ronflements du chat
            zEls.forEach((el, k) => {
              const a = ((t * 0.7 + k / 3) % 1 + 1) % 1;
              el.setAttribute("transform", `translate(${r1(a * 22)},${r1(-a * 46)})`);
              el.setAttribute("opacity", (Math.sin(a * Math.PI) * 0.9).toFixed(2));
            });
            // traîneau devant la lune
            const su = clamp((t - 0.15) / 2.2);
            document.getElementById("s5-sil").setAttribute("transform", `translate(${r1(900 + su * 1300)},${r1(470 - su * 220)})`);
            sn.update(t);
          }
          const clk = { t: 0 };
          tl.fromTo(clk, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: () => sim(clk.t) }, 0);

          // ---------- coupe : murs et toit s'effacent ----------
          tl.fromTo("#s5-roof", { y: 0, opacity: 1 }, { y: -260, opacity: 0, duration: 0.8, ease: "power3.in" }, 2.35);
          tl.fromTo("#s5-wr", { y: 0, opacity: 1 }, { y: 220, opacity: 0, duration: 0.7, ease: "power3.in" }, 2.55);
          tl.fromTo("#s5-wl", { y: 0, opacity: 1 }, { y: 220, opacity: 0, duration: 0.7, ease: "power3.in" }, 2.7);

          // ---------- caméra ----------
          const rig = I.camera(svg, { x: -110, y: -230, s: 1.75 });
          const cam = rig.cam;
          const z = { v: Math.log(1.75), x: -110, y: -235 };
          const ap = () => {
            cam.s = Math.exp(z.v);
            cam.x = z.x;
            cam.y = z.y;
            rig.apply();
          };
          let prev = { v: Math.log(1.75), x: -110, y: -235 };
          [
            [{ v: Math.log(1.6), x: -105, y: -225 }, 0, 2.2, "sine.inOut"],
            [{ v: Math.log(0.98), x: -40, y: -10 }, 2.2, 1.5, "power2.inOut"],
            [{ v: Math.log(1.22), x: -80, y: -150 }, 3.8, 0.6, "power2.inOut"],
            [{ v: Math.log(1.3), x: -60, y: 70 }, 4.4, 1.1, "power2.inOut"],
            [{ v: Math.log(1.3), x: 20, y: 100 }, 5.6, 1.2, "sine.inOut"],
            [{ v: Math.log(1.3), x: 80, y: 90 }, 6.8, 0.7, "power2.inOut"],
            [{ v: Math.log(1.02), x: -110, y: 40 }, 7.6, 1.6, "power2.inOut"],
          ].forEach(([to, at, dur, ease]) => {
            tl.fromTo(z, Object.assign({}, prev), Object.assign({ duration: dur, ease, onUpdate: ap, immediateRender: at === 0 }, to), at);
            prev = to;
          });

          // ---------- textes ----------
          const km = document.getElementById("s5-km");
          const kv = { v: 1000 };
          tl.fromTo("#s5-h1", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.25);
          tl.fromTo(kv, { v: 1000 }, { v: 0, duration: 1.8, ease: "power2.in", onUpdate: () => (km.textContent = String(Math.round(kv.v)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " m") }, 0.35);
          tl.to("#s5-h1", { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, 2.05);
          tl.fromTo("#s5-h2-k", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 2.15);
          tl.fromTo("#s5-stamp", { opacity: 0, scale: 2.4, rotation: -30 }, { opacity: 1, scale: 1, rotation: -12, duration: 0.4, ease: "power4.in" }, 2.35);
          tl.fromTo("#s5-h2-big", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, 3.85);
          tl.to("#s5-h2", { opacity: 0, y: -30, duration: 0.35, ease: "power2.in" }, 7.9);
          [
            ["#s5-row1", 5.85],
            ["#s5-row2", 6.8],
            ["#s5-row3", 8.0],
          ].forEach(([sel, t0]) => {
            tl.fromTo(sel, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, t0 - 0.05);
            tl.fromTo(sel + " .s5-ck", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, t0);
            tl.fromTo(sel + " .s5-row-t", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, t0 + 0.05);
            tl.fromTo(sel + " .s5-row-s", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, t0 + 0.2);
          });
          tl.fromTo("#s5-list", { y: 0 }, { y: -300, duration: 0.6, ease: "power3.inOut" }, 7.85);
          tl.fromTo("#s5-notif", { opacity: 0, y: -40, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.5)" }, 8.35);

          sim(0);
          window.__timelines["s5-cheminee"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
