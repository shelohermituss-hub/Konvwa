    <script>
      ;(function () {
        const tl = gsap.timeline({ paused: true })
        const $ = (id) => document.getElementById(id)
        const END = 15.5
        const RAW = [0.0, 0.175, 0.229, 0.661, 0.823, 1.2, 1.435, 1.702, 1.777, 2.047, 2.154, 2.477, 2.801, 3.37, 3.42, 3.555, 3.833, 4.055, 4.166, 4.277, 4.442, 4.553, 4.664, 5.138, 5.245, 5.584, 6.637, 7.284, 7.692, 7.896, 8.032, 8.507, 8.644, 8.916, 9.256, 9.391, 9.878, 9.928, 10.144, 10.557, 10.833, 11.316, 11.798, 11.848, 11.898, 12.005, 12.143, 12.487, 12.626, 12.676, 12.726, 12.832, 12.97, 13.246, 13.797, 13.935]
        const T = RAW.map((t) => Math.round((0.2 + t) * 100) / 100)
        const WORDS = ["Haïti", "a", "toujours", "été", "pauvre.", "Ça,", "c'est", "ce", "qu'on", "te", "répète", "depuis", "l'école.", "Sauf", "que", "c'est", "faux,", "et", "je", "vais", "te", "le", "prouver.", "En", "1789,", "Saint-Domingue,", "l'actuelle", "Haïti,", "est", "la", "colonie", "la", "plus", "riche", "du", "monde.", "À", "elle", "seule,", "elle", "fournit", "environ", "40 %", "", "", "du", "sucre", "et", "60 %", "", "", "du", "café", "consommés", "en", "Europe."]
        const NS = 'http://www.w3.org/2000/svg'
        // deterministic pseudo-random numbers (same video on every render)
        let seed = 7
        const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)

        // ---------- flat bust characters (SVG): skin, hair, outfit, expression ----------
        function bust(o) {
          const skin = o.skin, dark = o.skinDark
          const brow = { sad: ['M222,250 L282,236', 'M318,236 L378,250'], sure: ['M222,240 L282,246', 'M318,234 L378,226'], neutral: ['M222,242 L282,240', 'M318,240 L378,242'] }[o.mood]
          const mouth = { sad: 'M262,382 Q300,356 338,382', sure: 'M258,366 Q300,404 342,362', neutral: 'M270,372 Q300,384 330,372' }[o.mood]
          let hair = ''
          if (o.hair === 'curly') hair = '<path d="M178,262 C170,150 240,108 300,108 C360,108 430,150 422,262 C410,214 380,186 300,184 C220,186 190,214 178,262Z" fill="#1b1410"/>' + Array.from({ length: 26 }, (_, i) => `<circle cx="${200 + (i % 9) * 25}" cy="${142 + Math.floor(i / 9) * 26}" r="4" fill="#3a2c22"/>`).join('')
          if (o.hair === 'grey') hair = '<ellipse cx="190" cy="250" rx="34" ry="46" fill="#d9dde3"/><ellipse cx="410" cy="250" rx="34" ry="46" fill="#d9dde3"/><path d="M190,220 C200,150 250,130 300,130 C350,130 400,150 410,220 C380,190 340,180 300,180 C260,180 220,190 190,220Z" fill="#d9dde3"/>'
          let hat = ''
          if (o.hat) hat = '<ellipse cx="300" cy="196" rx="232" ry="46" fill="#c99a45"/><path d="M196,196 C200,110 250,80 300,80 C350,80 400,110 404,196Z" fill="#dcb25c"/><rect x="198" y="160" width="204" height="26" fill="#8a3b1e"/><ellipse cx="300" cy="196" rx="232" ry="46" fill="none" stroke="#a87a2e" stroke-width="6"/>'
          const glasses = o.glasses ? '<circle cx="255" cy="300" r="40" fill="none" stroke="#222" stroke-width="8"/><circle cx="345" cy="300" r="40" fill="none" stroke="#222" stroke-width="8"/><line x1="295" y1="300" x2="305" y2="300" stroke="#222" stroke-width="8"/>' : ''
          return `<svg viewBox="0 0 600 700" width="100%" height="100%" style="position:absolute;left:0;top:0">
            <path d="M40,700 C40,520 150,468 300,468 C450,468 560,520 560,700Z" fill="${o.coat}"/>
            <path d="M300,468 L200,476 L268,640Z" fill="${o.lapel}"/><path d="M300,468 L400,476 L332,640Z" fill="${o.lapel}"/>
            <path d="M252,470 L348,470 L300,600Z" fill="${o.shirt}"/>
            <rect x="262" y="392" width="76" height="92" rx="20" fill="${dark}"/>
            <ellipse cx="180" cy="312" rx="24" ry="34" fill="${dark}"/><ellipse cx="420" cy="312" rx="24" ry="34" fill="${dark}"/>
            <ellipse cx="300" cy="296" rx="124" ry="142" fill="${skin}"/>
            <path d="M300,154 C380,160 424,226 424,300 C424,380 380,436 300,438 C352,410 380,360 380,296 C380,226 350,176 300,154Z" fill="${dark}" opacity="0.35"/>
            ${hair}${hat}
            <g class="eyes"><ellipse cx="255" cy="300" rx="26" ry="24" fill="#fff"/><ellipse cx="345" cy="300" rx="26" ry="24" fill="#fff"/>
            <circle cx="${o.mood === 'sad' ? 255 : 258}" cy="${o.mood === 'sad' ? 306 : 302}" r="12" fill="#151515"/><circle cx="${o.mood === 'sad' ? 345 : 348}" cy="${o.mood === 'sad' ? 306 : 302}" r="12" fill="#151515"/>
            <circle cx="262" cy="296" r="4" fill="#fff"/><circle cx="352" cy="296" r="4" fill="#fff"/></g>
            <g class="lids" style="transform-origin:300px 300px;transform:scaleY(0)"><rect x="224" y="274" width="62" height="52" fill="${skin}"/><rect x="314" y="274" width="62" height="52" fill="${skin}"/></g>
            ${glasses}
            <path d="${brow[0]}" stroke="#1b1410" stroke-width="10" stroke-linecap="round"/><path d="${brow[1]}" stroke="#1b1410" stroke-width="10" stroke-linecap="round"/>
            <path d="M296,320 Q290,342 304,346" stroke="${dark}" stroke-width="7" fill="none" stroke-linecap="round"/>
            <path d="${mouth}" stroke="#3a1a12" stroke-width="9" fill="none" stroke-linecap="round"/>
          </svg>`
        }
        const HAITIEN = { skin: '#8a5a3c', skinDark: '#6b4229', coat: '#3f5a45', lapel: '#2e4434', shirt: '#efe6d4' }
        $('pay1').innerHTML = bust(Object.assign({}, HAITIEN, { mood: 'sad', hat: true, coat: '#56606b', lapel: '#444c55', shirt: '#cfd3d8' }))
        $('fier').innerHTML = bust(Object.assign({}, HAITIEN, { mood: 'sure', hair: 'curly' }))
        $('prof').innerHTML = bust({ skin: '#f0c9a8', skinDark: '#d8a985', coat: '#6b4a2f', lapel: '#563a24', shirt: '#f2efe8', mood: 'neutral', hair: 'grey', glasses: true })
        // blinks: pure tweens on the eyelids
        const blink = (sel, times) => times.forEach((t) => tl.fromTo(sel + ' .lids', { scaleY: 0 }, { scaleY: 1, duration: 0.06, yoyo: true, repeat: 1, ease: 'none', immediateRender: false }, t))

        // ---------- decor builders ----------
        function rays(id, n, c1, c2) {
          let s = ''
          for (let i = 0; i < n; i++) { const a0 = (i / n) * Math.PI * 2, a1 = ((i + 0.5) / n) * Math.PI * 2; s += `<path d="M0,0 L${(Math.cos(a0) * 1400).toFixed(0)},${(Math.sin(a0) * 1400).toFixed(0)} L${(Math.cos(a1) * 1400).toFixed(0)},${(Math.sin(a1) * 1400).toFixed(0)}Z" fill="${i % 2 ? c1 : c2}"/>` }
          $(id).innerHTML = s
        }
        rays('rays3', 28, '#ffd36a', '#a8650f')
        rays('rays6', 28, '#ffcf70', '#6b3a10')
        // rain streaks
        let rs = ''
        for (let i = 0; i < 90; i++) { const x = rnd() * 1180 - 50, y = rnd() * 1920, l = 40 + rnd() * 50; rs += `<line class="drop" x1="${x.toFixed(0)}" y1="${y.toFixed(0)}" x2="${(x - 10).toFixed(0)}" y2="${(y + l).toFixed(0)}" stroke="rgba(190,205,225,0.45)" stroke-width="3" stroke-linecap="round"/>` }
        $('rain1').innerHTML = rs
        $('cloud1').innerHTML = '<g fill="#5b6472"><circle cx="160" cy="160" r="90"/><circle cx="290" cy="120" r="115"/><circle cx="420" cy="160" r="90"/><rect x="120" y="150" width="340" height="100" rx="50"/></g><g fill="#6b7482"><circle cx="270" cy="110" r="70"/></g>'
        // sparkles

          tl.fromTo(s + ' .cam', { scale: 1 }, { scale: 1.06, duration: CUT[i + 1] - CUT[i], ease: 'none', immediateRender: false }, CUT[i])
          // a quick punch on each cut
          if (i) tl.fromTo(s + ' .cam', { y: 30 }, { y: 0, duration: 0.25, ease: 'power3.out', immediateRender: false }, CUT[i])
        })
        const pop = (sel, t, o) => tl.fromTo(sel, Object.assign({ autoAlpha: 0, scale: 0.4 }, o || {}), { autoAlpha: 1, scale: 1, x: 0, y: 0, rotation: (o && o.rot) || 0, duration: 0.4, ease: 'back.out(1.8)' }, t)
        const count = (node, from, to, t0, t1, fmt) => { const o = { v: from }; tl.fromTo(o, { v: from }, { v: to, duration: t1 - t0, ease: 'power2.out', immediateRender: false, onUpdate: () => { node.textContent = fmt(o.v) } }, t0) }

        // 1. rain, cloud, the sad farmer
        tl.fromTo('#pay1', { y: 200 }, { y: 0, duration: 0.45, ease: 'expo.out' }, 0)
        tl.fromTo('#cloud1', { y: -200, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: 'power3.out' }, 0.05)
        tl.fromTo('#cloud1', { x: -10 }, { x: 10, duration: 1.2, yoyo: true, repeat: 3, ease: 'sine.inOut', immediateRender: false }, 0.5)
        document.querySelectorAll('#rain1 .drop').forEach((d, i) => tl.fromTo(d, { y: -200 }, { y: 1900, duration: 0.9 + (i % 5) * 0.12, ease: 'none', repeat: Math.ceil(CUT[1] / 0.9), immediateRender: false }, 0))
        blink('#pay1', [1.6, 3.2])
        // 2. chalk words appear, the teacher points, « FAUX »
        pop('#prof', CUT[1], { y: 260, scale: 1 })
        tl.fromTo('#chalk1', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.5, ease: 'steps(7)' }, CUT[1] + 0.1)
        tl.fromTo('#chalk2', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.7, ease: 'steps(11)' }, CUT[1] + 0.6)
        tl.fromTo('#stick', { rotation: 8 }, { rotation: -6, duration: 0.35, yoyo: true, repeat: 3, ease: 'sine.inOut', immediateRender: false }, CUT[1] + 0.2)
        blink('#prof', [CUT[1] + 0.9])
        tl.fromTo('#faux', { autoAlpha: 0, scale: 2.6, rotation: 4 }, { autoAlpha: 1, scale: 1, rotation: -10, duration: 0.2, ease: 'power4.in' }, T[16] - 0.05)
        tl.fromTo('#c2', { x: 0 }, { x: 14, duration: 0.04, yoyo: true, repeat: 5, ease: 'none', immediateRender: false }, T[16] + 0.15)
        tl.to('#chalk2', { color: '#9aa69c', duration: 0.2 }, T[16] + 0.1)
        // 3. rays turn, sparkles, the proud man
        tl.fromTo('#rays3', { rotation: 0 }, { rotation: 25, duration: CUT[3] - CUT[2], ease: 'none', immediateRender: false }, CUT[2])
        pop('#fier', CUT[2], { y: 200, scale: 1 })
        document.querySelectorAll('#spark3 .sp').forEach((p, i) => tl.fromTo(p, { scale: 0, rotation: 0 }, { scale: 1, rotation: 45, duration: 0.35, yoyo: true, repeat: 3, ease: 'sine.inOut', immediateRender: false }, CUT[2] + 0.08 * i))
        blink('#fier', [CUT[2] + 0.7])
        // 4. the year counts up, the flame flickers
        count($('annee'), 1700, 1789, CUT[3], CUT[3] + 0.6, (v) => String(Math.round(v)))
        tl.fromTo('#annee', { scale: 0.7 }, { scale: 1, duration: 0.5, ease: 'back.out(2)', immediateRender: false }, CUT[3])
        tl.fromTo('#flame', { scaleY: 0.85, skewX: -4 }, { scaleY: 1.1, skewX: 4, duration: 0.13, yoyo: true, repeat: 20, ease: 'sine.inOut', immediateRender: false }, CUT[3])
        // 5. Haiti lights up in gold, the label, then a rain of coins
        tl.fromTo('#m-HTI', { fill: '#3a3f4c' }, { fill: '#ffc93c', duration: 0.3, ease: 'power2.out', immediateRender: false }, T[25] + 0.1)
        tl.fromTo('#m-HTI', { filter: 'drop-shadow(0 0 0px rgba(255,190,40,0))' }, { filter: 'drop-shadow(0 0 14px rgba(255,190,40,0.95))', duration: 0.4, immediateRender: false }, T[25] + 0.1)
        pop('#sdlab', T[25] + 0.15, { y: 30 })
        tl.fromTo('#map5', { x: 0, y: 0, scale: 1 }, { x: -80, y: -60, scale: 1.18, duration: CUT[5] - T[25], ease: 'power1.inOut', immediateRender: false, transformOrigin: '50% 50%' }, T[25])
        pop('#riche', T[32] - 0.05, { scale: 0.6 })
        document.querySelectorAll('#coins5 .coin').forEach((c, i) => {
          const x = +c.dataset.x
          tl.fromTo(c, { x, y: -80 - (i % 7) * 120, rotation: 0 }, { x: x + ((i % 3) - 1) * 40, y: 2000, rotation: 360, duration: 1.4 + (i % 4) * 0.2, ease: 'power1.in', immediateRender: false }, T[32] + (i % 11) * 0.09)
        })
        gsap.set('#coins5 .coin', { y: -300 })
        // 6. two sacks, two counters
        tl.fromTo('#rays6', { rotation: 0 }, { rotation: 20, duration: END - CUT[5], ease: 'none', immediateRender: false }, CUT[5])
        pop('#sac1', CUT[5] + 0.05, { y: 200, scale: 0.8 })
        pop('#sac2', CUT[5] + 0.2, { y: 200, scale: 0.8 })
        pop('#l1', T[46] - 0.05, { y: 20 })
        pop('#l2', T[52] - 0.05, { y: 20 })
        gsap.set(['#p1', '#p2'], { autoAlpha: 0 })
        tl.set('#p1', { autoAlpha: 1 }, T[42] - 0.05)
        tl.set('#p2', { autoAlpha: 1 }, T[48] - 0.05)
        count($('p1n'), 0, 40, T[42] - 0.05, T[44] + 0.25, (v) => String(Math.round(v)))
        count($('p2n'), 0, 60, T[48] - 0.05, T[50] + 0.25, (v) => String(Math.round(v)))
        tl.fromTo(['#sac1', '#sac2'], { rotation: -2 }, { rotation: 2, duration: 0.5, yoyo: true, repeat: 5, ease: 'sine.inOut', immediateRender: false }, T[48])

        // ---------- captions: groups of 2-4 words, the spoken word in a red box ----------
        const caps = $('caps')
        const G = []
        let cur = []
        WORDS.forEach((w, k) => {
          if (!w) return
          cur.push(k)
          const len = cur.reduce((n, j) => n + WORDS[j].length + 1, 0)
          if (/[.,:;?!…]$/.test(w) || cur.length >= 4 || len > 20) { G.push(cur); cur = [] }
        })
        if (cur.length) G.push(cur)
        G.forEach((g, gi) => {
          const box = document.createElement('div'); box.className = 'grp'; caps.appendChild(box)
          const t0 = T[g[0]] - 0.04, t1 = gi < G.length - 1 ? T[G[gi + 1][0]] - 0.04 : END
          tl.set(box, { visibility: 'visible' }, t0)
          tl.set(box, { visibility: 'hidden' }, t1)
          tl.fromTo(box, { scale: 0.92 }, { scale: 1, duration: 0.12, ease: 'power2.out', immediateRender: false }, t0)
          g.forEach((k, j) => {
            const s = document.createElement('span'); s.className = 'cw'; s.textContent = WORDS[k]; box.appendChild(s)
            const next = j < g.length - 1 ? T[g[j + 1]] - 0.04 : t1
            tl.set(s, { '--on': 1 }, T[k] - 0.04)
            tl.set(s, { '--on': 0 }, next)
          })
        })

        // ---------- progress bar ----------
        tl.fromTo('#prog', { scaleX: 0 }, { scaleX: 1, duration: END, ease: 'none', immediateRender: false }, 0)
        gsap.set('#prog', { scaleX: 0 })

        window.__timelines = window.__timelines || {}
        window.__timelines['main'] = tl
      })()
    </script>
  </body>
</html>
