    <!--
      Même grammaire que haiti-1804 (référence K, _engine/references/ref-k-histoire) : un seul plan continu sur fond gris clair,
      texte = voix mot par mot (gris flou → encre, mots forts en orange KONVWA), lignes de tailles mêlées, objets posés avec une
      ombre douce, changement de partie par flou plein cadre, appel à commenter puis logo. Version « plus vivante » : chaque partie
      a sa photo ou son illustration en couleur et un petit objet animé (cœurs qui battent, flux de sang, électrocardiogramme,
      batterie, anneau des neurones).

    <script>
      ;(function () {
        const tl = gsap.timeline({ paused: true })
        const $ = (id) => document.getElementById(id)
        const el = (tag, cls, txt, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; if (parent) parent.appendChild(e); return e }
        const blur = (n) => 'blur(' + n + 'px)'
        const END = 30

        // ---------- the voice: start of each spoken word in assets/vo/vo.wav (starts at 0.2 s); words 47–53 were cut from the voice and are never shown ----------
        const RAW = [0.0, 0.223, 0.816, 1.13, 1.66, 2.3, 2.577, 3.064, 3.203, 3.48, 3.758, 3.966, 4.661, 4.799, 5.425, 5.724, 5.874, 6.248, 6.398, 6.64, 6.735, 6.91, 7.26, 7.522, 7.96, 8.109, 8.857, 9.53, 9.904, 10.053, 10.576, 10.756, 11.055, 11.174, 11.354, 11.653, 11.739, 11.9, 12.229, 12.362, 12.824, 13.153, 13.351, 13.682, 14.275, 14.803, 14.957, 15.428, 15.478, 15.528, 15.578, 15.628, 15.678, 15.728, 15.84, 16.194, 16.689, 16.901, 17.184, 17.537, 17.676, 17.883, 18.438, 18.716, 18.992, 19.201, 19.478, 19.72, 20.153, 20.441, 20.73, 21.26, 21.88, 21.984, 22.297, 22.506, 22.74, 23.43, 23.66, 23.786, 24.478, 24.605, 24.856, 25.487, 25.612, 25.99, 26.383, 26.645, 27.168, 27.496]
        const T = RAW.map((t) => Math.round((0.2 + t) * 100) / 100)
        const WORDS = ['Les', 'pieuvres', 'ont', 'trois', 'cœurs.', 'Deux', 'pompent', 'le', 'sang', 'vers', 'les', 'branchies,', 'le', 'troisième', 'vers', 'le', 'reste', 'du', 'corps.', 'Et', 'ce', 'sang', 'est', 'bleu :', 'il', 'transporte', "l'oxygène", 'grâce', 'au', 'cuivre,', 'pas', 'grâce', 'au', 'fer', 'comme', 'le', 'nôtre.', 'Quand', 'la', 'pieuvre', 'nage,', 'son', 'cœur', 'principal', "s'arrête", 'de', 'battre.', 'Voilà', 'pourquoi', 'elle', 'préfère', 'ramper :', 'nager', "l'épuise.", 'Autre', 'secret :', 'les', 'deux', 'tiers', 'de', 'ses', 'neurones', 'sont', 'dans', 'ses', 'huit', 'bras.', 'Chaque', 'bras', 'peut', 'toucher,', 'goûter,', 'et', 'réagir', 'tout', 'seul.', 'Écrivez', '« 3 »', 'en', 'commentaire', 'si', 'vous', "l'ignoriez.", 'Et', 'suivez', 'KONVWA', 'pour', "d'autres", 'faits', 'étonnants.']

        // ---------- blocks of stacked lines: [first word, last word, style, bullet?]; y = top of the block ----------
        const BLOCKS = [
          { y: 250, lines: [[0, 2, 's'], [3, 4, 'b']] },
          { y: 250, lines: [[5, 6, 'm'], [7, 11, 's'], [12, 13, 'mi'], [14, 18, 's']] },
          { y: 250, lines: [[19, 22, 'm'], [23, 23, 'blue']], until: 37 },
          { y: 1200, lines: [[24, 26, 's'], [27, 29, 'mi'], [30, 36, 's', '✕']] },
          { y: 250, lines: [[37, 39, 's'], [40, 40, 'bi'], [41, 43, 's'], [44, 46, 'mi']] },

        ]
        // the big, bold and italic words settle in KONVWA orange (a touch deeper than #F05A28 to keep 3:1 on the grey); "bleu" in blue
        const ORANGE = '#E2501D'
        const INK = { b: ORANGE, bi: ORANGE, mi: ORANGE, cta: ORANGE, blue: '#1F6FE0' }
        const blocksBox = $('blocks')
        BLOCKS.forEach((B, bi) => {
          const first = B.lines[0][0]
          const start = Math.max(0, T[first] - 0.06)
          const next = BLOCKS[bi + 1]
          const end = B.until != null ? T[B.until] - 0.08 : next ? T[next.lines[0][0]] - 0.08 : END
          const box = el('div', 'block', null, blocksBox)
          box.style.top = B.y + 'px'
          if (B.x) { box.style.left = B.x[0] + 'px'; box.style.right = B.x[1] + 'px' }
          if (B.left) box.style.alignItems = 'flex-start'
          gsap.set(box, { autoAlpha: 0 })
          tl.set(box, { autoAlpha: 1 }, start)
          B.lines.forEach(([a, b, st, bullet]) => {
            const line = el('div', 'line ' + st + (bullet ? ' bullet' : ''), null, box)
            if (bullet) {
              const ic = el('i', '', bullet, line)
              tl.fromTo(ic, { opacity: 0, scale: 0.4, rotation: -40 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.3, ease: 'back.out(2)' }, T[a] - 0.04)
            }
            for (let k = a; k <= b; k++) {
              const w = el('span', 'w', WORDS[k], line)
              // each word lands blurred and pale, then settles in ink (reference K)
              tl.fromTo(w, { opacity: 0, color: '#B9B9B9', y: 10, filter: blur(8) }, { opacity: 1, y: 0, filter: blur(0), duration: 0.22, ease: 'power2.out' }, T[k])
              tl.to(w, { color: INK[st] || '#1A1A1A', duration: 0.35, ease: 'power1.out' }, T[k] + 0.12)
            }
          })
          if (end < END) tl.to(box, { autoAlpha: 0, filter: blur(10), y: -16, duration: 0.18, ease: 'power2.in' }, end - 0.18)
        })

        // ---------- full-frame blur between parts (the reference never cuts) ----------
        const morph = (at) => {
          tl.to('#world', { filter: blur(28), duration: 0.22, ease: 'power2.in' }, at - 0.22)
          tl.to('#veil', { opacity: 0.55, duration: 0.22, ease: 'power2.in' }, at - 0.22)
          tl.to('#world', { filter: blur(0), duration: 0.32, ease: 'power2.out' }, at + 0.02)
          tl.to('#veil', { opacity: 0, duration: 0.32, ease: 'power2.out' }, at + 0.02)
        }
        const MORPHS = [5, 19, 37, 54, 67, 76, 83].map((k) => Math.round((T[k] - 0.12) * 100) / 100)
        MORPHS.forEach(morph)

        const pop = (sel, at, o) => tl.fromTo(sel, Object.assign({ autoAlpha: 0, scale: 0.86, y: 60, filter: blur(14) }, o), { autoAlpha: 1, scale: 1, y: 0, x: 0, rotation: 0, filter: blur(0), duration: 0.55, ease: 'expo.out' }, at)
        const hide = (sel, at) => tl.set(sel, { autoAlpha: 0 }, at)
        // a heart that beats from `from` to `to` (seek-safe: a finite repeat on the main timeline)
        const HEART = 'M50 88 C50 88 8 62 8 34 C8 18 20 8 33 8 C41 8 47 12 50 19 C53 12 59 8 67 8 C80 8 92 18 92 34 C92 62 50 88 50 88 Z'
        const heart = (parent, x, y, size, color, label) => {
          const h = el('div', 'heart', null, parent)
          Object.assign(h.style, { left: x + 'px', top: y + 'px', width: size + 'px', height: size * 0.9 + 'px' })
          h.innerHTML = '<svg viewBox="0 0 100 92"><path d="' + HEART + '" fill="' + color + '" style="filter: drop-shadow(0 10px 14px rgba(0,0,0,.18))"/></svg>' + (label ? '<span>' + label + '</span>' : '')
          return h
        }
        const beat = (h, from, to, period) => {
          const n = Math.max(0, Math.floor((to - from) / period) - 1)
          tl.fromTo(h, { scale: 1 }, { scale: 1.14, duration: period / 2, ease: 'sine.inOut', yoyo: true, repeat: n * 2 + 1, immediateRender: false }, from)
        }
        gsap.set(['#o-hero', '#o-panel', '#o-blood', '#o-drop', '#t-cu', '#t-fe', '#o-swim', '#o-ecg', '#o-donut', '#o-arm', '#o-hero2', '#o-logo'], { autoAlpha: 0 })

        // ---------- 1. hook: the octopus rises, then its three hearts pop one by one ----------
        tl.fromTo('#o-hero', { autoAlpha: 0, y: 260, rotation: -8, filter: blur(16) }, { autoAlpha: 1, y: 0, rotation: 0, filter: blur(0), duration: 0.9, ease: 'expo.out' }, 0)
        tl.to('#o-hero', { y: -24, rotation: 2, duration: MORPHS[0] - 0.9, ease: 'sine.inOut' }, 0.9)
        tl.to('#grid', { opacity: 1, duration: 0.6 }, 0.1)
        const hookHearts = $('hook-hearts')
        ;[[130, 760], [800, 640], [820, 980]].forEach(([x, y], i) => {
          const h = heart(hookHearts, x, y, 150, ORANGE, String(i + 1))
          h.classList.add('obj')
          gsap.set(h, { autoAlpha: 0 })
          const at = T[3] + i * 0.16
          tl.fromTo(h, { autoAlpha: 0, scale: 0.2, rotation: -25 }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.45, ease: 'back.out(2.4)' }, at)
          beat(h, at + 0.5, MORPHS[0], 0.5)
          hide(h, MORPHS[0])
        })
        hide('#o-hero', MORPHS[0])

        // ---------- 2. two gill hearts → gills, the main heart → the body; blood flows along the pipes ----------
        pop('#o-panel', MORPHS[0] + 0.04)
        const h1 = heart($('hs1'), 20, 30, 120, ORANGE)
        const h2 = heart($('hs1'), 160, 30, 120, ORANGE)
        const h3 = heart($('hs2'), 75, 0, 170, '#C23010')
        ;[[$('row1'), [h1, h2], T[5]], [$('row2'), [h3], T[12]]].forEach(([row, hs, at], r) => {
          gsap.set(row, { autoAlpha: 0 })
          tl.fromTo(row, { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: 'expo.out' }, at)
          hs.forEach((h, i) => tl.fromTo(h, { scale: 0.3 }, { scale: 1, duration: 0.45, ease: 'back.out(2.4)' }, at + i * 0.12))
          hs.forEach((h) => beat(h, at + 0.6, MORPHS[1], r ? 0.62 : 0.46))
          row.querySelectorAll('.pipe i').forEach((d, i) => {
            const n = Math.floor((MORPHS[1] - at - 0.8) / 0.9)
            tl.fromTo(d, { x: 0 }, { x: 240, duration: 0.9, ease: 'none', repeat: n, immediateRender: false }, at + 0.5 + i * 0.3)
          })
          tl.fromTo(row.querySelector('.dest'), { scale: 0.7 }, { scale: 1, duration: 0.4, ease: 'back.out(2)' }, at + 0.35)
        })
        hide('#o-panel', MORPHS[1])

        // ---------- 3. blue blood: a close-up of the animal, a blue drop, copper yes, iron no ----------
        pop('#o-blood', MORPHS[1] + 0.04)
        tl.fromTo('#blood-img', { scale: 1.15 }, { scale: 1, duration: MORPHS[2] - MORPHS[1], ease: 'none' }, MORPHS[1])
        tl.fromTo('#o-drop', { autoAlpha: 0, y: -240, scale: 0.6 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.6, ease: 'bounce.out' }, T[23] - 0.2)
        tl.to('#o-drop', { y: 14, duration: 0.9, ease: 'sine.inOut', yoyo: true, repeat: 7, immediateRender: false }, T[23] + 0.5)
        pop('#t-cu', T[29] - 0.1, { scale: 0.5, rotation: -10 })
        tl.fromTo('#t-cu .badge', { scale: 0 }, { scale: 1, duration: 0.35, ease: 'back.out(3)' }, T[29] + 0.3)
        pop('#t-fe', T[33] - 0.1, { scale: 0.5, rotation: 10 })
        tl.fromTo('#fe-x', { scale: 0 }, { scale: 1, duration: 0.35, ease: 'back.out(3)' }, T[33] + 0.25)
        tl.to('#t-fe .tile', { opacity: 0.5, filter: 'grayscale(1)', duration: 0.3 }, T[33] + 0.25)
        hide(['#o-blood', '#o-drop', '#t-cu', '#t-fe'], MORPHS[2])

        // ---------- 4. swimming: the heart monitor beats, then goes flat on "s'arrête" ----------
        tl.fromTo('#o-swim', { autoAlpha: 0, x: -520, y: 360, rotation: -18, filter: blur(14) }, { autoAlpha: 1, x: 0, y: 0, rotation: 0, filter: blur(0), duration: 0.9, ease: 'expo.out' }, MORPHS[2] + 0.04)
        tl.to('#o-swim', { x: 50, y: -50, rotation: 3, duration: T[44] - MORPHS[2] - 0.9, ease: 'sine.inOut' }, MORPHS[2] + 0.94)
        tl.to('#o-swim', { y: 40, rotation: -4, filter: 'saturate(0.55)', duration: MORPHS[3] - T[44], ease: 'power1.out' }, T[44])
        pop('#o-ecg', MORPHS[2] + 0.3)
        const ecgHeart = heart($('ecg-heart'), 0, 0, 100, ORANGE)
        // three beats, then flat: 128 px per beat, peak at +86
        let d = 'M0 70'
        for (let i = 0; i < 3; i++) d += ' l40 0 l10 -10 l10 10 l8 0 l8 30 l10 -88 l10 78 l8 -20 l24 0'
        d += ' L640 70'
        $('ecg-path').setAttribute('d', d)
        const E0 = T[39]
        const E1 = T[44] + 0.05
        tl.fromTo('#ecg-path', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 40% 0 0)', duration: E1 - E0, ease: 'none' }, E0)
        tl.to('#ecg-path', { clipPath: 'inset(0 0% 0 0)', duration: MORPHS[3] - E1 - 0.15, ease: 'none' }, E1)
        for (let i = 0; i < 3; i++) {
          const at = E0 + ((128 * i + 86) / 384) * (E1 - E0)
          tl.fromTo(ecgHeart, { scale: 1 }, { scale: 1.22, duration: 0.12, ease: 'power2.out', yoyo: true, repeat: 1, immediateRender: false }, at - 0.06)
        }
        tl.to('#ecg-path', { stroke: '#9A9A9A', duration: 0.3 }, E1)
        tl.to(ecgHeart, { filter: 'grayscale(1)', opacity: 0.55, scale: 0.92, duration: 0.3 }, E1)
        hide(['#o-swim', '#o-ecg'], MORPHS[3])

        // ---------- 5. two thirds of the neurons: the ring fills, then the eight arms are counted ----------
        pop('#o-donut', MORPHS[3] + 0.04)
        tl.fromTo('#o-donut', { '--p': 0 }, { '--p': 66.7, duration: 1.3, ease: 'power2.inOut', immediateRender: false }, T[57])
        tl.fromTo('#o-donut', { rotation: 0 }, { rotation: 12, duration: MORPHS[4] - MORPHS[3], ease: 'none', immediateRender: false }, MORPHS[3])
        const arms = $('arms')
        for (let i = 0; i < 8; i++) {
          const a = -Math.PI / 2 + (i / 8) * Math.PI * 2
          const c = el('div', 'arm obj', String(i + 1), arms)
          c.style.left = Math.round(540 + Math.cos(a) * 345 - 38) + 'px'
          c.style.top = Math.round(1040 + Math.sin(a) * 345 - 38) + 'px'
          gsap.set(c, { autoAlpha: 0 })
          tl.fromTo(c, { autoAlpha: 0, scale: 0.3 }, { autoAlpha: 1, scale: 1, duration: 0.28, ease: 'back.out(2.6)' }, T[65] - 0.25 + i * 0.045)
          hide(c, MORPHS[4])
        }
        hide('#o-donut', MORPHS[4])

        // ---------- 6. the suckers: touch, taste, react ----------
        pop('#o-arm', MORPHS[4] + 0.04, { x: -120, rotation: -4 })
        tl.fromTo('#arm-img', { scale: 1.2 }, { scale: 1.02, duration: MORPHS[5] - MORPHS[4], ease: 'none' }, MORPHS[4])
        tl.to('#o-arm', { rotation: 2, duration: 0.25, ease: 'power2.out', yoyo: true, repeat: 1 }, T[74])
        hide('#o-arm', MORPHS[5])

        // ---------- 7. call to action (the octopus and its hearts come back), then the brand ----------
        tl.fromTo('#o-hero2', { autoAlpha: 0, y: 300, filter: blur(14) }, { autoAlpha: 1, y: 0, filter: blur(0), duration: 0.8, ease: 'expo.out' }, MORPHS[5] + 0.04)
        tl.to('#o-hero2', { y: -20, duration: MORPHS[6] - MORPHS[5] - 0.8, ease: 'sine.inOut' }, MORPHS[5] + 0.84)
        const ctaHearts = $('cta-hearts')
        ;[[220, 880], [760, 780], [780, 1110]].forEach(([x, y], i) => {
          const h = heart(ctaHearts, x, y, 110, ORANGE, String(i + 1))
          h.classList.add('obj')
          h.querySelector('span').style.fontSize = '34px'
          gsap.set(h, { autoAlpha: 0 })
          tl.fromTo(h, { autoAlpha: 0, scale: 0.2 }, { autoAlpha: 1, scale: 1, duration: 0.4, ease: 'back.out(2.4)' }, T[77] + i * 0.12)
          beat(h, T[77] + 0.5, MORPHS[6], 0.5)
          hide(h, MORPHS[6])
        })
        hide('#o-hero2', MORPHS[6])
        pop('#o-logo', T[85], { scale: 0.4, rotation: -10 })
        tl.to('#o-logo', { y: -20, duration: END - T[85] - 0.6, ease: 'sine.inOut' }, T[85] + 0.6)

        // slow camera push over the whole film
        tl.fromTo('#world', { scale: 1 }, { scale: 1.035, duration: END, ease: 'none', immediateRender: false }, 0)

        window.__timelines = window.__timelines || {}
        window.__timelines['main'] = tl
      })()
    </script>
  </body>
</html>
