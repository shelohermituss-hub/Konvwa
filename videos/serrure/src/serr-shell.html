    <title>Comment une clé ouvre une serrure</title>

    <!--
      « style STUDIO » (variante C, videos/_engine/style-3d-studio/README.md) : « Comment une clé ouvre une serrure ».
      Deux clés presque pareilles → la serrure coupée en deux : cylindre, goupilles (en bas, en haut, ressort), la frontière (ligne de
      séparation) → sans clé, bloqué → la clé entre, ses dents soulèvent chaque goupille pile à la bonne hauteur, tout s'aligne,
      le cylindre tourne et tire le pêne → la clé du voisin : une goupille trop haute, bloqué → l'Égypte, il y a ≈ 4 000 ans, des goupilles
      en bois → « ta clé n'ouvre pas la serrure : elle aligne des goupilles » → feuille de partage.
      Signature « Godzy » dans le décor : plaque de la porte, tête de la clé (gravée), façade de la serrure (videos/_engine/signature/).
      Voix Adrien Moreau ; ambiance de pièce très basse, bruitages discrets (../_engine/style-anime/mix_anime.py, sans musique).
    -->

      #hole { position: absolute; left: 22px; top: 22px; width: 576px; height: 600px; border-radius: 64px 64px 0 0; box-shadow: 0 0 0 3000px #0f1011; }

      #send span { position: absolute; }

    <script>
      ;(function () {

        // captions: short groups, words arrive blurred then sharp; current word bold white, past words thin grey
        const caps = document.getElementById('caps')

        WORDS.forEach((w, k) => { if (!w) return; cur.push(k); const len = cur.reduce((n, j) => n + WORDS[j].length + 1, 0); if (/[.,:;?!…]$/.test(w) || cur.length >= 4 || len > 19) { G.push(cur); cur = [] } })
        if (cur.length) G.push(cur)
        G.forEach((g, gi) => {
          const box = document.createElement('div'); box.className = 'grp'; caps.appendChild(box)
          const t0 = T[g[0]] - 0.04, t1 = gi < G.length - 1 ? T[G[gi + 1][0]] - 0.04 : END
          tl.set(box, { visibility: 'visible' }, t0); tl.set(box, { visibility: 'hidden' }, t1)
          g.forEach((k, j) => {
            const el = document.createElement('span'); el.className = 'w'; el.innerHTML = WORDS[k] + '<span class="bx"></span>'; box.appendChild(el)
            const on = Math.max(t0, T[k] - 0.03), next = j < g.length - 1 ? T[g[j + 1]] - 0.03 : t1
            tl.fromTo(el, { opacity: 0, filter: 'blur(14px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.17, ease: 'power2.out', immediateRender: false }, on)

        tl.set('#pp2', { attr: { class: 'pp on' } }, T[__PICK_K__])
        tl.fromTo('#pp2 em', { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.25, ease: 'back.out(2)', immediateRender: false }, T[__PICK_K__])
        tl.fromTo('#tap', { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.25, immediateRender: false }, T[__TAP_K__])
