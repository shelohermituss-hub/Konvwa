      const C = { cyan: 0x3fd6f0, white: 0xf4fbfd, steel: 0x7a8590, red: 0xf0785a, water: 0x2a9ad8 }

        const counter = (id, t0, t1) => { tl.set(id, { visibility: 'visible' }, t0); tl.fromTo(id, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, t0); tl.to(id, { opacity: 0, duration: 0.25 }, t1 - 0.25); tl.set(id, { visibility: 'hidden' }, t1) }
        counter('#c-t', T[2] - 0.05, T[8] + 0.6)
        counter('#c-ar', T[51] - 0.05, T[59])
        counter('#c-dp', T[151] - 0.05, T[173])
        const o1 = { v: 0 }; tl.fromTo(o1, { v: 0 }, { v: 300, duration: T[161] + 0.3 - T[151], ease: 'power1.inOut', immediateRender: false, onUpdate: () => { document.getElementById('c-dp-n').textContent = Math.round(o1.v) + ' m'; document.getElementById('c-dp-p').textContent = 'PRESSION : ' + Math.round(1 + o1.v / 10) + ' BAR' } }, T[151])
        counter('#c-kg', T[173] + 0.1, T[187])
        // captions: groups of words, the key words in cyan
        const caps = document.getElementById('caps')
        const G = []; let cur = []
        WORDS.forEach((w, k) => { if (!w) return; cur.push(k); const len = cur.reduce((n, j) => n + WORDS[j].length + 1, 0); if (/[.,:;?!…]$/.test(w) || cur.length >= 5 || len > 24) { G.push(cur); cur = [] } })
        if (cur.length) G.push(cur)
        G.forEach((g, gi) => {
          const box = document.createElement('div'); box.className = 'grp'; caps.appendChild(box)
          box.innerHTML = g.map((k) => (KEYW.has(k) ? `<span class="k">${WORDS[k]}</span>` : WORDS[k])).join(' ')
          const t0 = T[g[0]] - 0.05, t1 = gi < G.length - 1 ? T[G[gi + 1][0]] - 0.05 : END
          tl.set(box, { visibility: 'visible' }, t0); tl.set(box, { visibility: 'hidden' }, t1)
          tl.fromTo(box, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.16, ease: 'power2.out', immediateRender: false }, t0)
        })
        window.__timelines = window.__timelines || {}
        window.__timelines['main'] = tl
      })()
    </script>
  </body>
