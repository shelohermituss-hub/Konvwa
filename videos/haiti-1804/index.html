      de tailles et de graisses mêlées ; objets en noir et blanc posés avec une ombre douce (portraits tramés, cartes, anneau qui

    <script>
      ;(function () {
        const tl = gsap.timeline({ paused: true })
        const $ = (id) => document.getElementById(id)
        const el = (tag, cls, txt, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; if (parent) parent.appendChild(e); return e }
        const blur = (n) => 'blur(' + n + 'px)'
        const END = 43

        // ---------- the voice: start of each spoken word (transcription of assets/vo/vo.wav before the ×1.06 speed-up) ----------
        const RAW = [0, 0.4, 0.48, 0.96, 1.36, 1.6, 2.12, 2.27, 2.49, 3, 3.12, 3.77, 4.03, 5.04, 5.2, 6.36, 7.55, 7.75, 7.91, 8.47, 8.57, 9.07, 9.38, 9.54, 10.79, 10.84, 11.72, 11.76, 12.26, 12.95, 12.99, 13.74, 14.3, 15.1, 15.79, 16.28, 16.36, 16.46, 16.81, 16.94, 17.18, 18.18, 18.33, 19.36, 19.94, 20.49, 20.59, 21.06, 21.56, 21.91, 22.35, 22.47, 23.08, 23.62, 23.83, 24.48, 24.99, 26.16, 26.52, 27.01, 27.4, 27.55, 28.12, 28.59, 29.58, 29.67, 30.39, 30.89, 31.55, 31.81, 32.56, 32.7, 33.06, 33.57, 34.59, 35.06, 35.45, 36.59, 36.97, 37.34, 37.8, 38.31, 38.41, 38.56, 39.56, 40, 40.78, 40.91, 41.63, 41.83, 42.14, 42.46, 42.72, 42.97, 43.09]
        const T = RAW.map((t) => Math.round((0.2 + t / 1.06) * 100) / 100)
        const WORDS = ['Haïti', 'a', 'vaincu', "l'une", 'des', 'armées', 'les', 'plus', 'puissantes', 'du', 'monde.', 'Voici', 'comment.', 'En', '1791,', 'Saint-Domingue', 'est', 'la', 'colonie', 'la', 'plus', 'riche', 'de', 'France.', 'Cette', 'année-là,', 'des', 'milliers', "d'esclaves", 'se', 'soulèvent.', 'Toussaint', 'Louverture,', 'ancien', 'esclave,', 'prend', 'la', 'tête', 'de', 'la', 'révolution.', 'En', '1802,', 'Napoléon', 'envoie', 'une', 'immense', 'armée', 'pour', 'reprendre', 'la', 'colonie.', 'Toussaint', 'est', 'capturé.', 'Mais', 'Dessalines', 'continue', 'le', 'combat.', 'Le', '18', 'novembre', '1803,', 'à', 'Vertières,', "l'armée", 'française', 'est', 'battue.', 'Le', '1er', 'janvier', '1804,', 'Haïti', 'devient', 'indépendante,', 'la', 'première', 'république', 'noire', 'libre', 'du', 'monde.', 'Écrivez', '« 1804 »', 'en', 'commentaire', 'et', 'suivez', 'KONVWA', '', 'pour', 'la', 'suite.']

        // ---------- blocks of stacked lines: [first word, last word, style, bullet?] per line; y = top of the block ----------
        const BLOCKS = [
          { y: 300, lines: [[0, 0, 'b'], [1, 4, 's'], [5, 7, 'm'], [8, 8, 'bi'], [9, 10, 's']] },
          { y: 860, lines: [[11, 12, 'm']] },
          { y: 300, lines: [[13, 13, 's'], [14, 14, 'b'], [15, 15, 'mi'], [16, 18, 's'], [19, 21, 'm'], [22, 23, 's']], until: 24 },
          { y: 320, lines: [[24, 25, 's'], [26, 27, 'm'], [28, 28, 'bi'], [29, 30, 'm']] },
          { y: 1060, lines: [[31, 32, 'm'], [33, 34, 's', '✦'], [35, 37, 's', '✦'], [38, 40, 's', '✦']], left: true },
          { y: 1060, lines: [[41, 42, 'm'], [43, 43, 'bi'], [44, 47, 's'], [48, 51, 's']] },
          { y: 1060, lines: [[52, 54, 's', '✕'], [55, 56, 'mi'], [57, 59, 'm']] },
          { y: 1150, lines: [[60, 63, 'm'], [64, 65, 'mi'], [66, 69, 's']] },
          { y: 230, lines: [[70, 72, 's'], [73, 73, 'x']], until: 84 },
          { y: 1170, lines: [[74, 76, 'm'], [77, 78, 's'], [79, 81, 'mi'], [82, 83, 's']] },
          { y: 520, lines: [[84, 84, 'm'], [85, 85, 'cta'], [86, 87, 's']] },
          { y: 470, lines: [[88, 89, 's'], [90, 90, 'b'], [92, 94, 's']] },
        ]
        const blocksBox = $('blocks')
        BLOCKS.forEach((B, bi) => {
          const first = B.lines[0][0]
          const lastWord = B.lines[B.lines.length - 1][1]
          const start = Math.max(0, T[first] - 0.06)
          const next = BLOCKS[bi + 1]
          const end = B.until != null ? T[B.until] - 0.08 : next ? T[next.lines[0][0]] - 0.08 : END
          const box = el('div', 'block', null, blocksBox)
          box.style.top = B.y + 'px'
          if (B.left) box.style.alignItems = 'flex-start'
          gsap.set(box, { autoAlpha: 0 })
          tl.set(box, { autoAlpha: 1 }, start)
          B.lines.forEach(([a, b, st, bullet]) => {
            const line = el('div', 'line ' + st + (bullet ? ' bullet' : ''), null, box)
            if (bullet) {
              const ic = el('i', '', bullet, line)
              tl.fromTo(ic, { opacity: 0, scale: 0.4, rotation: -40 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.3, ease: 'back.out(2)' }, T[a] - 0.04)
            }
            for (let k = a; k <= b; k++) {
              if (!WORDS[k]) continue
              const w = el('span', 'w', WORDS[k], line)
              // each word lands blurred and pale, then settles in ink (reference K)
              tl.fromTo(w, { opacity: 0, color: '#B9B9B9', y: 10, filter: blur(8) }, { opacity: 1, y: 0, filter: blur(0), duration: 0.22, ease: 'power2.out' }, T[k])
              tl.to(w, { color: '#1A1A1A', duration: 0.35, ease: 'power1.out' }, T[k] + 0.12)
            }
          })
          if (end < END) tl.to(box, { autoAlpha: 0, filter: blur(10), y: -16, duration: 0.18, ease: 'power2.in' }, end - 0.18)
        })

        // ---------- full-frame blur between parts (the reference never cuts) ----------
        const morph = (at) => {
          tl.to('#world', { filter: blur(28), duration: 0.22, ease: 'power2.in' }, at - 0.22)
          tl.to('#veil', { opacity: 0.55, duration: 0.22, ease: 'power2.in' }, at - 0.22)
          tl.to('#world', { filter: blur(0), duration: 0.32, ease: 'power2.out' }, at + 0.02)
          tl.to('#veil', { opacity: 0, duration: 0.32, ease: 'power2.out' }, at + 0.02)
        }
        const MORPHS = [T[13] - 0.15, T[31] - 0.12, T[60] - 0.12, T[70] - 0.12, T[84] - 0.1]
        MORPHS.forEach(morph)

        const pop = (sel, at, o) => tl.fromTo(sel, Object.assign({ autoAlpha: 0, scale: 0.86, y: 60, filter: blur(14) }, o), { autoAlpha: 1, scale: 1, y: 0, x: 0, filter: blur(0), duration: 0.55, ease: 'expo.out' }, at)
        const hide = (sel, at) => tl.set(sel, { autoAlpha: 0 }, at)
        gsap.set(['#o-dess', '#o-napo', '#o-tile', '#o-ring', '#o-bar', '#c-tous', '#c-napo', '#c-dess', '#o-paint', '#o-flag', '#o-logo'], { autoAlpha: 0 })

        // hook: the two portraits slide in from the edges toward the flag tile
        tl.fromTo('#o-dess', { autoAlpha: 0, x: -300 }, { autoAlpha: 1, x: 0, duration: 0.8, ease: 'expo.out' }, 0)
        tl.fromTo('#o-napo', { autoAlpha: 0, x: 300 }, { autoAlpha: 1, x: 0, duration: 0.8, ease: 'expo.out' }, 0)
        tl.to('#o-dess', { x: 26, duration: 3, ease: 'none' }, 0.8)
        tl.to('#o-napo', { x: -26, duration: 3, ease: 'none' }, 0.8)
        pop('#o-tile', 0.12, { scale: 0.5 })
        tl.to('#grid', { opacity: 1, duration: 0.6 }, 0.1)
        hide(['#o-dess', '#o-napo', '#o-tile'], MORPHS[0])

        // 1791: the ring of riches turns slowly around the year
        const goods = ['Sucre', 'Café', 'Indigo', 'Coton', 'Sucre', 'Café']
        const orbit = $('orbit')
        goods.forEach((g, i) => {
          const a = (i / goods.length) * Math.PI * 2
          const c = el('div', 'chip', g, orbit)
          c.style.left = Math.round(320 + Math.cos(a) * 290 - 60) + 'px'
          c.style.top = Math.round(320 + Math.sin(a) * 290 - 28) + 'px'
          tl.fromTo(c, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, T[18] + i * 0.12)
          tl.to(c, { rotation: -40, duration: T[24] - T[18], ease: 'none' }, T[18])
        })
        pop('#o-ring', MORPHS[0] + 0.05)
        tl.fromTo('#orbit', { rotation: 0 }, { rotation: 40, duration: T[24] - T[13], ease: 'none' }, T[13])
        hide('#o-ring', T[24] - 0.08)

        // the uprising: a progress bar 1791 → 1804 starts to fill
        pop('#o-bar', T[24])
        tl.to('#fill', { width: '14%', duration: T[30] - T[24] + 0.4, ease: 'power2.out' }, T[26])
        hide('#o-bar', MORPHS[1])

        // the leaders: cards slide like a carousel, joined by a line
        pop('#c-tous', MORPHS[1] + 0.04)
        tl.to('#c-tous', { x: -560, duration: 0.6, ease: 'expo.inOut' }, T[41] - 0.1)
        pop('#c-napo', T[42], { x: 560, scale: 1, y: 0 })
        tl.fromTo('#link1', { width: 0 }, { width: 330, duration: 0.5, ease: 'power2.out', immediateRender: false }, T[42] + 0.2)
        tl.to('#c-tous', { filter: 'grayscale(1) blur(6px)', opacity: 0.45, duration: 0.4 }, T[54])
        tl.to('#c-napo', { x: 560, duration: 0.6, ease: 'expo.inOut' }, T[55] - 0.1)
        tl.to('#link1', { width: 0, duration: 0.3 }, T[55] - 0.1)
        tl.to('#c-tous', { x: -1100, duration: 0.6, ease: 'expo.inOut' }, T[55] - 0.1)
        pop('#c-dess', T[56] - 0.1, { x: -560, scale: 1, y: 0 })
        hide(['#c-tous', '#c-napo', '#c-dess', '#link1'], MORPHS[2])

        // Vertières: the battle, in black and white
        pop('#o-paint', MORPHS[2] + 0.04)
        tl.to('#o-paint', { scale: 1.04, duration: T[70] - T[60], ease: 'none' }, MORPHS[2] + 0.6)
        hide('#o-paint', MORPHS[3])

        // 1804: the only colour of the film
        pop('#o-flag', T[73] + 0.1, { scale: 0.5, rotation: -6 })
        tl.to('#o-flag', { scale: 1.06, duration: T[84] - T[73], ease: 'none' }, T[73] + 0.7)
        hide('#o-flag', MORPHS[4])

        // call to action, then the brand
        pop('#o-logo', T[88], { scale: 0.4, rotation: -10 })
        tl.to('#o-logo', { y: -20, duration: END - T[88] - 0.6, ease: 'sine.inOut' }, T[88] + 0.6)

        // slow camera push over the whole film
        tl.fromTo('#world', { scale: 1 }, { scale: 1.035, duration: END, ease: 'none', immediateRender: false }, 0)

        window.__timelines = window.__timelines || {}
        window.__timelines['main'] = tl
      })()
