      (descente du ciel d'orage vers le navire, poussées lentes, révélation par un cercle, flash blanc), alternées avec des plans
      « collage sur table » (papier quadrillé, porte-documents, tableau noir à la craie) ; texte en capitales épaisses avec relief,
      étiquettes en papier déchiré, texte machine à écrire, mots isolés en italique serif ; grain de film et vignette partout.
