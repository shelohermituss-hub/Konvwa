<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s6-recois-template">
      <style>
        @font-face {
          font-family: "Caveat";
          src: url("assets/fonts/caveat-600.woff2") format("woff2");
          font-weight: 600;
        }
        #s6-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: radial-gradient(ellipse 80% 60% at 50% 50%, #f8efe5 0%, #f1e6d9 60%, #e7d8c6 100%);
          color: #0a1628;
          font-family: "Poppins", sans-serif;
        }
        #s6-ghost {
          position: absolute;
          left: 0;
          top: 880px;
          font-size: 330px;
          font-weight: 900;
          line-height: 1;
          letter-spacing: -0.05em;
          color: transparent;
          -webkit-text-stroke: 3px rgba(10, 22, 40, 0.3);
          white-space: nowrap;
        }
        #s6-ring {
          position: absolute;
          left: 170px;
          top: 700px;
          width: 740px;
          height: 740px;
          border-radius: 50%;
          border: 2px dashed rgba(10, 22, 40, 0.35);
        }
        #s6-disc {
          position: absolute;
          left: 210px;
          top: 740px;
          width: 660px;
          height: 660px;
          border-radius: 50%;
          background: radial-gradient(circle at 38% 32%, #ff7a48 0%, #f05a28 55%, #d9461a 100%);
        }
        #s6-shadow {
          position: absolute;
          left: 300px;
          top: 1352px;
          width: 480px;
          height: 50px;
          border-radius: 50%;
          background: radial-gradient(ellipse at center, rgba(10, 22, 40, 0.4) 0%, rgba(10, 22, 40, 0) 70%);
        }
        #s6-box {
          position: absolute;
          left: 300px;
          top: 760px;
          width: 480px;
          height: 600px;
          transform-origin: 50% 100%;
        }
        #s6-box img {
          position: absolute;
          left: 0;
          bottom: 0;
          width: 480px;
        }
        #s6-puffs {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1920px;
        }
        #s6-step {
          position: absolute;
          left: 84px;
          top: 236px;
          font-family: "JetBrains Mono", monospace;
          font-size: 26px;
          letter-spacing: 0.14em;
          color: #5c5248;
        }
        #s6-title {
          position: absolute;
          left: 70px;
          top: 270px;
          font-size: 190px;
          font-weight: 900;
          line-height: 1;
          letter-spacing: -0.05em;
          color: #dd4f1c;
          white-space: nowrap;
        }
        #s6-sub {
          position: absolute;
          left: 84px;
          top: 470px;
          display: flex;
          align-items: center;
          gap: 44px;
        }
        #s6-sub-word {
          padding: 0 28px 12px 6px;
          margin: 0 -28px -12px -6px;
          font-family: "Caveat", cursive;
          font-weight: 600;
          font-size: 112px;
          line-height: 1;
          color: #0a1628;
          white-space: nowrap;
        }
        #s6-flag {
          width: 96px;
          height: 96px;
          border-radius: 18px;
          box-shadow: 0 10px 22px rgba(10, 22, 40, 0.25);
        }
        #s6-status {
          position: absolute;
          left: 84px;
          top: 1500px;
          display: flex;
          align-items: center;
          gap: 18px;
          padding: 14px 28px;
          border-radius: 999px;
          background: #0a1628;
          color: #f1e6d9;
          font-family: "JetBrains Mono", monospace;
          font-size: 28px;
          letter-spacing: 0.06em;
          white-space: nowrap;
        }
        #s6-status i {
          display: block;
          width: 18px;
          height: 18px;
          border-radius: 50%;
          background: #f05a28;
        }
      </style>

      <div id="s6-root" data-composition-id="s6-recois" data-width="1080" data-height="1920">
        <div id="s6-ghost" data-layout-ignore aria-hidden="true">HAÏTI · HAÏTI · HAÏTI</div>
        <div id="s6-ring"></div>
        <div id="s6-disc"></div>
        <div id="s6-shadow"></div>
        <svg id="s6-puffs" viewBox="0 0 1080 1920"></svg>
        <div id="s6-box"><img src="assets/img/box.png" alt="Colis" /></div>

        <div id="s6-step">ÉTAPE 04 / 04</div>
        <div id="s6-title">reçois</div>
        <div id="s6-sub">
          <span id="s6-sub-word">chez toi, en Haïti</span>
          <img id="s6-flag" src="assets/img/ht.svg" alt="" />
        </div>
        <div id="s6-status"><i></i>STATUT : ARRIVÉ EN HAÏTI ✓</div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const BEAT = 0.6;
          const D = 3.6;
          const LAND = 1.25;

          tl.fromTo("#s6-ghost", { x: 0 }, { x: -700, duration: D, ease: "none" }, 0);
          tl.fromTo("#s6-disc", { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 0);
          tl.fromTo("#s6-ring", { scale: 0.7, opacity: 0, rotation: 0 }, { scale: 1, opacity: 1, rotation: 40, duration: D, ease: "power2.out" }, 0.05);

          // le colis tombe, s'écrase et rebondit
          tl.fromTo("#s6-box", { y: -1300, rotation: -12 }, { y: 0, rotation: 0, duration: 0.55, ease: "power3.in" }, LAND - 0.55);
          tl.fromTo("#s6-box", { scaleY: 1, scaleX: 1 }, { scaleY: 0.86, scaleX: 1.08, duration: 0.08, ease: "power2.out", immediateRender: false }, LAND);
          tl.fromTo("#s6-box", { scaleY: 0.86, scaleX: 1.08 }, { scaleY: 1, scaleX: 1, duration: 0.5, ease: "elastic.out(1, 0.4)", immediateRender: false }, LAND + 0.08);
          tl.fromTo("#s6-shadow", { opacity: 0, scaleX: 0.2 }, { opacity: 1, scaleX: 1, duration: 0.55, ease: "power3.in" }, LAND - 0.55);

          // petits nuages de poussière à l'impact (particules déterministes)
          const svg = document.getElementById("s6-puffs");
          const N = 14;
          let html = "";
          const P = [];
          for (let k = 0; k < N; k++) {
            const side = k % 2 ? 1 : -1;
            const a = (k / N) * Math.PI;
            const vx = side * (160 + ((k * 37) % 90));
            const vy = -(40 + ((k * 53) % 120));
            const r = 18 + ((k * 29) % 22);
            html += `<circle id="s6-pf${k}" cx="540" cy="1360" r="${r}" fill="#FFFFFF" opacity="0"/>`;
            P.push({ vx, vy, r, a });
          }
          svg.innerHTML = html;
          const clk = { t: 0 };
          tl.fromTo(
            clk,
            { t: 0 },
            {
              t: 1,
              duration: 0.9,
              ease: "none",
              onUpdate: () => {
                const t = clk.t;
                P.forEach((p, k) => {
                  const el = document.getElementById("s6-pf" + k);
                  el.setAttribute("cx", (540 + p.vx * t * 1.4).toFixed(1));
                  el.setAttribute("cy", (1360 + p.vy * t + 60 * t * t).toFixed(1));
                  el.setAttribute("r", (p.r * (1 + t * 1.2)).toFixed(1));
                  el.setAttribute("opacity", (0.85 * (1 - t)).toFixed(2));
                });
              },
            },
            LAND,
          );

          tl.fromTo("#s6-step", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, 0.05);
          tl.fromTo("#s6-title", { opacity: 0, scale: 1.5, filter: "blur(14px)", transformOrigin: "0% 60%" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" }, 1.12);
          tl.fromTo("#s6-sub-word", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 1.0, ease: "power1.inOut" }, 1.6);
          tl.fromTo("#s6-flag", { scale: 0, rotation: -40 }, { scale: 1, rotation: 6, duration: 0.4, ease: "back.out(2.4)" }, 2.6);
          tl.fromTo("#s6-status", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 2.9);
          tl.fromTo("#s6-box", { y: 0 }, { y: -10, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 2.1);

          window.__timelines["s6-recois"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
