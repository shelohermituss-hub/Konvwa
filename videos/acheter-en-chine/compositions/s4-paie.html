<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s4-paie-template">
      <style>
        @font-face {
          font-family: "Caveat";
          src: url("assets/fonts/caveat-600.woff2") format("woff2");
          font-weight: 600;
        }
        @font-face {
          font-family: "Poppins Light";
          src: url("assets/fonts/poppins-300.woff2") format("woff2");
          font-weight: 300;
        }
        /* plan gris éditorial (réf. B) */
        #s4-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: radial-gradient(ellipse 70% 55% at 50% 42%, #f4f1ee 0%, #e4dfda 60%, #cfc8c1 100%);
          color: #0a1628;
          font-family: "Poppins", sans-serif;
        }
        #s4-lines {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
        }
        #s4-step {
          position: absolute;
          left: 84px;
          top: 236px;
          font-family: "JetBrains Mono", monospace;
          font-size: 26px;
          letter-spacing: 0.14em;
          color: #5c5248;
        }
        #s4-a {
          position: absolute;
          left: 84px;
          top: 290px;
          font-family: "Poppins Light", "Poppins", sans-serif;
          font-weight: 300;
          font-size: 86px;
          line-height: 1;
          color: #0a1628;
        }
        #s4-b {
          position: absolute;
          left: 66px;
          top: 386px;
          font-size: 168px;
          font-weight: 900;
          line-height: 1;
          letter-spacing: -0.05em;
          color: #0a1628;
          white-space: nowrap;
        }
        #s4-sq-line {
          position: absolute;
          left: 250px;
          top: 680px;
          width: 580px;
          height: 580px;
          border: 3px solid #f05a28;
        }
        #s4-sq {
          position: absolute;
          left: 280px;
          top: 710px;
          width: 520px;
          height: 520px;
          background: #f05a28;
        }
        .s4-card {
          position: absolute;
          width: 560px;
          height: 200px;
          border-radius: 26px;
          background: #ffffff;
          box-shadow: 0 30px 50px rgba(10, 22, 40, 0.28);
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .s4-card img {
          max-width: 440px;
          max-height: 140px;
        }
        #s4-c0 {
          left: 140px;
          top: 760px;
        }
        #s4-c1 {
          left: 380px;
          top: 1010px;
        }
        #s4-chip {
          position: absolute;
          left: 300px;
          top: 1268px;
          padding: 12px 28px;
          border-radius: 999px;
          background: #0a1628;
          color: #f1e6d9;
          font-size: 34px;
          font-weight: 700;
          white-space: nowrap;
        }
        #s4-visa {
          padding: 0 28px 12px 6px;
          margin: 0 -28px -12px -6px;
          position: absolute;
          left: 96px;
          top: 1366px;
          font-family: "Caveat", cursive;
          font-weight: 600;
          font-size: 90px;
          line-height: 1;
          color: #c2410c;
          white-space: nowrap;
        }
        #s4-giant {
          position: absolute;
          left: 40px;
          top: 1470px;
          font-size: 400px;
          font-weight: 900;
          line-height: 1;
          letter-spacing: -0.06em;
          color: #0a1628;
          white-space: nowrap;
        }
        #s4-meta {
          position: absolute;
          right: 84px;
          top: 236px;
          font-family: "JetBrains Mono", monospace;
          font-size: 26px;
          letter-spacing: 0.1em;
          color: #5c5248;
          text-align: right;
        }
      </style>

      <div id="s4-root" data-composition-id="s4-paie" data-width="1080" data-height="1920">
        <svg id="s4-lines" viewBox="0 0 1080 1920">
          <path id="s4-l1" d="M150 1880 L150 760 A390 390 0 0 1 930 760 L930 1880" fill="none" stroke="rgba(10,22,40,0.2)" stroke-width="2" />
          <path id="s4-l2" d="M90 1880 L90 720 A450 450 0 0 1 990 720 L990 1880" fill="none" stroke="rgba(10,22,40,0.12)" stroke-width="2" />
          <line id="s4-l3" x1="84" y1="660" x2="996" y2="660" stroke="rgba(10,22,40,0.3)" stroke-width="2" />
        </svg>

        <div id="s4-step">ÉTAPE 02 / 04</div>
        <div id="s4-meta">HTG · MOBILE MONEY</div>
        <div id="s4-a">paie en</div>
        <div id="s4-b">GOURDES</div>

        <div id="s4-sq-line"></div>
        <div id="s4-sq"></div>
        <div class="s4-card" id="s4-c0"><img src="assets/img/moncash.png" alt="MonCash" /></div>
        <div class="s4-card" id="s4-c1"><img src="assets/img/natcash.png" alt="NatCash" /></div>
        <div id="s4-chip">+ portefeuille KONVWA</div>

        <div id="s4-visa">pas besoin de carte Visa</div>
        <div id="s4-giant">HTG</div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const BEAT = 0.6;
          const D = 3.6;

          tl.fromTo(["#s4-l1", "#s4-l2"], { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.06 }, 0);
          tl.fromTo("#s4-l3", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 0.1);
          tl.fromTo(["#s4-step", "#s4-meta"], { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, 0.05);
          tl.fromTo("#s4-a", { opacity: 0, x: -160 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 0.04);
          tl.fromTo("#s4-b", { opacity: 0, scale: 1.45, filter: "blur(14px)", transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" }, 0.22);

          // carré orange + filet décalé
          tl.fromTo("#s4-sq", { scale: 0, rotation: 45 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(1.5)" }, 0.1);
          tl.fromTo("#s4-sq-line", { scale: 0.7, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.6, ease: "power3.out" }, 0.25);
          tl.fromTo("#s4-sq-line", { rotation: 0 }, { rotation: 4, duration: D - 0.9, ease: "none", immediateRender: false }, 0.85);

          // cartes de paiement qui claquent sur le temps
          tl.fromTo("#s4-c0", { opacity: 0, x: -700, rotation: -30 }, { opacity: 1, x: 0, rotation: -6, duration: 0.42, ease: "expo.out" }, 1.68);
          tl.fromTo("#s4-c1", { opacity: 0, x: 700, rotation: 30 }, { opacity: 1, x: 0, rotation: 5, duration: 0.42, ease: "expo.out" }, 2.48);
          tl.fromTo("#s4-chip", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.4)" }, 3.0);
          tl.fromTo(["#s4-c0", "#s4-c1"], { y: 0 }, { y: -10, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 2.95);

          tl.fromTo("#s4-visa", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.45, ease: "power2.out" }, 3.1);

          // mot géant flou qui se met au point
          tl.fromTo("#s4-giant", { x: 260, filter: "blur(22px)", opacity: 0.35 }, { x: 0, filter: "blur(0px)", opacity: 1, duration: 1.3, ease: "power3.out" }, 0.1);
          tl.fromTo("#s4-giant", { x: 0 }, { x: -60, duration: D - 1.4, ease: "none", immediateRender: false }, 1.4);

          window.__timelines["s4-paie"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
