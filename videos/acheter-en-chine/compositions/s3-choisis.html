<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s3-choisis-template">
      <style>
        @font-face {
          font-family: "Caveat";
          src: url("assets/fonts/caveat-600.woff2") format("woff2");
          font-weight: 600;
        }
        #s3-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: radial-gradient(ellipse 80% 60% at 50% 50%, #f8efe5 0%, #f1e6d9 60%, #e7d8c6 100%);
          color: #0a1628;
          font-family: "Poppins", sans-serif;
        }
        /* bande de papier déchiré (réf. A) */
        #s3-paper {
          position: absolute;
          left: -60px;
          top: 860px;
          width: 1200px;
          height: 420px;
        }
        #s3-num {
          position: absolute;
          left: 60px;
          top: 196px;
          font-size: 250px;
          font-weight: 900;
          line-height: 1;
          letter-spacing: -0.05em;
          color: transparent;
          -webkit-text-stroke: 4px #f05a28;
        }
        #s3-step {
          position: absolute;
          left: 384px;
          top: 236px;
          font-family: "JetBrains Mono", monospace;
          font-size: 26px;
          letter-spacing: 0.14em;
          color: #5c5248;
        }
        #s3-title {
          position: absolute;
          left: 384px;
          top: 270px;
          font-size: 150px;
          font-weight: 900;
          line-height: 1;
          letter-spacing: -0.045em;
          color: #0a1628;
        }
        #s3-sub {
          padding: 0 28px 12px 6px;
          margin: 0 -28px -12px -6px;
          position: absolute;
          left: 470px;
          top: 432px;
          font-family: "Caveat", cursive;
          font-weight: 600;
          font-size: 112px;
          line-height: 1;
          color: #f05a28;
          white-space: nowrap;
        }
        /* cadre doré */
        #s3-frame-wrap {
          position: absolute;
          left: 200px;
          top: 640px;
          width: 680px;
          height: 800px;
        }
        #s3-frame {
          position: absolute;
          inset: 0;
          padding: 30px;
          border-radius: 8px;
          background: linear-gradient(135deg, #7a4a14 0%, #e8c46a 18%, #9c6b22 34%, #f6dc93 52%, #8a5a1c 70%, #e2bb5e 86%, #6e4210 100%);
          box-shadow: 0 40px 60px rgba(60, 38, 14, 0.35), inset 0 0 0 3px rgba(255, 240, 200, 0.5);
        }
        #s3-frame-in {
          position: absolute;
          inset: 30px;
          padding: 14px;
          background: linear-gradient(135deg, #5a3510, #b58a3a 50%, #5a3510);
        }
        #s3-mat {
          position: absolute;
          inset: 14px;
          background: radial-gradient(ellipse at 50% 40%, #fffaf3 0%, #f3e8da 100%);
          box-shadow: inset 0 8px 24px rgba(60, 38, 14, 0.25);
          overflow: hidden;
        }
        .s3-prod {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 470px;
          height: 560px;
          margin-left: -235px;
          margin-top: -300px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .s3-prod img {
          max-width: 440px;
          max-height: 540px;
          filter: drop-shadow(0 18px 18px rgba(10, 22, 40, 0.28));
        }
        /* étiquettes */
        .s3-name {
          position: absolute;
          left: 150px;
          top: 1376px;
          padding: 12px 26px;
          border-radius: 6px;
          background: #0a1628;
          color: #f1e6d9;
          font-size: 36px;
          font-weight: 700;
          letter-spacing: 0.01em;
          white-space: nowrap;
        }
        .s3-price {
          position: absolute;
          right: 96px;
          top: 1252px;
          padding: 6px 26px 10px;
          border-radius: 10px;
          background: #f05a28;
          color: #0a1628;
          font-family: "Caveat", cursive;
          font-weight: 600;
          font-size: 74px;
          line-height: 1;
          white-space: nowrap;
          box-shadow: 0 14px 26px rgba(240, 90, 40, 0.35);
        }
        .s3-moq {
          position: absolute;
          left: 152px;
          top: 1452px;
          font-family: "JetBrains Mono", monospace;
          font-size: 26px;
          letter-spacing: 0.08em;
          color: #4f463d;
          white-space: nowrap;
        }
        #s3-caption {
          position: absolute;
          left: 84px;
          top: 1540px;
          display: flex;
          gap: 20px;
          align-items: center;
          font-size: 32px;
          color: #4f463d;
        }
        #s3-caption i {
          display: block;
          width: 42px;
          height: 42px;
          border-radius: 50%;
          background: #0a1628;
          color: #f1e6d9;
          font-style: normal;
          font-size: 26px;
          line-height: 42px;
          text-align: center;
        }
      </style>

      <div id="s3-root" data-composition-id="s3-choisis" data-width="1080" data-height="1920">
        <svg id="s3-paper" viewBox="0 0 1200 420" preserveAspectRatio="none">
          <path
            d="M0 120 L60 96 L118 132 L170 88 L240 118 L300 80 L372 112 L430 70 L500 104 L560 64 L640 98 L700 58 L776 92 L840 52 L910 86 L980 48 L1050 82 L1120 44 L1200 70 L1200 300 L1140 330 L1076 296 L1010 336 L940 304 L870 344 L800 310 L730 352 L660 318 L590 358 L520 322 L450 362 L380 326 L310 366 L240 330 L170 372 L100 336 L40 374 L0 350 Z"
            fill="#C9A47C"
          />
          <path d="M0 150 L1200 96" stroke="rgba(255,255,255,0.18)" stroke-width="10" />
        </svg>

        <div id="s3-num" data-layout-ignore aria-hidden="true">01</div>
        <div id="s3-step">ÉTAPE 01 / 04</div>
        <div id="s3-title">choisis</div>
        <div id="s3-sub">ton produit</div>

        <div id="s3-frame-wrap">
          <div id="s3-frame">
            <div id="s3-frame-in">
              <div id="s3-mat">
                <div class="s3-prod" id="s3-p0"><img src="assets/img/r36s.png" alt="Console R36s Pro" /></div>
                <div class="s3-prod" id="s3-p1"><img src="assets/img/brosse.png" alt="Brosse à dents électrique" /></div>
                <div class="s3-prod" id="s3-p2"><img src="assets/img/compteur.png" alt="Compteur de billets ST-900" /></div>
              </div>
            </div>
          </div>
        </div>

        <div class="s3-name" id="s3-n0">Console R36s Pro</div>
        <div class="s3-name" id="s3-n1">Brosse à dents Smart Sonic</div>
        <div class="s3-name" id="s3-n2">Compteur de billets ST-900</div>
        <div class="s3-price" id="s3-r0">2 705 HTG</div>
        <div class="s3-price" id="s3-r1">3 535 HTG</div>
        <div class="s3-price" id="s3-r2">10 465 HTG</div>
        <div class="s3-moq" id="s3-m0">ALIBABA · CHINE · MOQ 25</div>
        <div class="s3-moq" id="s3-m1">ALIBABA · CHINE · MOQ 24</div>
        <div class="s3-moq" id="s3-m2">ALIBABA · CHINE · MOQ 15</div>

        <div id="s3-caption"><i>✓</i><span>Prix en gourdes · fournisseurs vérifiés</span></div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const BEAT = 0.6;
          const D = 3.6;

          tl.fromTo("#s3-paper", { scaleX: 0, transformOrigin: "0% 50%", rotation: -7 }, { scaleX: 1, rotation: -7, duration: 0.55, ease: "expo.out" }, 0);
          tl.fromTo("#s3-paper", { y: 0 }, { y: -18, duration: D - 0.6, ease: "none", immediateRender: false }, 0.6);
          tl.fromTo("#s3-num", { opacity: 0, x: -120 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, 0.02);
          tl.fromTo("#s3-step", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, 0.15);
          tl.fromTo("#s3-title", { opacity: 0, y: 90, rotation: 4 }, { opacity: 1, y: 0, rotation: 0, duration: 0.5, ease: "circ.out" }, 0.08);
          tl.fromTo("#s3-sub", { clipPath: "inset(0 100% 0 0)", rotation: -4 }, { clipPath: "inset(0 0% 0 0)", rotation: -4, duration: 0.55, ease: "power2.out" }, BEAT);

          // cadre qui s'accroche de travers puis se pose
          tl.fromTo("#s3-frame-wrap", { y: -900, rotation: -14 }, { y: 0, rotation: 3, duration: 0.7, ease: "back.out(1.3)" }, 0.12);
          tl.fromTo("#s3-frame-wrap", { rotation: 3 }, { rotation: 1.5, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 0.9);

          // trois produits réels qui se remplacent au temps
          const swaps = [0.45, 0.45 + 2 * BEAT, 0.45 + 4 * BEAT];
          [0, 1, 2].forEach((k) => {
            const t0 = swaps[k];
            tl.set([`#s3-p${k}`, `#s3-n${k}`, `#s3-r${k}`, `#s3-m${k}`], { opacity: 0 }, 0);
            tl.fromTo(`#s3-p${k}`, { opacity: 0, scale: 0.4, rotation: k % 2 ? 12 : -12 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2)" }, t0);
            tl.fromTo(`#s3-n${k}`, { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, t0 + 0.08);
            tl.fromTo(`#s3-r${k}`, { opacity: 0, scale: 1.6, rotation: -14 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.4, ease: "back.out(2.2)" }, t0 + 0.18);
            tl.fromTo(`#s3-m${k}`, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, t0 + 0.22);
            if (k < 2) {
              const t1 = swaps[k + 1] - 0.12;
              tl.to(`#s3-p${k}`, { opacity: 0, scale: 0.6, duration: 0.16, ease: "power2.in" }, t1);
              tl.to([`#s3-n${k}`, `#s3-r${k}`, `#s3-m${k}`], { opacity: 0, duration: 0.12, ease: "none" }, t1);
            }
          });
          tl.fromTo("#s3-caption", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3 * BEAT);

          window.__timelines["s3-choisis"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
