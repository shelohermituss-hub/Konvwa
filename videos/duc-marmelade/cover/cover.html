<!doctype html>
<!-- Couverture TikTok créée à part (1080×1920) : figurine 3D studio générée (Magnific, magnific_fond.png) + titre-choc.
     Rendu : node render-cover.mjs → ../cover.png et ../cover-grille.png (recadrage 3:4 de la grille du profil). -->
<html lang="fr">
<meta charset="utf-8" />
<style>
  @font-face { font-family: Anton; src: url(anton.woff2); }
  @font-face { font-family: Mono; font-weight: 700; src: url(jetbrains-mono-700.woff2); }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #000 url(fond.jpg) center / cover; position: relative; font-family: Anton, sans-serif; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0.35) 30%, rgba(0, 0, 0, 0) 42%, rgba(0, 0, 0, 0) 80%, rgba(0, 0, 0, 0.5) 100%); }
  .kick { position: absolute; left: 0; right: 0; top: 262px; text-align: center; }
  .kick span { display: inline-block; font: 700 38px/1 Mono, monospace; letter-spacing: 0.14em; color: #0f1011; background: #ffd23f; padding: 14px 26px; border-radius: 999px; transform: rotate(-2deg); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); }
  h1 { position: absolute; left: 0; right: 0; top: 330px; text-align: center; color: #fff; text-transform: uppercase; line-height: 0.95; text-shadow: 0 8px 0 rgba(0, 0, 0, 0.45), 0 0 40px rgba(0, 0, 0, 0.5); }
  h1 .b { display: block; font-size: 104px; letter-spacing: 0.01em; }
  h1 .a { display: block; font-size: 166px; letter-spacing: 0.01em; color: #ff9a2a; }
  .tag { position: absolute; font: 700 34px/1 Mono, monospace; letter-spacing: 0.1em; color: #fff; background: #e5483a; padding: 12px 18px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); white-space: nowrap; }
  .label { position: absolute; left: 812px; top: 818px; transform: rotate(-6deg); font: 700 26px/1 Mono, monospace; letter-spacing: 0.12em; color: #5a2a10; background: #f6ecd4; padding: 8px 12px; border-radius: 6px; border: 3px solid #8a4a1a; }
  svg { position: absolute; inset: 0; }
</style>
<div class="shade"></div>
<svg width="1080" height="1920" viewBox="0 0 1080 1920">
  <circle cx="862" cy="840" r="150" fill="none" stroke="#ffd23f" stroke-width="8" />
  <path d="M 900 1000 Q 930 1120 880 1210" fill="none" stroke="#ffd23f" stroke-width="7" stroke-linecap="round" />
  <circle cx="590" cy="940" r="118" fill="none" stroke="#e5483a" stroke-width="8" stroke-dasharray="22 14" />
</svg>
<div class="label">GODZY</div>
<div class="tag" style="left: 760px; top: 1220px; background: #ffd23f; color: #0f1011">SON TITRE</div>
<div class="tag" style="left: 150px; top: 1080px">UN VRAI DUC</div>
<div class="kick"><span>HAÏTI · 1811</span></div>
<h1><span class="b">IL ÉTAIT DUC DE LA</span><span class="a">MARMELADE</span></h1>
</html>
