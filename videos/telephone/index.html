, 74.415, 74.634, 74.744, 74.854, 75.128, 75.238, 75.567, 76.06, 76.17, 76.758, 77.626, 77.676, 77.987, 78.139, 78.896, 79.048, 79.634, 79.764, 80.067, 80.218]

      const K = {"micro": 60, "codec": 99, "ant": 126, "relais": 154, "sim": 188, "reseau": 273, "huit": 78, "compresse": 92, "lumiere": 125, "normes": 251, "regarde": 266}  // index of key words in T

      // ---------- maths ----------
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
      const win = (t, a, b) => clamp((t - a) / (b - a))
      const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2)
      const eob = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2) }
      const popS = (t, t0, d = 0.45) => (t < t0 ? 0 : eob(win(t, t0, t0 + d)))
      const fade = (t, a, b, f = 0.3) => clamp(Math.min(win(t, a, a + f), 1 - win(t, b - f, b)))
      let seed = 7
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)

      // ---------- renderer, scene ----------
      const canvas = document.getElementById("three")
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true })
      renderer.setSize(1080, 1920, false); renderer.setPixelRatio(1)
      renderer.setClearColor(0x0c1c22)
      renderer.outputColorSpace = THREE.SRGBColorSpace
      const scene = new THREE.Scene()
      scene.fog = new THREE.Fog(0x0c1c22, 40, 190)
      const camera = new THREE.PerspectiveCamera(44, 1080 / 1920, 0.05, 400)
      scene.add(new THREE.HemisphereLight(0xcfeaff, 0x0a2a30, 1.5))
      const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(10, 20, 12); scene.add(key)
      const C = { cyan: 0x3fd6f0, white: 0xf4fbfd, dark: 0x1b2026, green: 0x1f7a4a, gold: 0xd8a94a, copper: 0xd07a3a, red: 0xf0785a }
      const mat = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.55, metalness: 0.1 }, o))
      const basic = (color, o = {}) => new THREE.MeshBasicMaterial(Object.assign({ color, transparent: true, depthWrite: false }, o))

      const fatLine = (color, width, n) => { const g = new LineGeometry(); g.setPositions(new Float32Array(n * 3)); const m = new LineMaterial({ color, linewidth: width, transparent: true, depthWrite: false }); m.resolution.set(1080, 1920); const l = new Line2(g, m); l.frustumCulled = false; l.buf = new Float32Array(n * 3); l.n = n; scene.add(l); return l }
      const flush = (l) => l.geometry.setPositions(l.buf)
      // ground: dark teal floor, faint grid, glowing rings
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), mat(0x10282e, { roughness: 0.95 }))
      ground.rotation.x = -Math.PI / 2; scene.add(ground)
      const grid = new THREE.GridHelper(200, 100, 0x2a5a64, 0x1a3a42); grid.position.set(30, 0.002, -5); grid.material.transparent = true; grid.material.opacity = 0.35; scene.add(grid)
      const ringAt = (x, z, r, op = 0.7) => { const m = new THREE.Mesh(new THREE.RingGeometry(r, r + 0.04, 96), basic(C.cyan, { opacity: op, side: THREE.DoubleSide })); m.rotation.x = -Math.PI / 2; m.position.set(x, 0.01, z); scene.add(m); return m }
      const padA = [ringAt(0, 0, 2.2), ringAt(0, 0, 2.6, 0.35)]
      const padB = [ringAt(64, 0, 2.2), ringAt(64, 0, 2.6, 0.35)]

      // floating dust (deterministic drift)
      const NDUST = 900, dustPos = new Float32Array(NDUST * 3), dust0 = []
      for (let i = 0; i < NDUST; i++) { const p = [-15 + rnd() * 95, 0.3 + rnd() * 14, -30 + rnd() * 45]; dust0.push(p) }
      const dustGeo = new THREE.BufferGeometry(); dustGeo.setAttribute("position", new THREE.BufferAttribute(dustPos, 3))
      const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0x9fe6f2, size: 0.06, transparent: true, opacity: 0.55 })); scene.add(dust)

      // ---------- 0. two yogurt pots and a string ----------
      const pot = () => { const g = new THREE.Group(); const body = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.27, 0.62, 40, 1, true), mat(0xf4f1e8, { side: THREE.DoubleSide })); body.position.y = 0.31; const bottom = new THREE.Mesh(new THREE.CircleGeometry(0.27, 40), mat(0xd8d4ca)); bottom.rotation.x = -Math.PI / 2; bottom.position.y = 0.01; const band = new THREE.Mesh(new THREE.CylinderGeometry(0.345, 0.32, 0.16, 40, 1, true), mat(C.cyan, { side: THREE.DoubleSide })); band.position.y = 0.42; g.add(body, bottom, band); g.rotation.z = Math.PI / 2; return g }
      const potA = pot(), potB = pot(); scene.add(potA, potB)
      const strL = fatLine(0xf4e8c8, 4, 24), strR = fatLine(0xf4e8c8, 4, 24)

      // ---------- 1. a phone (A) and its insides ----------
      function makePhone() {
        const g = new THREE.Group()
        const shellMat = mat(0x22262e, { roughness: 0.35, metalness: 0.4, transparent: true })
        const shell = new THREE.Mesh(new RoundedBoxGeometry(1.4, 0.16, 2.8, 4, 0.14), shellMat); shell.position.y = 0.09
        const scrMat = mat(0x0a3a46, { emissive: 0x0b4a58, emissiveIntensity: 0.6, roughness: 0.15, transparent: true })
        const scr = new THREE.Mesh(new THREE.PlaneGeometry(1.24, 2.6), scrMat); scr.rotation.x = -Math.PI / 2; scr.position.y = 0.172
        const board = new THREE.Mesh(new THREE.BoxGeometry(1.16, 0.03, 2.3), mat(C.green, { roughness: 0.6 })); board.position.y = 0.08
        const traces = new THREE.Group(); for (let i = 0; i < 9; i++) { const tr = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.005, 0.6 + (i % 3) * 0.3), basic(0xb8e0a0, { opacity: 0.8 })); tr.position.set(-0.45 + i * 0.11, 0.097, -0.2 + (i % 2) * 0.4); traces.add(tr) }
        const chip = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.05, 0.36), mat(0x111418, { roughness: 0.3, metalness: 0.5 })); chip.position.set(0, 0.12, 0.15)
        const chipDot = new THREE.Mesh(new THREE.CircleGeometry(0.03, 16), basic(C.cyan)); chipDot.rotation.x = -Math.PI / 2; chipDot.position.set(-0.12, 0.146, 0.03)
        const mic = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.06, 24), mat(0x8a9aa8, { metalness: 0.7, roughness: 0.3 })); mic.position.set(0.3, 0.12, 1.22)
        const memb = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.01, 24), mat(0xe8eef2, { emissive: C.cyan, emissiveIntensity: 0 })); memb.position.set(0.3, 0.155, 1.22)
        const spk = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.04, 0.08), mat(0x8a9aa8, { metalness: 0.7, roughness: 0.3 })); spk.position.set(0, 0.12, -1.22)
        const spkM = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.01, 0.05), mat(0xe8eef2, { emissive: C.cyan, emissiveIntensity: 0 })); spkM.position.set(0, 0.146, -1.22)
        const antMat = mat(C.copper, { emissive: C.copper, emissiveIntensity: 0, metalness: 0.6, roughness: 0.3 })
        const ant = new THREE.Group(); [[0, -1.34, 1.1, 0.05], [-0.62, -1.0, 0.05, 0.7], [0.62, -1.0, 0.05, 0.7]].forEach(([x, z, w, d]) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.03, d), antMat); m.position.set(x, 0.11, z); ant.add(m) })

        g.add(shell, scr, board, traces, chip, chipDot, mic, memb, spk, spkM, ant, sim)
        return { g, shell, shellMat, scr, scrMat, board, traces, chip, chipDot, mic, memb, spk, spkM, ant, antMat, sim, simGold }

      const A = makePhone(); scene.add(A.g)

      const rangeCircle = new THREE.Mesh(new THREE.RingGeometry(4.0, 4.06, 96), basic(C.red, { opacity: 0, side: THREE.DoubleSide })); rangeCircle.rotation.x = -Math.PI / 2; rangeCircle.position.y = 0.02; scene.add(rangeCircle)

      // ---------- 2. relay towers ----------
      function makeTower() {
        const g = new THREE.Group(); const steel = mat(0xb8c4cc, { metalness: 0.6, roughness: 0.4 })
        const H = 8, legs = [[-0.9, -0.9], [0.9, -0.9], [0.9, 0.9], [-0.9, 0.9]]
        legs.forEach(([x, z]) => { const p0 = new THREE.Vector3(x, 0, z), p1 = new THREE.Vector3(x * 0.25, H, z * 0.25); const len = p0.distanceTo(p1); const m = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, len, 6), steel); m.position.copy(p0.clone().add(p1).multiplyScalar(0.5)); m.lookAt(p1); m.rotateX(Math.PI / 2); g.add(m) })
        for (let k = 1; k < 8; k++) { const y = k, s = 1 - (y / H) * 0.75; for (let e = 0; e < 4; e++) { const [x0, z0] = legs[e], [x1, z1] = legs[(e + 1) % 4]; const a = new THREE.Vector3(x0 * s, y, z0 * s), b = new THREE.Vector3(x1 * s, y, z1 * s); const m = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, a.distanceTo(b), 4), steel); m.position.copy(a.clone().add(b).multiplyScalar(0.5)); m.lookAt(b); m.rotateX(Math.PI / 2); g.add(m) } }
        const panels = []; for (let i = 0; i < 3; i++) { const a = (i / 3) * Math.PI * 2; const p = new THREE.Mesh(new THREE.BoxGeometry(0.34, 1.3, 0.14), mat(0xf4f4f0, { emissive: C.cyan, emissiveIntensity: 0 })); p.position.set(Math.cos(a) * 0.55, H + 0.2, Math.sin(a) * 0.55); p.rotation.y = -a; g.add(p); panels.push(p) }
        const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 8), basic(0xff4040, { opacity: 1 })); beacon.position.y = H + 1.1; g.add(beacon)
        return { g, panels, beacon }

      const hexes = []
      function hexGrid(cx, cz) { const R = 4.2, w = Math.sqrt(3) * R; for (let q = -2; q <= 2; q++) for (let r = -2; r <= 2; r++) { if (Math.abs(q + r) > 2) continue; const x = cx + w * (q + r / 2), z = cz + 1.5 * R * r; const pts = Array.from({ length: 7 }, (_, i) => { const a = (i / 6) * Math.PI * 2 + Math.PI / 6; return new THREE.Vector3(x + Math.cos(a) * R * 0.97, 0.02, z + Math.sin(a) * R * 0.97) }); const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), hexMat.clone()); scene.add(ln); hexes.push({ ln, x, z }) } }
