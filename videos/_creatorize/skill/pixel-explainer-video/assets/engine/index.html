<!doctype html>
<html><head><meta charset="utf-8"><title>pixel-explainer</title><link rel="icon" href="data:,">
<style>
  @font-face { font-family: 'Orbitron'; font-weight: 500 900; src: url('fonts/orbitron.woff2') format('woff2'); }
  @font-face { font-family: 'Share Tech Mono'; font-weight: 400; src: url('fonts/share-tech-mono.woff2') format('woff2'); }
  html,body{margin:0;background:#0e0f18;color:#ece8d6;font:13px monospace}
  #view{display:block;width:min(100vw,1280px);aspect-ratio:16/9;margin:0 auto;background:#000}
  .bar{display:flex;gap:8px;align-items:center;width:min(100vw,1280px);margin:6px auto}
  input{flex:1}
</style></head>
<body>
<canvas id="view" width="1920" height="1080"></canvas>
<div class="bar"><button id="pp">play</button><input id="scrub" type="range" min="0" max="1" step="0.01" value="0"><span id="tt">0.0s</span></div>
<audio id="au" preload="auto"></audio>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
// Generic player/render host. Everything project-specific lives in project.json + scenes/*.js.
import * as E from './engine.js';
const P = await (await fetch('project.json', { cache: 'no-store' })).json();
await Promise.all([document.fonts.load('900 20px Orbitron'), document.fonts.load('700 20px Orbitron'), document.fonts.load("20px 'Share Tech Mono'")]);
await E.loadTimeline(P.timeline || 'audio/timeline.json');
await E.loadImages(Object.fromEntries(Object.entries(P.images || {}).map(([k, f]) => [k, f.startsWith('assets/') ? f : 'assets/' + f])));
const failed = [];
// plain imports (no ?v= cache-busting): a module imported from two places must resolve to the same instance
for (const m of P.scenes) { try { await import(`./scenes/${m}.js`); } catch (e) { failed.push(m + ': ' + e.message); console.error('scene module', m, e); } }
const END = P.end;
E.finalizeShots(END);
Object.assign(window, { E, END, P, sceneErrors: failed });
const view = document.getElementById('view').getContext('2d');
const au = document.getElementById('au'), scrub = document.getElementById('scrub'), tt = document.getElementById('tt'), pp = document.getElementById('pp');
au.src = P.previewAudio || 'audio/clean.wav'; scrub.max = END;
let t = 0, playing = false;
pp.onclick = () => { playing = !playing; pp.textContent = playing ? 'pause' : 'play'; if (playing) { au.currentTime = t; au.play(); } else au.pause(); };
scrub.oninput = () => { t = +scrub.value; if (playing) au.currentTime = t; };
window.seek = v => { playing = false; au.pause(); t = v; };
window.ready = true;
(function loop() {
  if (!window.exporting) {
    if (playing) t = au.currentTime;
    try { E.compose(t); view.drawImage(E.outCanvas, 0, 0); } catch (e) { console.error(e); }
    scrub.value = t; tt.textContent = t.toFixed(2) + 's';
  }
  requestAnimationFrame(loop);
})();
</script></body></html>
