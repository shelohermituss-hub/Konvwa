<!doctype html>
<html lang="en" data-resolution="landscape-4k">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=3840, height=2160" />
    <!-- smooth-recut skeleton · doctrine: editing-style.md · motion: motion/smooth.js -->
    <style>
      @font-face { font-family: "Inter"; src: url("fonts/Inter-400-latin.woff2") format("woff2"); font-weight: 400; font-display: block; }
      @font-face { font-family: "Inter"; src: url("fonts/Inter-Medium.ttf") format("truetype"); font-weight: 500; font-display: block; }
      @font-face { font-family: "Inter"; src: url("fonts/Inter-700-latin.woff2") format("woff2"); font-weight: 700; font-display: block; }
      :root {
        --white: #ffffff; --lg: #e5e5ea; --mg: #8e8e93; --dg2: #3a3a3c; --dg: #1c1c1e;
        --blue: #007aff; --green: #34c759; --orange: #ff9500; --red: #ff3b30;
        --accent: var(--orange); /* pick the one that matches the footage's light */
        --shadow-text: 0 6px 24px rgba(0, 0, 0, 0.45);
        --card-bg: rgba(28, 28, 30, 0.78); --card-stroke: rgba(255, 255, 255, 0.18);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 3840px; height: 2160px; overflow: hidden; background: #000; font-family: "Inter", ui-sans-serif, system-ui, sans-serif; color: var(--white); -webkit-font-smoothing: antialiased; }
      #root { position: relative; width: 3840px; height: 2160px; overflow: hidden; background: #000; }
      .cam { position: absolute; inset: 0; will-change: transform; }
      #stage { position: absolute; inset: 0; }
      #stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #gfx { position: absolute; inset: 0; }
      .scene { position: absolute; inset: 0; pointer-events: none; }
      .n { position: absolute; inset: 0; }
      /* adjust columns to the subject's safe zone (storyboard.json) */
      .col-l { position: absolute; left: 260px; width: 1040px; top: 1040px; transform: translateY(-50%); }
      .col-r { position: absolute; left: 2560px; width: 1060px; top: 1040px; transform: translateY(-50%); }
      .mask { overflow: hidden; padding: 6px 400px; margin: 0 -400px; }
      .h1 { font-size: 172px; font-weight: 700; line-height: 1.0; letter-spacing: -0.02em; text-shadow: var(--shadow-text); }
      .h2 { font-size: 132px; font-weight: 700; line-height: 1.02; letter-spacing: -0.02em; text-shadow: var(--shadow-text); }
      .sub { font-size: 68px; font-weight: 500; line-height: 1.2; color: var(--lg); text-shadow: var(--shadow-text); }
      .label { font-size: 48px; font-weight: 500; color: var(--mg); }
      .w { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }
      .acc { color: var(--accent); }
      .card { background: var(--card-bg); backdrop-filter: blur(40px); border-radius: 40px; box-shadow: 0 24px 60px rgba(0,0,0,0.35), inset 0 0 0 1.5px var(--card-stroke); padding: 48px 56px; }
      .pill { display: inline-flex; align-items: center; gap: 28px; background: var(--card-bg); backdrop-filter: blur(40px); border-radius: 999px; box-shadow: 0 16px 40px rgba(0,0,0,0.3), inset 0 0 0 1.5px var(--card-stroke); padding: 30px 56px 30px 44px; font-size: 72px; font-weight: 700; white-space: nowrap; }
      .pill i { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); flex: none; }
      .row { display: flex; align-items: center; gap: 30px; font-size: 76px; font-weight: 700; letter-spacing: -0.015em; text-shadow: var(--shadow-text); }
      .row .num { font-size: 44px; font-weight: 500; color: var(--mg); width: 84px; }
      .bubble { display: inline-block; padding: 30px 48px; border-radius: 44px; font-size: 68px; font-weight: 500; white-space: nowrap; box-shadow: 0 18px 44px rgba(0,0,0,0.35); }
      .bubble.out { background: var(--blue); color: #fff; border-bottom-right-radius: 12px; }
      .bigstat { font-size: 300px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: var(--shadow-text); }
      .strike { position: relative; display: inline-block; font-size: 88px; font-weight: 700; text-shadow: var(--shadow-text); }
      .strike .ln { position: absolute; left: -10px; right: -10px; top: 52%; height: 12px; border-radius: 6px; background: var(--red); transform-origin: left center; }
      .track { height: 34px; border-radius: 17px; background: rgba(255,255,255,0.14); overflow: hidden; }
      .fill { height: 100%; border-radius: 17px; background: var(--accent); transform-origin: left center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="DURATION" data-fps="30" data-width="3840" data-height="2160">
      <div class="cam" id="cam-drift"><div class="cam" id="cam-snap"><div id="stage">
        <video id="a-roll" class="clip" src="input-video.mp4" muted playsinline data-start="0" data-duration="DURATION" data-track-index="0"></video>
        <div id="gfx">

          <!-- one .scene per card. Example: -->
          <div class="scene clip" id="s1" data-start="0" data-duration="3" data-track-index="1">
            <div class="n" id="s1-n2"><div class="n" id="s1-n1">
              <div class="col-l">
                <div class="label" id="s1-k">kicker</div>
                <div class="h1" id="s1-t" style="margin-top: 28px;">headline<br />with <span class="acc">accent</span></div>
              </div>
            </div></div>
          </div>

        </div>
      </div></div></div>
      <audio id="a-roll-audio" src="input-video.mp4" data-start="0" data-duration="DURATION" data-track-index="9" data-volume="1"></audio>

      <script src="vendor/gsap.min.js"></script>
      <script src="motion/smooth.js"></script>
      <script>
        (function () {
          const S = SMOOTH, q = S.q, OP = S.OP;
          const tl = gsap.timeline({ paused: true });
          const SUBJECT = "48% 40%";           // zoom origin: on the subject; shift toward the active column
          tl.set(["#cam-snap", "#cam-drift"], { transformOrigin: SUBJECT }, 0);
          tl.fromTo("#cam-drift", { scale: 1.0 }, { scale: 1.03, duration: 2.9, ease: "none" }, 0); // opening push

          // ── s1 example: entrance → drift → exit; next scene's entrance overlaps this exit
          S.ramp(tl, "#s1-k", 0.05, { dur: 0.45, stagger: 0.06 });
          S.ramp(tl, "#s1-t", 0.25, { scaleHit: true });
          S.drift(tl, "#s1-n2", 0.6, 2.2, { y: -22 });
          S.rampOut(tl, "#s1-t", 2.55); S.rampOut(tl, "#s1-k", 2.52);
          // S.punchIn(tl, T, { scale: 1.05, dur: 0.5, driftTo: 1.02, driftDur: 3, origin: "40% 42%" });
          // S.zoomOut(tl, T2, { dur: 0.8 });

          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
