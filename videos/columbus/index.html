        SC.forEach((s, i) => {
          tl.set(s, { visibility: 'visible' }, CUT[i])
          tl.set(s, { visibility: 'hidden' }, CUT[i + 1])
          tl.fromTo(s + ' .cam', { scale: 1 }, { scale: 1.06, duration: CUT[i + 1] - CUT[i], ease: 'none', immediateRender: false }, CUT[i])
          if (i) tl.fromTo(s + ' .cam', { y: 30 }, { y: 0, duration: 0.25, ease: 'power3.out', immediateRender: false }, CUT[i])
        })
        const pop = (sel, t, o) => tl.fromTo(sel, Object.assign({ autoAlpha: 0, scale: 0.4 }, o || {}), { autoAlpha: 1, scale: 1, x: 0, y: 0, rotation: (o && o.rot) || 0, duration: 0.4, ease: 'back.out(1.8)' }, t)
        const rise = (sel, t) => tl.fromTo(sel, { y: 220 }, { y: 0, duration: 0.45, ease: 'expo.out' }, t)
        const out = (sel, t) => tl.to(sel, { autoAlpha: 0, scale: 0.7, duration: 0.18, ease: 'power2.in' }, t)
        const count = (node, from, to, t0, t1, fmt) => { const o = { v: from }; tl.fromTo(o, { v: from }, { v: to, duration: t1 - t0, ease: 'power2.out', immediateRender: false, onUpdate: () => { node.textContent = fmt(o.v) } }, t0) }
        const spin = (sel, t0, t1, deg) => tl.fromTo(sel, { rotation: 0 }, { rotation: deg, duration: t1 - t0, ease: 'none', immediateRender: false }, t0)
        const stamp = (sel, t, rot) => tl.fromTo(sel, { autoAlpha: 0, scale: 2.6, rotation: 4 }, { autoAlpha: 1, scale: 1, rotation: rot, duration: 0.2, ease: 'power4.in' }, t)
        const shake = (sel, t) => tl.fromTo(sel, { x: 0 }, { x: 14, duration: 0.04, yoyo: true, repeat: 5, ease: 'none', immediateRender: false }, t)
        const glow = (sel, t, col) => { tl.fromTo(sel, { fill: '#2a3140' }, { fill: col, duration: 0.3, immediateRender: false }, t); tl.fromTo(sel, { filter: 'drop-shadow(0 0 0px rgba(255,190,40,0))' }, { filter: 'drop-shadow(0 0 14px rgba(255,190,40,0.95))', duration: 0.3, immediateRender: false }, t) }
        const bob = (sel, t0, t1) => tl.fromTo(sel, { y: 0, rotation: -2 }, { y: -14, rotation: 2, duration: 0.7, yoyo: true, repeat: Math.max(1, Math.floor((t1 - t0) / 0.7)), ease: 'sine.inOut', immediateRender: false }, t0)
        const waveMove = (sel, t0, t1) => document.querySelectorAll(sel + ' .wave').forEach((w, i) => tl.fromTo(w, { x: 0 }, { x: i % 2 ? -120 : 120, duration: t1 - t0, ease: 'none', immediateRender: false }, t0))

        // 1. the statue, rays, sparkles, HERO
        spin('#rays1', 0, CUT[1], 20)
        tl.fromTo(['#statue1', '#ped1'], { y: 260 }, { y: 0, duration: 0.45, ease: 'expo.out' }, 0)
        document.querySelectorAll('#spark1 .sp').forEach((p, i) => tl.fromTo(p, { scale: 0, rotation: 0 }, { scale: 1, rotation: 45, duration: 0.35, yoyo: true, repeat: 3, ease: 'sine.inOut', immediateRender: false }, 0.2 + 0.08 * i))
        pop('#hero1', T[7] - 0.08, { rot: -4 })
        // 2. the textbook; FALSE
        pop('#book2', CUT[1] + 0.02, { y: 200, scale: 0.85 })
        stamp('#false2', T[17] - 0.04, -10)
        shake('#s2 .cam', T[17] + 0.16)
        // 3. the Americas fill with people; MILLIONS; 15,000+ YEARS
        tl.fromTo('#map3', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, CUT[2])
        document.querySelectorAll('#map3 .dot').forEach((d, i) => tl.fromTo(d, { scale: 0, autoAlpha: 0, transformOrigin: '50% 50%' }, { scale: 1, autoAlpha: 1, duration: 0.25, ease: 'back.out(3)', immediateRender: false }, T[26] - 0.1 + (i % 35) * 0.03))
        gsap.set('#map3 .dot', { autoAlpha: 0 })
        pop('#mil3', T[26] - 0.05, { scale: 0.6 })
        out('#mil3', T[37] - 0.2)
        pop('#yrs3', T[37] - 0.05, { scale: 0.6 })
        // 4. the longship sails in; NEWFOUNDLAND; 1021; ≈ 500 years before
        waveMove('#sea4', CUT[3], CUT[4])
        tl.fromTo('#viking4', { x: -900 }, { x: 0, duration: 0.9, ease: 'power2.out' }, CUT[3] + 0.05)
        bob('#viking4', CUT[3] + 0.9, CUT[4])
        pop('#nf4', T[49] - 0.05, { rot: -3 })
        pop('#y4', T[61] - 0.05, { scale: 0.6 })
        count($('y4'), 900, 1021, T[61] - 0.05, T[62] + 0.3, (v) => String(Math.round(v)))
        out('#nf4', T[63] - 0.2)
        pop('#b4', T[63] - 0.05, { rot: -3 })
        // 5. Columbus lost; the bubble ASIA?; « INDIANS »
        rise('#col5', CUT[4])
        pop('#bub5', T[80] - 0.05, { scale: 0.5 })
        pop('#ind5', T[87] - 0.05, { rot: -5 })
        tl.fromTo('#col5', { rotation: -2 }, { rotation: 2, duration: 0.5, yoyo: true, repeat: 5, ease: 'sine.inOut', immediateRender: false }, CUT[4] + 0.5)
        blink('#col5', [CUT[4] + 0.8, CUT[4] + 2.2])
        // 6. Caribbean: red X on the U.S. mainland, Bahamas, Hispaniola
        tl.fromTo('#c-USA', { fill: '#3a2a30' }, { fill: '#6a2a30', duration: 0.3, immediateRender: false }, T[95] - 0.05)
        pop('#x6', T[95] - 0.05, { scale: 2, rot: 20 })
        pop('#never6', T[96] - 0.05, { rot: -4 })
        glow('#c-BHS', T[101] - 0.05, '#ffc93c')
        pop('#bah6', T[101], { y: 20 })
        glow('#c-HTI', T[107] - 0.05, '#ffc93c'); glow('#c-DOM', T[107] - 0.05, '#ffc93c')
        pop('#his6', T[107], { y: 20 })
        // 7. Santa María: bobbing, then it tilts and sinks; DEC 25, 1492; HAITI
        waveMove('#sea7', CUT[6], CUT[7])
        tl.fromTo('#ship7', { x: -600 }, { x: 0, duration: 0.8, ease: 'power2.out' }, CUT[6] + 0.02)
        bob('#ship7', CUT[6] + 0.8, T[118])
        pop('#y7', T[109] - 0.05, { scale: 0.6 })
        tl.to('#ship7', { rotation: 18, y: 260, duration: 1.4, ease: 'power2.in' }, T[118] - 0.05)
        pop('#haiti7', T[127] - 0.05, { rot: -3 })
        // 8. Irving, 1828, the book, HALF LEGEND
        rise('#irv8', CUT[7])
        pop('#y8', T[136] - 0.05, { scale: 0.6 })
        count($('y8'), 1700, 1828, T[136] - 0.05, T[137] + 0.3, (v) => String(Math.round(v)))
        pop('#irl8', T[138] - 0.05, { rot: -3 })
        pop('#book8', T[142] - 0.1, { rot: 8, y: 120 })
        out('#irl8', T[146] - 0.2)
        stamp('#leg8', T[146] - 0.04, -8)
        blink('#irv8', [CUT[7] + 1.2])
        // 9. HERO? the statue cracks
        gsap.set('#crk', { attr: { 'stroke-dasharray': 700, 'stroke-dashoffset': 700 } })
        tl.fromTo('#crk', { attr: { 'stroke-dashoffset': 700 } }, { attr: { 'stroke-dashoffset': 0 }, duration: 0.4, ease: 'power2.in', immediateRender: false }, CUT[8] + 0.15)
        pop('#q9', CUT[8] + 0.02, { scale: 0.6 })
        shake('#s9 .cam', CUT[8] + 0.5)
        // 10. the Taíno, gold falling, OR ELSE
        rise('#tai10', CUT[9])
        pop('#tl10', T[156] - 0.05, { rot: -3 })
        document.querySelectorAll('#gold10 .nug').forEach((g, i) => { const x = +g.dataset.x; tl.fromTo(g, { x, y: -120 - (i % 5) * 140, rotation: 0 }, { x, y: 1300 + (i % 4) * 40, rotation: 200, duration: 0.9, ease: 'power1.in', immediateRender: false }, T[160] - 0.4 + (i % 8) * 0.07) })
        gsap.set('#gold10 .nug', { y: -400 })
        stamp('#else10', T[165] - 0.04, -8)
        shake('#s10 .cam', T[165] + 0.16)
        blink('#tai10', [CUT[9] + 1.0])
        // 11. 1495: a caravel leaves, chains, SHIPPED AS SLAVES
        waveMove('#sea11', CUT[10], CUT[11])
        bob('#ship11', CUT[10], CUT[11])
        tl.fromTo('#ship11', { x: 0 }, { x: 300, duration: CUT[11] - CUT[10], ease: 'none', immediateRender: false }, CUT[10])
        pop('#y11', CUT[10] + 0.02, { scale: 0.6 })
        count($('y11'), 1492, 1495, CUT[10] + 0.02, CUT[10] + 0.5, (v) => String(Math.round(v)))
        tl.fromTo('#chain11 .ch', { x: -1100 }, { x: 0, duration: 0.5, ease: 'power3.out' }, T[171] - 0.1)
        pop('#sl11', T[177] - 0.05, { rot: -3 })
        // 12. the crowd fades away; 50 YEARS
        document.querySelectorAll('#crowd12 .per').forEach((p, i) => tl.fromTo(p, { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.2, ease: 'power2.out', immediateRender: false }, CUT[11] + i * 0.015))
        gsap.set('#crowd12 .per', { autoAlpha: 0 })
        const order = Array.from({ length: 30 }, (_, i) => i).sort((a, b) => ((a * 7) % 30) - ((b * 7) % 30))
        const per = document.querySelectorAll('#crowd12 .per')
        order.forEach((k, j) => { if (j < 28) tl.to(per[k], { autoAlpha: 0.06, duration: 0.25 }, T[183] + j * ((T[193] - T[183]) / 28)) })
        pop('#y12', T[192] - 0.05, { scale: 0.6 })
        // 13. arrested in chains
        spin('#rays13', CUT[12], CUT[13], 20)
        rise('#col13', CUT[12])
        pop('#y13', T[199] - 0.05, { scale: 0.6 })
        count($('y13'), 1495, 1500, T[199] - 0.05, T[200] + 0.3, (v) => String(Math.round(v)))
        stamp('#arr13', T[203] - 0.04, -6)
        tl.fromTo('#chain13 .ch', { x: 1100 }, { x: 0, duration: 0.5, ease: 'power3.out' }, T[208] - 0.2)
        shake('#s13 .cam', T[208] + 0.3)
        // 14. mirror line: the statue topples; the Taíno in golden light
        tl.to('#statue14', { rotation: 70, x: 420, y: 160, duration: 0.8, ease: 'power3.in' }, T[212])
        spin('#rays15', CUT[14], END, 20)
        rise('#tai15', CUT[14])
        pop('#fin15', CUT[14] + 0.05, { scale: 0.6 })
        blink('#tai15', [CUT[14] + 1.2])

        // ---------- captions: groups of 2-4 words, the spoken word in a red box ----------
        const caps = $('caps')
        const G = []
        let cur = []
        WORDS.forEach((w, k) => {
          if (!w) return
          cur.push(k)
          const len = cur.reduce((n, j) => n + WORDS[j].length + 1, 0)
          if (/[.,:;?!…]$/.test(w) || cur.length >= 4 || len > 20) { G.push(cur); cur = [] }
        })
        if (cur.length) G.push(cur)
        G.forEach((g, gi) => {
          const box = document.createElement('div'); box.className = 'grp'; caps.appendChild(box)
          const t0 = T[g[0]] - 0.04, t1 = gi < G.length - 1 ? T[G[gi + 1][0]] - 0.04 : END
          tl.set(box, { visibility: 'visible' }, t0)
          tl.set(box, { visibility: 'hidden' }, t1)
          tl.fromTo(box, { scale: 0.92 }, { scale: 1, duration: 0.12, ease: 'power2.out', immediateRender: false }, t0)
          g.forEach((k, j) => {
            const s = document.createElement('span'); s.className = 'cw'; s.textContent = WORDS[k]; box.appendChild(s)
            const next = j < g.length - 1 ? T[g[j + 1]] - 0.04 : t1
            tl.set(s, { '--on': 1 }, T[k] - 0.04)
            tl.set(s, { '--on': 0 }, next)
          })
        })
        tl.fromTo('#prog', { scaleX: 0 }, { scaleX: 1, duration: END, ease: 'none', immediateRender: false }, 0)
        gsap.set('#prog', { scaleX: 0 })

        window.__timelines = window.__timelines || {}
        window.__timelines['main'] = tl
      })()
    </script>
  </body>
</html>
