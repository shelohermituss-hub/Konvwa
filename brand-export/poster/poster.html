<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1080px;position:relative;overflow:hidden;background:#fff;font-family:Poppins,Arial,sans-serif;color:#0A1628}
.c{position:absolute;border-radius:50%}
.c1{width:760px;height:760px;background:#0A1628;right:-170px;top:330px}
.c2{width:560px;height:560px;background:#F05A28;left:-250px;bottom:-250px}
.c3{width:70px;height:70px;background:#F05A28;left:520px;top:560px}
.logo{position:absolute;right:70px;top:62px;display:flex;align-items:center;gap:14px}
.logo img{height:58px}.logo b{font-size:34px;font-weight:800;letter-spacing:.2em;color:#0A1628}
h1{position:absolute;left:70px;top:70px;width:640px;font-size:68px;line-height:1.12;font-weight:400;letter-spacing:-.01em}
h1 b{font-weight:800}h1 em{font-style:normal;font-weight:800;color:#F05A28}
.sub{position:absolute;left:70px;top:395px;font-size:27px;font-weight:500;color:#475569;width:470px;line-height:1.4}
.shadow{position:absolute;left:380px;top:905px;width:560px;height:60px;border-radius:50%;background:radial-gradient(closest-side,rgba(10,22,40,.38),transparent);filter:blur(10px)}
.fk{position:absolute;left:300px;top:415px;width:720px;filter:drop-shadow(0 30px 30px rgba(0,0,0,.25))}
.pills{position:absolute;left:70px;bottom:70px;display:flex;flex-direction:column;gap:14px}
.pill{display:flex;align-items:center;gap:12px;background:#fff;border-radius:999px;padding:9px 26px 9px 12px;font-weight:700;font-size:25px;box-shadow:0 6px 22px rgba(10,22,40,.16);width:max-content}
.pill img{height:38px;width:38px;object-fit:contain;border-radius:8px}
.pay{position:absolute;right:70px;bottom:62px;background:#F05A28;color:#fff;border-radius:22px;padding:18px 28px;text-align:right}
.pay small{display:block;font-size:17px;font-weight:500;opacity:.9;letter-spacing:.06em;text-transform:uppercase}
.pay strong{font-size:30px;font-weight:700}
.url{position:absolute;left:340px;bottom:70px;font-size:26px;font-weight:700;color:#fff;background:#F05A28;border-radius:999px;padding:12px 26px;display:none}
</style></head><body>
<div class="c c1"></div><div class="c c2"></div><div class="c c3"></div>
<div class="logo"><img src="konvwa-logo.svg"><b>KONVWA</b></div>
<h1>Importez depuis <b>Alibaba, Shein</b> et <b>Temu</b> vers <em>Haïti</em></h1>
<p class="sub">Un devis clair, un suivi jusqu'à votre porte. Sans carte bancaire étrangère.</p>
<div class="shadow"></div>
<img class="fk" src="forklift.png">
<div class="pills">
 <div class="pill"><img src="alibaba.png">Alibaba</div>
 <div class="pill"><img src="shein.png">Shein</div>
 <div class="pill"><img src="temu.jpg">Temu</div>
</div>
<div class="pay"><small>Payez en gourdes avec</small><strong>MonCash · NatCash</strong><small style="margin-top:8px;opacity:1;color:#fff;font-size:20px">konvwa.shop</small></div>
</body></html>
